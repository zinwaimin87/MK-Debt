name: Auto interest first payment
on:
  push:
    branches: [main]
    paths:
      - .force-auto-interest
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install interest-first payment flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'MK_AUTO_INTEREST_FIRST_V1' in s:
              print('already installed')
              raise SystemExit(0)
          js=r'''<script>
          const MK_AUTO_INTEREST_FIRST_V1=true;
          function savePayment(i){
            const p=data.people[i];
            const amount=Number(document.getElementById('payAmt')?.value||0);
            if(amount<=0)return alert('ပေးချေငွေထည့်ပါ');
            const type=document.getElementById('payType')?.value||'both';
            const date=document.getElementById('payDate')?.value||new Date().toISOString().slice(0,10);
            const month=document.getElementById('payMonth')?.value||monthKey(date);
            const note=document.getElementById('payNote')?.value||'';
            const before=calc(p);
            if(type==='both' && amount>before.balance){
              const ok=confirm('ပေးချေငွေ '+money(amount)+' သည် လက်ကျန် '+money(before.balance)+' ထက်များနေပါသည်။ ပိုငွေကို မှတ်တမ်းတင်မည်။ ဆက်လုပ်မလား?');
              if(!ok)return;
            }
            p.records=p.records||[];
            const rec={id:Date.now(),type:'payment',amount,date,month,note,paymentType:type};
            p.records.unshift(rec);
            const l=syncInterest(p);
            const a=l.allocations[String(rec.id)]||{};
            rec.interestApplied=Number(a.interestApplied||0);
            rec.principalApplied=Number(a.principalApplied||0);
            rec.unapplied=Number(a.unapplied||0);
            save();
            log(p.name+' ငွေပေး '+money(amount)+' · အတိုး '+money(rec.interestApplied)+' · အရင်း '+money(rec.principalApplied)+(rec.unapplied>0?' · ပိုငွေ '+money(rec.unapplied):''));
            closeModal();
            detail(i);
          }
          function payment(i){
            const p=data.people[i],today=new Date().toISOString().slice(0,10),month=monthKey(today),c=calc(p);
            modal(`<h2>ငွေပေးချေမှု</h2><div class="field"><label>ပေးချေငွေ</label><input id="payAmt" type="number" min="0" value="${c.balance}" oninput="updateAutoPayPreview(${i})"></div><div class="field"><label>ပေးချေသည့်ရက်</label><input id="payDate" type="date" value="${today}"></div><div class="field"><label>အတိုးတွက်/ပေးမည့်လ</label><input id="payMonth" type="month" value="${month}" onchange="updateAutoPayPreview(${i})"></div><select class="field" id="payType" onchange="updateAutoPayPreview(${i})"><option value="both">အတိုး + အရင်း (Auto)</option><option value="interest">အတိုးသာ</option><option value="principal">အရင်းသာ</option></select><div id="interestPreview" class="mini"></div><div id="autoPayPreview" class="card"></div><div class="field"><label>မှတ်ချက်</label><input id="payNote"></div><button class="btn primary wide" onclick="savePayment(${i})">သိမ်းမည်</button>`);
            updateAutoPayPreview(i);
          }
          function updateAutoPayPreview(i){
            const p=data.people[i],amount=Number(document.getElementById('payAmt')?.value||0),month=document.getElementById('payMonth')?.value||monthKey(new Date()),type=document.getElementById('payType')?.value||'both',el=document.getElementById('autoPayPreview');
            if(!el)return;
            if(amount<=0){el.innerHTML='';return;}
            const l=rebuildLedger(p),qs=l.months.filter(x=>x.month<=month&&x.due>x.paid);
            let interestDue=qs.reduce((a,x)=>a+Math.max(0,x.due-x.paid),0),interest=0,principal=0,left=amount;
            if(type!=='principal'&&!p.interestStopped){interest=Math.min(left,interestDue);left-=interest;}
            if(type!=='interest'&&left>0){principal=Math.min(left,l.principal);left-=principal;}
            el.innerHTML='<b>Auto ခွဲဝေမည့်စာရင်း</b><br>အရင်ဆုံး အတိုး: <b>'+money(interest)+'</b><br>ပြီးမှ အရင်း: <b>'+money(principal)+'</b>'+(left>0?'<br>⚠️ ပိုငွေ: <b>'+money(left)+'</b>':'');
          }
          </script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Auto apply unpaid interest before principal'; git push origin main; fi
