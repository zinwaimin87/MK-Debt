name: Fix loan date input
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[loan-date-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore selectable loan date
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function addLoan(i){let p=data.people[i];modal(`<h2>ချေးငွေအသစ်</h2><div class=\"field\"><label>ငွေပမာဏ</label><input id=\"loanAmt\" type=\"number\" value=\"10000\"></div><div class=\"field\"><label>မှတ်ချက်</label><input id=\"loanNote\"></div><button class=\"btn primary wide\" onclick=\"saveLoan(${i})\">ထည့်မည်</button>`)}function saveLoan(i){let n=+document.getElementById('loanAmt').value;if(n<=0)return;let p=data.people[i];p.principal+=n;p.balance+=n;p.records=p.records||[];p.records.unshift({type:'loan',amount:n,note:document.getElementById('loanNote').value,date:new Date().toLocaleDateString()});log(p.name+' ချေးငွေ '+money(n)+' ထည့်');save();closeModal();detail(i)}"
          new="function addLoan(i){let p=data.people[i],today=new Date().toISOString().slice(0,10);modal(`<h2>ချေးငွေအသစ်</h2><div class=\"field\"><label>ငွေပမာဏ</label><input id=\"loanAmt\" type=\"number\" value=\"10000\"></div><div class=\"field\"><label>ဘယ်နေ့ချေးခဲ့သလဲ</label><input id=\"loanDate\" type=\"date\" value=\"${today}\"></div><div class=\"field\"><label>မှတ်ချက်</label><input id=\"loanNote\"></div><button class=\"btn primary wide\" onclick=\"saveLoan(${i})\">ထည့်မည်</button>`)}function saveLoan(i){let n=+document.getElementById('loanAmt').value;if(n<=0)return;let p=data.people[i],d=document.getElementById('loanDate').value||new Date().toISOString().slice(0,10);p.principal+=n;p.balance+=n;p.records=p.records||[];p.records.unshift({type:'loan',amount:n,note:document.getElementById('loanNote').value,date:d});log(p.name+' ချေးငွေ '+money(n)+' ထည့် ('+d+')');save();closeModal();detail(i)}"
          if old not in s:
              raise SystemExit('target function not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore selectable loan date [loan-date-fixed]'
          git push
