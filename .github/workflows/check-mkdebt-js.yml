name: Check MK Debt JavaScript
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stable app JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app2.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m:
              raise SystemExit('No script block found in app2.html')
          Path('/tmp/mkdebt.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/mkdebt.js
          echo 'MK Debt stable JavaScript syntax OK'
