name: Per-loan edit delete + full debt form
on:
  push:
    branches: [main]
    paths:
      - .force-loan-edit-delete
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install full loan form and per-loan controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def replace_function(src,name,replacement):
              pat=re.compile(r'function\\s+'+re.escape(name)+r'\\s*\\([^)]*\\)\\s*\\{')
              m=pat.search(src)
              if not m:
                  print(name+' not found; skip')
                  return src
              depth=0
              for j in range(m.end()-1,len(src)):
                  if src[j]=='{': depth+=1
                  elif src[j]=='}':
                      depth-=1
                      if depth==0:
                          return src[:m.start()]+replacement+src[j+1:]
              print(name+' boundary not found; skip')
              return src
          newperson=r'''function newPerson(){let today=new Date().toISOString().slice(0,10);modal(`<h2>လူသစ်ထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="nn"></div><div class="field"><label>ဖုန်း</label><input id="np"></div><div class="field"><label>မူရင်းချေးငွေပမာဏ</label><input id="na" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>အတိုး % / လ</label><input id="nr" type="number" min="0" step="0.01" value="10"></div><div class="field"><label>📅 ပထမဆုံးချေးခဲ့သည့်နေ့</label><input id="nLoanStart" type="date" value="${today}"></div><div class="field"><label>📅 နောက်ဆုံးချေးငွေထည့်သည့်နေ့</label><input id="nLoanLast" type="date" value="${today}"></div><div class="field"><label>မှတ်ချက်</label><input id="nLoanNote" value="မူလချေးငွေ"></div><div class="mini">ချေးငွေပမာဏထည့်ထားပါက သိမ်းချိန်မှာ ချေးငွေမှတ်တမ်းတစ်စောင်ကို အလိုအလျောက်ဖန်တီးပြီး အတိုး/Balance တွက်ပါမည်။</div><button class="btn primary wide" onclick="savePerson()">သိမ်းမည်</button>`)}'''
          saveperson=r'''function savePerson(){let n=document.getElementById('nn').value.trim(),phone=document.getElementById('np').value.trim(),amount=Number(document.getElementById('na').value)||0,rate=Number(document.getElementById('nr').value)||0,start=document.getElementById('nLoanStart')?.value||new Date().toISOString().slice(0,10),last=document.getElementById('nLoanLast')?.value||start,note=document.getElementById('nLoanNote')?.value||'မူလချေးငွေ';if(!n)return alert('အမည်ထည့်ပါ');let id=Date.now(),records=[];if(amount>0)records.push({id:id+1,type:'loan',amount,date:last||start,note});data.people.push({id,name:n,phone,rate,loanStartDate:start,loanLastDate:last,page:1,records,interestStopped:false});log(n+' လူသစ်ထည့်'+(amount>0?' · ချေးငွေ '+money(amount):''));save();closeModal();receivable()}'''
          s=replace_function(s,'newPerson',newperson)
          s=replace_function(s,'savePerson',saveperson)
          marker='MK_LOAN_FULL_V2'
          if marker not in s:
              js=r'''<script>
          const MK_LOAN_FULL_V2=true;
          function loanHistory(i){const p=data.people[i],ls=loans(p),c=calc(p);modal(`<h2>${esc(p.name)} — ချေးငွေစာရင်း</h2><div class="grid"><div class="stat"><div>ချေးငွေစုစုပေါင်း</div><b>${money(c.principalOriginal)}</b></div><div class="stat balance"><div>အရင်းကျန်ငွေ</div><b>${money(c.principal)}</b></div><div class="stat interest"><div>အတိုးကျန်ငွေ</div><b>${money(c.interestDue)}</b></div><div class="stat balance"><div>Total Balance</div><b>${money(c.balance)}</b></div></div><button class="btn primary wide" onclick="addLoan(${i})">＋ မှတ်တမ်းအသစ် / ချေးငွေအသစ်</button><div class="table"><table><thead><tr><th>နေ့စွဲ</th><th>ချေးငွေ</th><th>အတိုး</th><th>မှတ်ချက်</th><th>လုပ်ဆောင်ချက်</th></tr></thead><tbody>${ls.map(r=>`<tr><td>${esc(r.date||'')}</td><td>${money(r.amount)}</td><td>${Number(p.rate||0)}%</td><td>${esc(r.note||'')}</td><td><button class="btn" onclick="editLoan(${i},${Number(r.id)})">✎ ပြင်</button><button class="btn danger" onclick="deleteLoan(${i},${Number(r.id)})">ဖျက်</button></td></tr>`).join('')||'<tr><td colspan="5">ချေးငွေစာရင်း မရှိသေးပါ</td></tr>'}</tbody></table></div><button class="btn wide" onclick="closeModal()">ပိတ်မည်</button>`)}
          function editLoan(i,id){const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;modal(`<h2>ချေးငွေစာရင်း ပြင်ရန်</h2><div class="field"><label>ချေးငွေအရင်း</label><input id="elAmt" type="number" min="0" step="0.01" value="${Number(r.amount)||0}"></div><div class="field"><label>ချေးသည့်ရက်</label><input id="elDate" type="date" value="${esc(r.date||'')}"></div><div class="field"><label>မှတ်ချက်</label><input id="elNote" value="${esc(r.note||'')}"></div><div class="mini">အတိုးနှုန်းသည် ယခု borrower ၏ ${Number(p.rate||0)}% / လ ကိုအသုံးပြုပါသည်။</div><button class="btn primary wide" onclick="saveEditedLoan(${i},${Number(r.id)})">သိမ်းမည်</button><button class="btn danger wide" onclick="deleteLoan(${i},${Number(r.id)})">ဒီချေးငွေကို ဖျက်မည်</button><button class="btn wide" onclick="loanHistory(${i})">မလုပ်တော့</button>`)}
          function saveEditedLoan(i,id){const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;let a=Number(document.getElementById('elAmt').value);if(a<=0)return alert('ချေးငွေပမာဏထည့်ပါ');r.amount=a;r.date=document.getElementById('elDate').value||r.date;r.note=document.getElementById('elNote').value||'';syncInterest(p);save();log(p.name+' ချေးငွေစာရင်းပြင် '+money(a));closeModal();detail(i)}
          function deleteLoan(i,id){const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;if(!confirm('ဒီချေးငွေစာရင်းကို ဖျက်မလား? ဖျက်ပြီးနောက် အတိုး၊ အရင်းလက်ကျန်နဲ့ Total Balance ကို Auto ပြန်တွက်ပါမည်။'))return;p.records=p.records.filter(x=>Number(x.id)!==Number(id));syncInterest(p);save();log(p.name+' ချေးငွေစာရင်းဖျက် '+money(r.amount));closeModal();detail(i)}
          const _mkFullDetail=detail;
          detail=function(i){_mkFullDetail(i);const main=document.getElementById('main');if(!main)return;const card=document.createElement('section');card.className='card';card.innerHTML='<h2>ချေးငွေတစ်ဦးချင်းစာရင်း</h2><div class="mini">Reference app ပုံစံအတိုင်း ချေးငွေတစ်စောင်ချင်းကို ပြင်/ဖျက်နိုင်ပြီး ပြင်/ဖျက်ပြီးနောက် အတိုး၊ အရင်းကျန်ငွေ၊ Total Balance ကို အလိုအလျောက် ပြန်တွက်ပေးပါမယ်။</div><button class="btn primary wide" onclick="loanHistory('+i+')">＋ ချေးငွေစာရင်း / ပြင် / ဖျက်</button>';main.appendChild(card)};
          </script>'''
              s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; else git commit -m 'Mirror reference debt tracker form and loan controls'; git push origin main; fi
