name: Per-loan edit delete
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install per-loan edit/delete controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'MK_LOAN_EDIT_DELETE_V2' in s:
              print('already installed')
              raise SystemExit(0)
          js=r'''<script>
          const MK_LOAN_EDIT_DELETE_V2=true;
          function loanHistory(i){
            const p=data.people[i],ls=loans(p),c=calc(p);
            modal(`<h2>${esc(p.name)} — ချေးငွေစာရင်း</h2><div class="grid"><div class="stat"><div>မူရင်းချေးငွေ</div><b>${money(c.principalOriginal)}</b></div><div class="stat balance"><div>လက်ကျန်အရင်း</div><b>${money(c.principal)}</b></div></div><button class="btn primary wide" onclick="addLoan(${i})">＋ ချေးငွေအသစ်ထည့်</button><div class="table"><table><thead><tr><th>ရက်</th><th>ချေးငွေ</th><th>မှတ်ချက်</th><th>လုပ်ဆောင်ချက်</th></tr></thead><tbody>${ls.map(r=>`<tr><td>${esc(r.date||'')}</td><td>${money(r.amount)}</td><td>${esc(r.note||'')}</td><td><button class="btn" onclick="editLoan(${i},${Number(r.id)})">ပြင်</button> <button class="btn danger" onclick="deleteLoan(${i},${Number(r.id)})">ဖျက်</button></td></tr>`).join('')||'<tr><td colspan="4">ချေးငွေစာရင်း မရှိသေးပါ</td></tr>'}</tbody></table></div><button class="btn wide" onclick="closeModal()">ပိတ်မည်</button>`);
          }
          function editLoan(i,id){
            const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;
            modal(`<h2>ချေးငွေစာရင်း ပြင်ရန်</h2><div class="field"><label>ချေးငွေအရင်း</label><input id="elAmt" type="number" min="0" step="0.01" value="${Number(r.amount)||0}"></div><div class="field"><label>ချေးသည့်ရက်</label><input id="elDate" type="date" value="${esc(r.date||'')}"></div><div class="field"><label>မှတ်ချက်</label><input id="elNote" value="${esc(r.note||'')}"></div><button class="btn primary wide" onclick="saveEditedLoan(${i},${Number(r.id)})">ပြင်ပြီးသိမ်းမည်</button><button class="btn danger wide" onclick="deleteLoan(${i},${Number(r.id)})">ဒီချေးငွေကို ဖျက်မည်</button><button class="btn wide" onclick="loanHistory(${i})">မလုပ်တော့</button>`);
          }
          function saveEditedLoan(i,id){
            const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;
            const amount=Number(document.getElementById('elAmt').value);if(!(amount>0))return alert('ချေးငွေပမာဏထည့်ပါ');
            r.amount=amount;r.date=document.getElementById('elDate').value||r.date;r.note=document.getElementById('elNote').value;
            syncInterest(p);save();log(p.name+' ချေးငွေစာရင်း ပြင် '+money(amount));loanHistory(i);
          }
          function deleteLoan(i,id){
            const p=data.people[i],r=(p.records||[]).find(x=>x.type==='loan'&&Number(x.id)===Number(id));if(!r)return;
            if(!confirm('ဒီချေးငွေစာရင်းကို ဖျက်မလား? ဖျက်ပြီးနောက် အတိုး၊ အရင်းလက်ကျန်၊ ငွေပေးချေမှုစာရင်းများကို မူရင်းချေးငွေအပေါ် အလိုအလျောက် ပြန်တွက်ပါမည်။'))return;
            p.records=p.records.filter(x=>Number(x.id)!==Number(id));syncInterest(p);save();log(p.name+' ချေးငွေစာရင်း ဖျက် '+money(r.amount));loanHistory(i);
          }
          const _mkLoanDetailV2=detail;
          detail=function(i){
            _mkLoanDetailV2(i);
            const main=document.getElementById('main');
            if(!main)return;
            const card=document.createElement('section');card.className='card';card.innerHTML='<h2>ချေးငွေတစ်ဦးချင်းစာရင်း</h2><div class="mini">ချေးငွေတစ်စောင်ချင်းစီကို ပြင်နိုင်၊ ဖျက်နိုင်ပြီး ပြင်/ဖျက်ပြီးနောက် အတိုးနဲ့ Balance ကို Auto ပြန်တွက်ပေးပါမယ်။</div><button class="btn primary wide" onclick="loanHistory('+i+')">ချေးငွေစာရင်း ပြင် / ဖျက်</button>';main.appendChild(card);
          };
          </script>'''
          marker='</body>' if '</body>' in s else ('</html>' if '</html>' in s else None)
          if marker:
              s=s.replace(marker,js+'\n'+marker,1)
          else:
              s += '\n'+js
          p.write_text(s)
          print('installed loan edit/delete controls')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Install per-loan edit delete controls'
          git push origin main
