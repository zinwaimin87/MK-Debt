name: Fix MK Debt App3 Runtime

on:
  push:
    branches: [main]
    paths:
      - 'app3.html'
      - '.github/workflows/fix-app3-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript quote syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app3.html')
          s = p.read_text(encoding='utf-8')
          old = r'\\"\'\\":\''
          new = r'"\'":\''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app3.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MK Debt app3 JavaScript syntax'
          git push
