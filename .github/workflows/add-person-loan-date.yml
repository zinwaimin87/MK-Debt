name: Add loan date fields to new person
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[new-person-date-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch new person form and save logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def replace_function(src,name,replacement):
              pat=re.compile(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{')
              m=pat.search(src)
              if not m: raise SystemExit(name+' function not found')
              depth=0
              for j in range(m.end()-1,len(src)):
                  if src[j]=='{': depth+=1
                  elif src[j]=='}':
                      depth-=1
                      if depth==0:
                          return src[:m.start()]+replacement+src[j+1:]
              raise SystemExit(name+' boundary not found')
          newperson=r'''function newPerson(){let today=new Date().toISOString().slice(0,10);modal(`<h2>လူသစ်ထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="nn"></div><div class="field"><label>ဖုန်း</label><input id="np"></div><div class="field"><label>အတိုး % / လ</label><input id="nr" type="number" min="0" step="0.01" value="10"></div><div class="field"><label>📅 ပထမဆုံးချေးခဲ့သည့်နေ့</label><input id="nLoanStart" type="date" value="${today}"></div><div class="field"><label>📅 နောက်ဆုံးချေးငွေထည့်သည့်နေ့</label><input id="nLoanLast" type="date" value="${today}"></div><div class="mini">လူသစ်ထည့်တဲ့အချိန်မှာ ချေးငွေစတင်ရက်ကို သတ်မှတ်ထားနိုင်ပါပြီ။</div><button class="btn primary wide" onclick="savePerson()">သိမ်းမည်</button>`)}'''
          saveperson=r'''function savePerson(){let n=document.getElementById('nn').value.trim(),p=document.getElementById('np').value.trim(),r=Number(document.getElementById('nr').value)||0,start=document.getElementById('nLoanStart')?.value||'',last=document.getElementById('nLoanLast')?.value||start;if(!n)return alert('အမည်ထည့်ပါ');let id=Date.now();data.people.push({id,name:n,phone:p,rate:r,loanStartDate:start,loanLastDate:last,page:1,records:[],interestStopped:false});log(n+' လူသစ်ထည့်');save();closeModal();receivable()}'''
          s=replace_function(s,'newPerson',newperson)
          s=replace_function(s,'savePerson',saveperson)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; else git commit -m 'Add loan dates to new person form [new-person-date-done]'; git push; fi
