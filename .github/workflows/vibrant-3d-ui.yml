name: Vibrant 3D UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3D animated UI layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'MK_3D_VIBRANT_UI_V1' in s:
              print('already installed')
              raise SystemExit(0)
          js=r'''<style id="mk-3d-ui-v1">
          :root{--c1:#6c3cff;--c2:#00b8ff;--c3:#ff3cac;--c4:#00d084;--ink:#18233d}
          body{background:radial-gradient(circle at 15% 5%,#d9c7ff 0,#eef4ff 28%,#e9faff 55%,#f9e9ff 100%)!important}
          .app{background:linear-gradient(145deg,#ffffffee,#f5f8ffff)!important;box-shadow:0 0 45px #4d3cff22}
          header{background:linear-gradient(135deg,#3514a4,#6538ff 48%,#00aeefff)!important;color:#fff!important;border:0!important;box-shadow:0 8px 24px #3215a955;position:sticky}
          .title small,.title h1{color:#fff!important}.menu,.btn{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}.menu:hover,.btn:hover{transform:translateY(-2px) scale(1.025);box-shadow:0 9px 20px #3c4cff25;filter:saturate(1.15)}
          .primary{background:linear-gradient(135deg,#6c3cff,#008dff)!important;box-shadow:0 6px 18px #4e3cff55!important}.danger{background:linear-gradient(135deg,#ff3158,#ff6b2c)!important}.green{background:linear-gradient(135deg,#00a878,#00d084)!important}
          .card{border:1px solid #ffffff!important;background:linear-gradient(145deg,#ffffff,#f5f7ff)!important;box-shadow:8px 12px 28px #3344aa16,-3px -3px 12px #fff!important;transform:translateZ(0);animation:mkCardIn .45s ease both}
          .stat{background:linear-gradient(145deg,#f8fbff,#e9f0ff)!important;border:0;box-shadow:inset 2px 2px 7px #fff,inset -3px -3px 8px #b9c8e833}
          .field{background:linear-gradient(145deg,#fff,#f1f5ff)!important;border-color:#d5dcf2!important;box-shadow:inset 2px 2px 7px #d7e0f433}
          .field:focus-within{border-color:#7650ff!important;box-shadow:0 0 0 3px #7650ff22,0 8px 20px #7650ff18!important;transform:translateY(-1px)}
          .person{background:linear-gradient(135deg,#ffffff,#f1f5ff)!important;border:1px solid #e0e5f5!important;box-shadow:0 7px 18px #4154aa16!important;transition:.2s}.person:hover{transform:translateY(-3px);box-shadow:0 12px 25px #4154aa25!important}
          .avatar{background:linear-gradient(135deg,#6c3cff,#00b8ff)!important;color:#fff;box-shadow:0 6px 14px #5b42d955;animation:mkFloat 3s ease-in-out infinite}
          .chat{background:linear-gradient(135deg,#00a86b,#00d084)!important;box-shadow:0 8px 24px #00a86b55!important;animation:mkPulse 2.2s ease-in-out infinite}
          .modalbox{background:linear-gradient(145deg,#fff,#f3f7ff)!important;box-shadow:0 -10px 45px #1e2e7a22!important;animation:mkModal .3s ease both}
          .drawer{background:linear-gradient(180deg,#24105f,#39218a 55%,#075b91)!important;box-shadow:12px 0 35px #16104d66}
          .drawer .item{background:#ffffff12!important;border-color:#ffffff33!important;transition:.2s}.drawer .item:hover{background:#ffffff22!important;transform:translateX(4px)}
          .tabs button{border:0!important;background:linear-gradient(135deg,#eef1ff,#fff)!important;box-shadow:0 4px 12px #3344aa18}.tabs button:hover{transform:translateY(-2px)}
          .table th{background:linear-gradient(135deg,#3c20a8,#008fe8)!important;color:#fff!important}.table td{background:#ffffffcc}
          @keyframes mkFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
          @keyframes mkPulse{0%,100%{transform:scale(1);box-shadow:0 8px 24px #00a86b55}50%{transform:scale(1.045);box-shadow:0 12px 32px #00a86b77}}
          @keyframes mkCardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
          @keyframes mkModal{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
          @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
          </style>
          <script>const MK_3D_VIBRANT_UI_V1=true;</script>'''
          marker='</head>' if '</head>' in s else '</body>'
          s=s.replace(marker,js+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          print('installed 3D vibrant UI')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add vibrant 3D UI animation [3d-ui-done]'; git push origin main; fi
