name: Refresh vibrant easy UI
on:
  push:
    branches: [main]
    paths:
      - .force-ui-refresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'MK_VIBRANT_UI_V1' in s:
              print('UI already installed')
              raise SystemExit(0)
          css=r'''<style id="MK_VIBRANT_UI_V1">
          :root{--blue:#2563eb;--purple:#7c3aed;--green:#10b981;--orange:#f97316;--red:#ef4444;--ink:#172033;--muted:#64748b;--bg:#f4f7ff}
          html,body{background:linear-gradient(135deg,#eef4ff,#f8f5ff)!important;color:var(--ink)!important}
          body{font-family:Arial,"Noto Sans Myanmar",sans-serif!important}
          .app{background:var(--bg)!important;max-width:480px!important}
          header{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;color:#fff!important;border:0!important;padding:12px 10px!important;box-shadow:0 4px 18px #2563eb44!important}
          .title small,.title h1{color:#fff!important}.title h1{font-size:20px!important;font-weight:800!important}
          .menu,.btn{border:0!important;border-radius:12px!important;min-height:44px!important;font-weight:700!important;box-shadow:0 3px 10px #17203318!important}
          .menu{background:#ffffff22!important;color:#fff!important;border:1px solid #ffffff55!important}
          .actions .btn{background:#ffffff22!important;color:#fff!important;border:1px solid #ffffff55!important}.actions .primary{background:#fff!important;color:#2563eb!important}
          main{padding:14px 12px 90px!important}
          .card{background:#fff!important;border:0!important;border-radius:18px!important;padding:15px!important;margin-bottom:12px!important;box-shadow:0 7px 24px #33415518!important}
          .green{background:linear-gradient(135deg,#059669,#10b981)!important;color:#fff!important;border-radius:18px!important}
          .stat{background:#f1f5ff!important;border:0!important;border-left:5px solid var(--blue)!important;border-radius:14px!important}
          .interest{border-left-color:var(--orange)!important;background:#fff7ed!important}.balance{border-left-color:var(--purple)!important;background:#f5f3ff!important}
          .person{background:#fff!important;border:0!important;border-radius:15px!important;padding:11px!important;box-shadow:0 4px 15px #33415514!important}
          .avatar{background:linear-gradient(135deg,#dbeafe,#ede9fe)!important;color:#4f46e5!important;border-radius:12px!important}
          .primary{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;color:#fff!important}
          .danger{background:linear-gradient(135deg,#ef4444,#f97316)!important;color:#fff!important}
          .wide{min-height:48px!important;font-size:15px!important}
          .field{background:#f8fafc!important;border:2px solid #e2e8f0!important;border-radius:13px!important;padding:10px 12px!important;margin:8px 0!important}.field:focus-within{border-color:#6366f1!important;box-shadow:0 0 0 3px #6366f122!important}
          .field label{font-weight:700!important;color:#475569!important}.field input,.field select,.field textarea{font-size:16px!important;color:#172033!important}
          .tabs{gap:8px!important}.tabs button{border:0!important;border-radius:12px!important;background:#e2e8f0!important}.tabs button.primary{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;color:#fff!important}
          .table{border-radius:13px!important}.table table{background:#fff!important}.table th{background:#eef2ff!important;color:#334155!important;font-weight:800!important}.table td{border-color:#e2e8f0!important}
          .modal{background:#17203399!important}.modalbox{border-radius:22px 22px 0 0!important;box-shadow:0 -8px 35px #0003!important;padding:18px!important}
          .drawer{background:linear-gradient(180deg,#172554,#312e81)!important}.drawer .item{border:0!important;background:#ffffff14!important;border-radius:13px!important}
          .chat{background:linear-gradient(135deg,#10b981,#059669)!important;border:3px solid #fff!important;box-shadow:0 5px 18px #05966955!important}
          h2{font-weight:800!important}button:active{transform:scale(.98)}
          </style>'''
          s=s.replace('</body>',css+'\n</body>',1) if '</body>' in s else s+css
          p.write_text(s,encoding='utf-8')
          print('Vibrant UI installed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No UI changes'; else git commit -m 'Apply vibrant easy-to-use UI'; git push origin main; fi
