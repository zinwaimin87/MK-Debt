<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff5ff"><title>MK Debt — အကြွေးစာရင်း</title>
<style>
:root{--bg:#eaf8ff;--panel:#ffffff;--panel2:#e3f5ff;--text:#103b78;--muted:#54799c;--blue:#159df0;--blue2:#2868ed;--cyan:#70ddff;--purple:#5b5de8;--green:#08a982;--red:#e83f68;--line:#ffffffb8;--shadow:0 12px 28px #277fba20}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 8% 0%,#9be7ff 0,transparent 38%),radial-gradient(ellipse at 95% 10%,#c9d7ff 0,transparent 34%),radial-gradient(ellipse at 45% 100%,#b6edff 0,transparent 44%),linear-gradient(160deg,#f8fdff 0%,#e5f6ff 46%,#ccecff 100%);background-attachment:fixed;color:var(--text);font-family:Arial,"Noto Sans Myanmar",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:700px;margin:auto;min-height:100vh;padding-bottom:78px}
.top{position:sticky;top:0;z-index:5;padding:14px 15px;background:linear-gradient(110deg,#20a9f1f2,#277ce9f5 58%,#4e60e7f5);border-bottom:1px solid #ffffff9c;backdrop-filter:blur(18px);box-shadow:0 8px 24px #1674b52b}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:70px;height:52px;flex:0 0 70px;border-radius:12px;background:linear-gradient(145deg,#ffffff40,#ffffff08);display:grid;place-items:center;font-size:30px;font-weight:1000;letter-spacing:-7px;padding-right:6px;color:#fff;text-shadow:1px 2px 0 #174ba2,2px 4px 0 #91eaff,0 7px 16px #123e8b88;box-shadow:inset 0 2px 2px #ffffffa3,0 7px 15px #1d9fe94a;transform:translateZ(0);animation:logoFloat 4s ease-in-out infinite}
.brand h1{font-size:25px;letter-spacing:-.35px;margin:0;color:#fff;text-shadow:0 2px 12px #174b9c55}
.brand small{display:none;color:var(--muted);margin-top:3px}
main{padding:12px}
.page{display:none}.page.active{display:block}
.card{background:linear-gradient(145deg,#ffffffd9,#e9f7ffed 58%,#d9f0ffed);border:1px solid #ffffffeb;border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow),inset 0 1px #ffffff;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#ffffff,transparent);pointer-events:none}
.hero{background:linear-gradient(125deg,#1bb8f4,#3189f4 48%,#5b5de8 100%);box-shadow:0 12px 26px #1684ce30,inset 0 1px #ffffff80}
h2,h3{margin:0 0 10px}h2{font-size:19px}h3{font-size:15px}
.muted,small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:13px;border-radius:20px;background:linear-gradient(145deg,#ffffffed,#e6f6ffed 55%,#d8efff);border:1px solid #ffffff;min-width:0;box-shadow:0 8px 20px #2388c51b,inset 0 1px #ffffff}
.stat small{display:block;font-size:12px}.stat b{display:block;font-size:16px;margin-top:6px;overflow-wrap:anywhere}
.field{margin:8px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:13px;border:1px solid #b8e6fb;background:linear-gradient(145deg,#ffffff,#eef9ff);color:#123b78;font-size:16px;outline:none;box-shadow:inset 0 2px 6px #5cadd51a;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #39c7f426}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{border:1px solid #ffffffd9;border-radius:14px;padding:10px 12px;min-height:42px;background:linear-gradient(145deg,#ffffff,#e3f4ff);color:#174780;font-weight:700;cursor:pointer;box-shadow:0 5px 12px #1c77ae20,inset 0 1px #ffffff;transition:transform .18s,filter .18s,box-shadow .18s}
.btn:active{transform:translateY(1px) scale(.985);filter:brightness(1.12)}
.btn.primary{background:linear-gradient(120deg,#18c6f4,#237ff0 55%,#5c5be9);border:1px solid #ffffff9c;color:#fff;box-shadow:0 7px 16px #218de93a,inset 0 1px #ffffff80}
.btn.green{background:linear-gradient(130deg,#20d8bc,#08a886);border-color:#ffffff90;color:#fff}
.btn.danger{background:linear-gradient(130deg,#ff6c91,#df3c68);border-color:#ffffff90;color:#fff}
.btn.small{padding:7px 9px;min-height:33px;font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions .btn{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:9px}
.person{padding:13px;border:1px solid #ffffff;border-radius:17px;background:linear-gradient(140deg,#ffffffed,#e8f7ffed 58%,#d9f0ffed);margin-top:9px;cursor:pointer;box-shadow:0 6px 15px #2684b51a,inset 0 1px #ffffff}
.person strong{font-size:15px}.person .summary{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.55}
.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:linear-gradient(120deg,#d5f3ff,#dce6ff);border:1px solid #ffffff;font-size:12px;color:#20569a}
.red{color:#e83f68}.greenText{color:#079b7c}
.tablewrap{overflow-x:auto;border-radius:10px}
.table{border-collapse:collapse;width:100%;font-size:12px}
.table th,.table td{padding:8px 7px;text-align:left;border-bottom:1px solid #a9dff3;white-space:nowrap}
.table th{color:#245a91;font-weight:700;background:#dff4ff}
.overdue{background:linear-gradient(90deg,#ffe5ed,#fff0f5);color:#c72c58}
.duepaid{color:#65e7bd}.empty{text-align:center;padding:19px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(700px,100%);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(100deg,#ffffffed,#eaf8ffed 48%,#dfeafff2);border-top:1px solid #ffffff;backdrop-filter:blur(18px);z-index:10;box-shadow:0 -8px 25px #2676a51c}
.nav button{border:0;border-radius:13px;background:transparent;color:#54799c;padding:6px 2px;font-size:11px;transition:background .2s,color .2s}
.nav button b{display:block;font-size:19px;margin-bottom:3px}
.nav button.active{background:linear-gradient(145deg,#22b8ef,#277de8 65%,#5c5be9);color:#fff;box-shadow:inset 0 1px #ffffff80,0 4px 12px #1684ce35}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:linear-gradient(120deg,#1683aa,#2858a1 58%,#4b50bd);border:1px solid #89e7ff35;padding:10px 15px;border-radius:12px;display:none;z-index:30;max-width:90%;text-align:center;box-shadow:var(--shadow)}
.toast.show{display:block}.hint{font-size:12px;color:var(--muted);line-height:1.5}.split{display:flex;justify-content:space-between;gap:10px}.section-title{margin:13px 0 7px}.settings-shortcuts{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 0 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.settings-shortcuts button{flex:0 0 auto;white-space:nowrap;border:1px solid #b8e6fb;border-radius:13px;background:linear-gradient(145deg,#fff,#e4f5ff);color:#174780;padding:10px 13px;font-weight:700;box-shadow:0 4px 12px #277fba12}.settings-shortcuts button:first-child{background:linear-gradient(110deg,#20a9f1,#4e60e7);color:#fff;border-color:transparent}.settings-shortcuts button:active{transform:scale(.98)}#settings .settings-main-card{scroll-margin-top:100px}#settings .settings-payment-title,#settings .settings-storage-title,#settings .settings-owner-card{scroll-margin-top:100px}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotateX(0)}50%{transform:translateY(-2px) rotateX(5deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding:16px}.top{padding:15px 18px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo" aria-label="MK logo">MK</div><div style="flex:1"><h1>MK Debt</h1></div><button type="button" id="top-notification" aria-label="အသိပေးချက်များ" style="position:relative;border:1px solid #ffffffaa;border-radius:16px;background:#ffffffed;color:#174780;min-width:48px;height:46px;font-size:22px;box-shadow:0 4px 12px #17478020" data-action="openNotifications">🔔<span id="top-notification-badge" hidden style="position:absolute;right:-5px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:12px;background:#f04470;color:white;font-size:11px;line-height:20px;font-weight:800;border:2px solid white">0</span></button></div></header><main>
<section id="dashboard" class="page active"></section><section id="borrowers" class="page"></section><section id="loanform" class="page"></section><section id="detail" class="page"></section><section id="payments" class="page"></section><section id="settings" class="page"></section><section id="chat" class="page"></section>
</main></div><nav class="nav"><button data-page="dashboard" class="active"><b>⌂</b>ပင်မ</button><button data-page="borrowers"><b>♙</b>အမည်များ</button><button data-page="loanform"><b>＋</b>ချေးငွေထည့်</button><button data-page="payments"><b>↙</b>ငွေပေးချေမှု</button><button data-page="chat"><b>💬</b>Chat Box <span id="chat-unread-badge" class="pill" hidden>!</span></button><button data-page="settings"><b>☷</b>ဆက်တင်</button></nav><div id="toast" class="toast"></div>
<script>
const KEY='mk-debt-live-v3';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db||!Array.isArray(db.loans))db={rate:10,loans:[],payments:[]};if(!Array.isArray(db.payments))db.payments=[];db.rate=10;let selectedLoan=null,selectedName=null,editingLoan=null,editingPayment=null;
const $=id=>document.getElementById(id),N=v=>Math.max(0,Number(v)||0),today=()=>new Date().toLocaleDateString('en-CA'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),curr=c=>c==='THB'?'฿':'Ks',fmt=(v,c)=>curr(c)+' '+Math.round(N(v)).toLocaleString('en-US'),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));if(window.mkCloudSync)window.mkCloudSync()},toast=s=>{let e=$('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)},monthsBetween=(a,b)=>Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth());
function loanPays(id){return db.payments.filter(p=>p.loanId===id).sort((a,b)=>a.date.localeCompare(b.date))}
function principalBalance(l,until=today()){return Math.max(0,N(l.amount)-loanPays(l.id).filter(p=>p.date<=until).reduce((s,p)=>s+N(p.principal),0))}
function schedule(l,asOf=today()){let start=new Date((l.date||today())+'T12:00:00'),now=new Date((asOf||today())+'T12:00:00'),total=monthsBetween(start,now),pays=loanPays(l.id).filter(p=>p.date<=(asOf||today())),bal=N(l.amount),rows=[];for(let i=1;i<=total;i++){let dueDate=new Date(start);dueDate.setMonth(start.getMonth()+i);let end=dueDate.toLocaleDateString('en-CA');let monthStart=new Date(start);monthStart.setMonth(start.getMonth()+i-1);let from=monthStart.toLocaleDateString('en-CA');let principalThisMonth=pays.filter(p=>p.date>=from&&p.date<end).reduce((s,p)=>s+N(p.principal),0);let outstanding=Math.max(0,bal-principalThisMonth);let interestDue=Math.round(outstanding*N(l.rate??10)/100*100)/100;rows.push({month:end.slice(0,7),date:end,base:outstanding,due:interestDue,paid:0,unpaid:interestDue});bal=outstanding;}let interestPayments=pays.slice().sort((a,b)=>a.date.localeCompare(b.date));for(let p of interestPayments){let left=N(p.interest);for(let r of rows){if(r.date>p.date||left<=0)continue;let apply=Math.min(r.unpaid,left);r.paid+=apply;r.unpaid=Math.max(0,r.unpaid-apply);left-=apply;}}return rows}function interestTotals(l,asOf=today()){let s=schedule(l,asOf);return {due:s.reduce((a,r)=>a+r.due,0),paid:loanPays(l.id).filter(p=>p.date<=(asOf||today())).reduce((a,p)=>a+N(p.interest),0),unpaid:s.reduce((a,r)=>a+r.unpaid,0)}}function balancesAt(l,date){return {principal:principalBalance(l,date),interest:interestTotals(l,date).unpaid}}
function allNames(){let m=new Map();db.loans.forEach(l=>{let k=l.name.trim().toLocaleLowerCase();if(!m.has(k))m.set(k,{name:l.name,loans:[]});m.get(k).loans.push(l)});return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}
let mkTopNotifTimer=null,mkTopNotifCount=0;function paintTopNotification(n){mkTopNotifCount=Math.max(0,Number(n)||0);let b=$('top-notification-badge');if(b){b.hidden=mkTopNotifCount===0;b.textContent=mkTopNotifCount>99?'99+':String(mkTopNotifCount)}}async function refreshTopNotifications(){try{if(location.hash.startsWith('#cloudshare=')){let token=location.hash.slice(12);if(window.mkGetBorrowerChat){let msgs=await window.mkGetBorrowerChat(token);let n=msgs.filter(m=>String(m.sender_role||m.sender||'').toLowerCase().includes('owner')&&!m.read_at&&!m.read).length;paintTopNotification(n)}return}if(window.mkGetOwnerChatList){let rows=await window.mkGetOwnerChatList();let seen=new Set(),n=0;for(let x of rows){let key=String(x.borrower_name||'').trim().toLowerCase();if(seen.has(key))continue;seen.add(key);n+=Number(x.unread_count||0)}paintTopNotification(n)}}catch(_){}}function startTopNotifications(){if(mkTopNotifTimer)clearInterval(mkTopNotifTimer);refreshTopNotifications();mkTopNotifTimer=setInterval(refreshTopNotifications,12000)}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));render(id);window.scrollTo(0,0)}
function render(id){({dashboard,borrowers,loanform,detail,payments,settings}[id]||dashboard)()}
function dashboard(){let names=allNames(),sum=(c,fn)=>db.loans.filter(l=>l.currency===c).reduce((s,l)=>s+fn(l),0),unpaid=(c)=>db.loans.filter(l=>l.currency===c).reduce((s,l)=>s+interestTotals(l).unpaid,0);$('dashboard').innerHTML=`<div class="stats"><div class="stat"><small>မူလချေးငွေအရင်း · MMK</small><b>${fmt(sum('MMK',l=>N(l.amount)),'MMK')}</b></div><div class="stat"><small>မူလချေးငွေအရင်း · THB</small><b>${fmt(sum('THB',l=>N(l.amount)),'THB')}</b></div><div class="stat"><small>ကျန်ရှိအရင်း · MMK</small><b>${fmt(sum('MMK',l=>principalBalance(l)),'MMK')}</b></div><div class="stat"><small>ကျန်ရှိအရင်း · THB</small><b>${fmt(sum('THB',l=>principalBalance(l)),'THB')}</b></div><div class="stat"><small>မပေးရသေးအတိုး · MMK</small><b class="red">${fmt(unpaid('MMK'),'MMK')}</b></div><div class="stat"><small>မပေးရသေးအတိုး · THB</small><b class="red">${fmt(unpaid('THB'),'THB')}</b></div></div><div class="actions"><button class="btn primary" data-action="new">＋ ချေးငွေ အသစ်ထည့်ရန်</button><button class="btn" data-page="borrowers">အမည်အားလုံးကြည့်ရန်</button></div><div class="card"><div class="row"><h3>အကြွေးယူသူများ</h3><span class="pill">${names.length} ဦး</span></div>${names.map(n=>`<div class="person" data-action="person" data-name="${esc(n.name)}"><div class="row"><strong>${esc(n.name)}</strong><span class="pill">${n.loans.length} ချေးငွေ</span></div><div class="summary">${n.loans.map(l=>esc(l.label||'ချေးငွေ')).join(' · ')}</div></div>`).join('')||'<div class="empty">စာရင်းမရှိသေးပါ။ ချေးငွေအသစ် ထည့်နိုင်ပါတယ်။</div>'}</div>`}function borrowers(){let ns=allNames();$('borrowers').innerHTML=`<div class="card"><h2>အကြွေးယူသူ အမည်များ</h2><div class="field"><label>အမည်ရှာရန်</label><input id="nameSearch" placeholder="အမည်ရိုက်ထည့်ပါ"></div><div id="namesList">${ns.map(nameCard).join('')||'<div class="empty">စာရင်းမရှိသေးပါ</div>'}</div></div>`; $('nameSearch').addEventListener('input',e=>{$('namesList').innerHTML=ns.filter(n=>n.name.toLowerCase().includes(e.target.value.toLowerCase())).map(nameCard).join('')||'<div class="empty">မတွေ့ပါ</div>'})}
function nameCard(n){let loans=n.loans;return `<div class="person" data-action="person" data-name="${esc(n.name)}"><div class="row"><strong>${esc(n.name)}</strong><span class="pill">${loans.length} ချေးငွေ</span></div><div class="summary">${loans.map(l=>esc(l.label||'ချေးငွေ')+' · '+fmt(principalBalance(l),l.currency)).join('<br>')}</div></div>`}
function loanform(id=null){editingLoan=id;let l=id?db.loans.find(x=>x.id===id):null;$('loanform').innerHTML=`<div class="card"><div class="row"><h2>${l?'ချေးငွေပြင်ဆင်ရန်':'ချေးငွေအသစ် ထည့်ရန်'}</h2><button class="btn small" data-page="${l?'detail':'dashboard'}">ပြန်</button></div><div class="field"><label>အကြွေးယူသူအမည် *</label><input id="fName" value="${esc(l?.name||selectedName||'')}" placeholder="အမည်အပြည့်အစုံ"></div><div class="field"><label>ချေးငွေအမျိုးအစား / မှတ်ချက်</label><input id="fLabel" value="${esc(l?.label||'')}" placeholder="ဥပမာ - ပထမချေးငွေ၊ ဆိုင်အတွက်"></div><div class="grid"><div class="field"><label>ချေးငွေအရင်း *</label><input id="fAmount" type="number" min="0.01" step="0.01" value="${l?.amount??''}" placeholder="0"></div><div class="field"><label>ငွေကြေး</label><select id="fCurrency"><option value="MMK" ${l?.currency!=='THB'?'selected':''}>မြန်မာကျပ် (MMK)</option><option value="THB" ${l?.currency==='THB'?'selected':''}>ထိုင်းဘတ် (THB)</option></select></div></div><div class="grid"><div class="field"><label>ချေးသည့်ရက်</label><input id="fDate" type="date" value="${l?.date||today()}"></div><div class="field"><label>လစဉ်အတိုးနှုန်း</label><input value="10%" disabled></div></div><p class="hint">အတိုးကို လစဉ်တွက်မည်။ အရင်းဆပ်သည့်နောက်လမှစ၍ ကျန်ရှိအရင်းပေါ် 10% တွက်ချက်မည်။</p><div class="actions"><button class="btn primary" data-action="saveLoan">${l?'ပြင်ဆင်ချက် သိမ်းရန်':'ချေးငွေ သိမ်းရန်'}</button><button class="btn" data-page="${l?'detail':'dashboard'}">မလုပ်တော့ပါ</button></div></div>`}
function saveLoan(){let name=$('fName').value.trim(),amount=N($('fAmount').value);if(!name||amount<=0){toast('အမည်နဲ့ ချေးငွေအရင်း ဖြည့်ပါ');return}let fields={name,label:$('fLabel').value.trim()||'ချေးငွေ',amount,currency:$('fCurrency').value,date:$('fDate').value||today(),rate:10};if(editingLoan){Object.assign(db.loans.find(l=>l.id===editingLoan),fields);selectedLoan=editingLoan;toast('ချေးငွေပြင်ဆင်ပြီးပါပြီ')}else{let l={id:'L'+Date.now(),...fields};db.loans.push(l);selectedLoan=l.id;selectedName=l.name;toast('ချေးငွေ သိမ်းပြီးပါပြီ')}save();show('detail')}
function openPerson(name){selectedName=name;let group=db.loans.filter(l=>l.name.trim().toLocaleLowerCase()===name.trim().toLocaleLowerCase());$('detail').innerHTML=`<div class="card"><div class="row"><h2>👤 ${esc(name)}</h2><button class="btn small" data-page="borrowers">← ပြန်</button></div><div class="grid"><button class="btn primary" data-action="shareBorrower" data-name="${esc(name)}">🔗 Share link လုပ်ရန်</button><button class="btn" data-action="addForName">＋ ချေးငွေအသစ်</button></div><p class="hint">Link ရသူသည် ဤအမည်၏ ချေးငွေစာရင်းကိုသာ ကြည့်နိုင်ပါမည်။</p></div>${group.map(l=>loanCard(l)).join('')}`;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='detail'));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='borrowers'));window.scrollTo(0,0)}
async function shareBorrower(name){let loans=db.loans.filter(l=>l.name.trim().toLowerCase()===name.trim().toLowerCase());let ids=new Set(loans.map(l=>l.id));let data={v:1,name,createdAt:today(),loans,payments:db.payments.filter(p=>ids.has(p.loanId))};try{if(!window.mkCreateCloudShare)throw new Error('Cloud login လိုအပ်ပါသည်');let token=await window.mkCreateCloudShare(data);let url=location.origin+location.pathname+'#cloudshare='+token;if(navigator.share){navigator.share({title:'MK Debt - '+name,text:'ချေးငွေစာရင်း',url}).catch(()=>copyShare(url))}else copyShare(url);toast('Cloud Share Link ဖန်တီးပြီးပါပြီ')}catch(e){toast('Cloud Share Link မလုပ်နိုင်ပါ: '+(e.message||''))}}function copyShare(url){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>toast('Share link ကို Copy လုပ်ပြီးပါပြီ')).catch(()=>prompt('Link ကို Copy လုပ်ပါ',url));else prompt('Link ကို Copy လုပ်ပါ',url)}function showShare(data){document.querySelector('.nav').style.display='none';document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let el=$('detail');el.classList.add('active');el.innerHTML='<div id="share-tab-content"></div><div id="share-database-page"><div class="card"><h2>Database</h2><p class="hint">ချေးငွေအကျဉ်းချုပ်</p><div class="stats"><div class="stat"><small>ချေးငွေအရေအတွက်</small><b>'+db.loans.length+' ခု</b></div><div class="stat"><small>မူလချေးငွေ စုစုပေါင်း</small><b>'+fmt(db.loans.reduce((a,l)=>a+N(l.amount),0),db.loans[0]?.currency||'MMK')+'</b></div><div class="stat"><small>အရင်းကျန် စုစုပေါင်း</small><b>'+fmt(db.loans.reduce((a,l)=>a+principalBalance(l),0),db.loans[0]?.currency||'MMK')+'</b></div><div class="stat"><small>အတိုးကျန်နေသောလ</small><b>'+db.loans.reduce((a,l)=>a+schedule(l).filter(r=>N(r.unpaid)>0.009).length,0)+' လ</b></div></div><div class="grid" style="margin-top:12px"><button class="btn" data-action="shareTab" data-tab="loans">ချေးငွေစာရင်း</button><button class="btn" data-action="shareTab" data-tab="interest">လစဉ်အတိုးအသေးစိတ်</button><button class="btn" data-action="shareTab" data-tab="chat">💬 Message</button></div></div></div><div id="share-loans-page" hidden><div class="card"><div class="row"><h2>ချေးငွေစာရင်း</h2><span class="pill">ကြည့်ရှုရန်</span></div><h3>'+esc(data.name)+'</h3><p class="hint">မျှဝေထားသောစာရင်း · '+esc(data.createdAt||'')+'</p><p class="hint">ငွေပေးချေမှုတောင်းဆိုချက်ကို အောက်တွင်ဖြည့်ပြီး အကြွေးစာရင်းပိုင်ရှင်ထံ ပို့နိုင်ပါသည်။</p><button class="btn" type="button" data-action="showOwnerInfo">👤 Owner</button><div id="share-owner-info" hidden class="person" style="margin-top:10px">Owner ဖုန်း: '+esc(data.ownerInfo?.owner_phone||'မဖြည့်ရသေးပါ')+'<br>အာမခံသူ ဖုန်း: '+esc(data.ownerInfo?.guarantor_phone||'မဖြည့်ရသေးပါ')+'</div></div>'+data.loans.map(l=>{let ps=data.payments.filter(p=>p.loanId===l.id).sort((a,b)=>a.date.localeCompare(b.date));let principal=Math.max(0,N(l.amount)-ps.reduce((a,p)=>a+N(p.principal),0));let interestPaid=ps.reduce((a,p)=>a+N(p.interest),0);let interestDue=schedule(l).reduce((a,r)=>a+r.due,0);let unpaid=Math.max(0,interestDue-interestPaid);let unpaidMonths=schedule(l).filter(r=>N(r.unpaid)>0.009).length;return '<div class="card"><h3>'+esc(l.label||'ချေးငွေ')+' · '+esc(l.currency||'MMK')+'</h3><p class="hint">အတိုးကျန်နေသောလ: <strong class="red">'+unpaidMonths+' လ</strong></p><div class="stats"><div class="stat"><small>မူလအရင်း</small><b>'+fmt(l.amount,l.currency)+'</b></div><div class="stat"><small>ကျန်ရှိအရင်း</small><b>'+fmt(principal,l.currency)+'</b></div><div class="stat"><small>အတိုးပေးပြီး</small><b>'+fmt(interestPaid,l.currency)+'</b></div><div class="stat"><small>အတိုးကျန်</small><b class="red">'+fmt(unpaid,l.currency)+'</b></div></div><p class="hint">ချေးသည့်ရက်: '+esc(l.date||'')+' · လစဉ်အတိုး '+esc(l.rate||10)+'%</p><button class="btn" style="width:100%;margin:8px 0" data-action="shareTab" data-tab="interest">📅 လစဉ်အတိုးအသေးစိတ် ကြည့်ရန်</button><h3 class="section-title">ငွေပေးချေမှုမှတ်တမ်း</h3>'+(ps.slice().reverse().map(p=>'<div class="person"><strong>'+esc(p.date)+'</strong><div class="summary">အတိုးပေး: '+fmt(p.interest,l.currency)+' · အရင်းဆပ်: '+fmt(p.principal,l.currency)+'<br>စုစုပေါင်း: '+fmt(p.amount,l.currency)+(p.note?'<br>မှတ်ချက်: '+esc(p.note):'')+'</div></div>').join('')||'<div class="empty">ပေးချေမှု မရှိသေးပါ</div>')+'<button class="btn primary" style="width:100%;margin-top:12px" data-action="showBorrowerPay" data-id="'+esc(l.id)+'">💰 ချေးငွေ ပေးချေမည်</button><div id="borrower-pay-'+esc(l.id)+'" hidden><div class="field"><label>ငွေပေးချေမည့်နည်းလမ်း</label><select id="bp-method-'+esc(l.id)+'"><option value="cash">ငွေသား</option><option value="bank">Bank QR</option></select><div id="bp-qr-'+esc(l.id)+'" hidden style="margin-top:10px;text-align:center"></div></div><div class="field"><label>ဘယ်အမျိုးအစား ပေးချေမလဲ</label><select id="bp-type-'+esc(l.id)+'"><option value="interest">အတိုးပေးမည်</option><option value="principal">အရင်းပေးမည်</option><option value="intereststop">အတိုးရပ်ထားငွေအားလုံး ပေးသွင်းမည်</option></select></div><div class="field"><label>ပေးချေမည့်နေ့ (ရက်/လ/နှစ်)</label><input id="bp-date-'+esc(l.id)+'" type="date" value="'+today()+'"><p class="hint">ယနေ့ရက်စွဲကို အလိုအလျောက်ဖြည့်ထားပြီး လိုအပ်ပါက ပြင်နိုင်ပါသည်။</p></div><div class="field"><label>ပေးချေမည့်ငွေပမာဏ ('+esc(l.currency||'MMK')+')</label><input id="bp-amount-'+esc(l.id)+'" type="number" min="0.01" step="0.01" placeholder="ငွေပမာဏ ရိုက်ထည့်ပါ"></div><div class="field"><label>မှတ်ချက် (မဖြစ်မနေမဟုတ်)</label><input id="bp-note-'+esc(l.id)+'" placeholder="ဥပမာ - ဘဏ်လွှဲ / ငွေသား"></div><button class="btn green" style="width:100%" data-action="submitBorrowerPay" data-id="'+esc(l.id)+'">ပေးချေမှုတောင်းဆိုချက် ပို့ရန်</button><p class="hint">ဤခလုတ်သည် ပိုင်ရှင်ထံ ပေးချေမှုအချက်အလက် ပို့ရန်ဖြစ်သည်။ ပိုင်ရှင်၏စာရင်းတွင် အလိုအလျောက်မသွင်းသေးပါ။</p></div></div>'}).join('')+'<div id="share-interest-page" hidden><div class="card"><h2>📅 လစဉ်အတိုးကျန်စာရင်း အသေးစိတ်</h2><p class="hint">ချေးငွေတစ်ခုချင်းစီအလိုက် လစဉ်တွက်ချက်မှုနှင့် ပေးချေပြီး/ကျန်ရှိ အခြေအနေ</p></div>'+data.loans.map(l=>'<div class="card"><h3>'+esc(l.label||'ချေးငွေ')+' · '+esc(l.currency||'MMK')+'</h3><p class="hint">အတိုးနှုန်း: '+esc(l.rate||10)+'% · ချေးသည့်ရက်: '+esc(l.date||'')+'</p>'+(schedule(l).map(r=>{let paidOff=N(r.unpaid)<0.01;return '<div class="person" style="margin:8px 0;padding:12px;'+(paidOff?'border-color:#9be5cf;background:linear-gradient(140deg,#f1fff9,#e2fff4)':'')+'"><div class="row"><strong>'+esc(r.month)+'</strong><span style="color:'+(paidOff?'#079b7c':'#e83f68')+';font-weight:700">'+(paidOff?'✓ ပေးချေပြီး':fmt(r.unpaid,l.currency)+' ကျန်')+'</span></div><div class="summary">တွက်ချက်အရင်း: '+fmt(r.base,l.currency)+' · လစဉ်အတိုး: '+fmt(r.due,l.currency)+' · ပေးပြီး: '+fmt(r.paid,l.currency)+'</div></div>'}).join('')||'<p class="hint">လစဉ်အတိုးစာရင်း မရှိသေးပါ</p>')+'</div>').join('')+'</div>';window.scrollTo(0,0)}
async function submitBorrowerPayment(id){let l=db.loans.find(x=>x.id===id);if(!l)return;let type=$('bp-type-'+id).value,date=$('bp-date-'+id).value||today(),amount=N($('bp-amount-'+id).value),note=$('bp-note-'+id).value.trim();if(amount<=0){toast('ပေးချေမည့်ငွေပမာဏ ထည့်ပါ');return}if(location.hash.startsWith('#cloudshare=')){try{await window.mkSubmitCloudRequest({token:location.hash.slice(12),loanId:id,type:type==='intereststop'?'interest_stop':type,amount,currency:l.currency||'MMK',date,message:note});await window.mkSendBorrowerChat(location.hash.slice(12),'ပေးချေမှုတောင်းဆိုချက် '+fmt(amount,l.currency)+' · ရက်စွဲ '+date+' · ပိုင်ရှင်ထံမှ ငွေလက်ခံမှုကို စောင့်ဆိုင်းနေပါသည်။','payment_request',{amount,date,currency:l.currency||'MMK',loan_id:id});toast('Request ပို့ပြီးပါပြီ။ Message Box မှာ စောင့်ပါ။');return}catch(e){toast('တောင်းဆိုချက် မပို့နိုင်ပါ: '+(e.message||''));return}}let typeName=type==='interest'?'အတိုးပေးချေမှု':type==='principal'?'အရင်းပေးချေမှု':'အတိုးရပ်ထားငွေအားလုံး ပေးသွင်းမှု';let message='MK Debt ငွေပေးချေမှုတောင်းဆိုချက်\\nအကြွေးယူသူ: '+dataNameFromShare()+'\\nချေးငွေ: '+(l.label||'ချေးငွေ')+'\\nအမျိုးအစား: '+typeName+'\\nနေ့စွဲ: '+date+'\\nငွေပမာဏ: '+fmt(amount,l.currency)+'\\nမှတ်ချက်: '+(note||'မရှိ')+'\\n\\nပိုင်ရှင်မှ လက်ခံပြီး စာရင်းတွင် မှတ်တမ်းတင်ပေးပါ။';if(navigator.share){navigator.share({title:'MK Debt ပေးချေမှုတောင်းဆိုချက်',text:message}).then(()=>toast('ပေးချေမှုတောင်းဆိုချက် ပို့ပြီးပါပြီ')).catch(()=>prompt('ဒီစာကို ပိုင်ရှင်ထံ ပို့ပေးပါ',message))}else prompt('ဒီစာကို Copy လုပ်ပြီး ပိုင်ရှင်ထံ ပို့ပေးပါ',message)}
function dataNameFromShare(){let h=location.hash;try{return JSON.parse(decodeURIComponent(escape(atob(h.slice(7))))).name||''}catch(e){return ''}}
function ensureShareNav(){let n=$('share-nav');if(!n){n=document.createElement('nav');n.id='share-nav';n.className='nav';n.style.gridTemplateColumns='repeat(3,minmax(0,1fr))';n.innerHTML='<button data-action="shareTab" data-tab="database" class="active"><b>▦</b>Database</button><button data-action="shareTab" data-tab="loans"><b>▤</b>ချေးငွေစာရင်း</button><button data-action="shareTab" data-tab="chat"><b>💬</b>Message</button>';document.body.appendChild(n)}n.style.display='grid';document.querySelector('.nav:not(#share-nav)').style.display='none'}
let mkShareRefreshTimer=null;function startShareAutoRefresh(){if(mkShareRefreshTimer)clearInterval(mkShareRefreshTimer);mkShareRefreshTimer=setInterval(async()=>{if(!location.hash.startsWith('#cloudshare=')||document.hidden)return;let token=location.hash.slice(12);try{let data=await window.mkGetCloudShare(token);if(!data||!Array.isArray(data.loans))return;data.ownerInfo=await window.mkGetOwnerContactPublic(token).catch(()=>({}));db={rate:10,loans:data.loans,payments:data.payments||[]};window.mkCurrentShare={token,data};let tab=document.querySelector('#share-nav button.active')?.dataset.tab||'database';showShare(data);if(tab!=='database'){let b=document.querySelector('#share-nav button[data-tab="'+tab+'"]');if(b)b.click()}}catch(e){}},10000)}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&location.hash.startsWith('#cloudshare=')){let t=location.hash.slice(12);window.mkGetCloudShare(t).then(data=>{if(data&&Array.isArray(data.loans)){data.ownerInfo=window.mkGetOwnerContactPublic?null:null;db={rate:10,loans:data.loans,payments:data.payments||[]};window.mkCurrentShare={token:t,data};showShare(data)}}).catch(()=>{})}});function loadShare(){if(location.hash.startsWith('#cloudshare=')){let token=location.hash.slice(12);ensureShareNav();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$('detail').classList.add('active');$('detail').innerHTML='<div class="card"><h2>Cloud ချေးငွေစာရင်း</h2><p class="hint">စာရင်းကို ရယူနေပါသည်…</p></div>';if(!window.mkGetCloudShare){return true}window.mkGetCloudShare(token).then(async data=>{if(!data||data.v!==1||!Array.isArray(data.loans))throw Error('Share data မမှန်ပါ');try{data.ownerInfo=await window.mkGetOwnerContactPublic(token);window.mkShareOwnerInfo=data.ownerInfo}catch(_){data.ownerInfo={}}db={rate:10,loans:data.loans,payments:data.payments||[]};window.mkCurrentShare={token,data};showShare(data);startShareAutoRefresh()}).catch(e=>{$('detail').innerHTML='<div class="card"><h2>Share Link မရနိုင်ပါ</h2><p class="hint">Link ပိတ်ထားခြင်း သို့မဟုတ် မှားယွင်းခြင်း ဖြစ်နိုင်ပါသည်။ '+esc(e.message||'')+'</p></div>'});return true}startTopNotifications();if(!location.hash.startsWith('#share='))return false;try{let data=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(7)))));if(data.v!==1||!Array.isArray(data.loans))throw Error();db={rate:10,loans:data.loans,payments:data.payments||[]};showShare(data);return true}catch(e){toast('Share link မမှန်ပါ');return false}}

async function recordCloudRequest(id){
 try{
  let requests=await window.mkListCloudRequests(),r=requests.find(x=>x.id===id);
  if(!r||r.status!=='pending'){toast('ဤတောင်းဆိုချက်ကို ပြန်လည်စစ်ဆေးပါ');return}
  let l=db.loans.find(x=>String(x.id)===String(r.loan_id));
  if(!l){toast('ဤချေးငွေကို လက်ရှိဖုန်းစာရင်းထဲ မတွေ့ပါ။ Backup/Cloud Sync ကို စစ်ပါ။');return}
  if(!confirm(r.borrower_name+' ၏ '+fmt(r.amount,r.currency)+' တောင်းဆိုချက်ကို လက်ခံပြီး ငွေပေးချေမှုမှတ်တမ်းအဖြစ် သိမ်းမလား။'))return;
  let interest=(r.request_type==='principal'?0:N(r.amount)),principal=(r.request_type==='principal'?N(r.amount):0);
  if(principal>principalBalance(l)){toast('တောင်းဆိုထားသော အရင်းငွေသည် လက်ကျန်အရင်းထက် များနေပါသည်။ ပြင်ဆင်ရန်လိုသည်။');return}
  db.payments.push({id:'P'+Date.now(),loanId:l.id,date:r.requested_payment_date,interest,principal,amount:interest+principal,note:'Cloud Share မှ လက်ခံထားသောတောင်းဆိုချက် '+r.id});
  save();
  try{
   if(r.share_token&&window.mkUpdateCloudShareSnapshot){
    const borrowerLoans=db.loans.filter(x=>x.name.trim().toLowerCase()===String(r.borrower_name||'').trim().toLowerCase());
    const borrowerIds=new Set(borrowerLoans.map(x=>String(x.id)));
    await window.mkUpdateCloudShareSnapshot(r.share_token,{v:1,name:r.borrower_name,createdAt:today(),loans:borrowerLoans,payments:db.payments.filter(p=>borrowerIds.has(String(p.loanId))) });
   }
   await window.mkUpdateCloudRequest(id,'recorded');
  if(r.share_token&&window.mkSendOwnerChat){await window.mkSendOwnerChat(r.share_token,'ပိုင်ရှင်မှ '+fmt(r.amount,r.currency)+' ကို လက်ခံရရှိပါသည်။ ရက်စွဲ: '+r.requested_payment_date,'payment_receipt',{amount:N(r.amount),currency:r.currency,date:r.requested_payment_date,request_id:r.id});}
  }catch(e){db.payments=db.payments.filter(p=>p.note!=='Cloud Share မှ လက်ခံထားသောတောင်းဆိုချက် '+r.id);save();throw e}
  toast('ပေးချေမှုမှတ်တမ်းသိမ်းပြီးပါပြီ');cloudRequests();
 }catch(e){toast('သိမ်းမရပါ: '+(e.message||''))}
}
