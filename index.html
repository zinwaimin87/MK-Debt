<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b35"><title>MK Debt — အကြွေးစာရင်း</title>
<style>
:root{--bg:#0b1225;--panel:#141f38;--panel2:#1a2947;--text:#eef4ff;--muted:#a8b6d4;--blue:#4cc9f0;--purple:#8b5cf6;--green:#18c58f;--red:#ff5964;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#234a75 0,transparent 36%),radial-gradient(ellipse at 100% 15%,#402a70 0,transparent 35%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Myanmar",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;padding:15px 16px;background:#0b1225eF;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-size:25px}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}main{padding:14px}.page{display:none}.page.active{display:block}.card{background:linear-gradient(145deg,#182642,#111b31);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 22px #0002}.hero{background:linear-gradient(125deg,#1c4960,#31264e)}h2,h3{margin:0 0 12px}h2{font-size:20px}h3{font-size:16px}.muted,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px;border-radius:14px;background:#ffffff0a;border:1px solid var(--line);min-width:0}.stat small{display:block}.stat b{display:block;font-size:17px;margin-top:7px;overflow-wrap:anywhere}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #ffffff22;background:#0c1529;color:var(--text);font-size:16px;outline:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.btn{border:1px solid #ffffff20;border-radius:11px;padding:11px 13px;min-height:42px;background:#233351;color:white;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#229ac4,#7953db);border:0}.btn.green{background:#087e61}.btn.danger{background:#792c3b}.btn.small{padding:7px 9px;min-height:34px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions .btn{flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.person{padding:13px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;margin-top:9px;cursor:pointer}.person strong{font-size:16px}.person .summary{margin-top:6px;font-size:13px;color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#ffffff12;font-size:12px}.red{color:#ff747b}.greenText{color:#6de5bb}.tablewrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:13px}.table th,.table td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:600}.overdue{background:#5a1e2b70;color:#ffb4b8}.duepaid{color:#76e8be}.empty{text-align:center;padding:22px;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#0a1124f5;border-top:1px solid var(--line);z-index:10}.nav button{border:0;border-radius:11px;background:transparent;color:var(--muted);padding:6px 2px;font-size:11px}.nav button b{display:block;font-size:20px;margin-bottom:3px}.nav button.active{background:#293a5e;color:white}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#233351;padding:11px 16px;border-radius:12px;display:none;z-index:30;max-width:90%;text-align:center}.toast.show{display:block}.hint{font-size:12px;color:var(--muted);line-height:1.5}.split{display:flex;justify-content:space-between;gap:10px}.section-title{margin:15px 0 8px}@media(min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding:20px}.top{padding:18px 20px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>အကြွေးစာရင်း · လစဉ်အတိုး 10%</small></div></div></header><main>
<section id="dashboard" class="page active"></section><section id="borrowers" class="page"></section><section id="loanform" class="page"></section><section id="detail" class="page"></section><section id="payments" class="page"></section><section id="settings" class="page"></section>
</main></div><nav class="nav"><button data-page="dashboard" class="active"><b>⌂</b>ပင်မ</button><button data-page="borrowers"><b>♙</b>အမည်များ</button><button data-page="loanform"><b>＋</b>ချေးငွေထည့်</button><button data-page="payments"><b>↙</b>ငွေပေးချေမှု</button><button data-page="settings"><b>☷</b>ဆက်တင်</button></nav><div id="toast" class="toast"></div>
<script>
const KEY='mk-debt-live-v3';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db||!Array.isArray(db.loans))db={rate:10,loans:[],payments:[]};if(!Array.isArray(db.payments))db.payments=[];db.rate=10;let selectedLoan=null,selectedName=null,editingLoan=null,editingPayment=null;
const $=id=>document.getElementById(id),N=v=>Math.max(0,Number(v)||0),today=()=>new Date().toLocaleDateString('en-CA'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),curr=c=>c==='THB'?'฿':'Ks',fmt=(v,c)=>curr(c)+' '+Math.round(N(v)).toLocaleString('en-US'),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),toast=s=>{let e=$('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)},monthsBetween=(a,b)=>Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth());
function loanPays(id){return db.payments.filter(p=>p.loanId===id).sort((a,b)=>a.date.localeCompare(b.date))}
function principalBalance(l,until=today()){return Math.max(0,N(l.amount)-loanPays(l.id).filter(p=>p.date<=until).reduce((s,p)=>s+N(p.principal),0))}
function schedule(l){let start=new Date((l.date||today())+'T12:00:00'),now=new Date(today()+'T12:00:00'),total=monthsBetween(start,now),pays=loanPays(l.id),bal=N(l.amount),rows=[];for(let i=1;i<=total;i++){let dueDate=new Date(start);dueDate.setMonth(start.getMonth()+i);let end=dueDate.toLocaleDateString('en-CA');let monthStart=new Date(start);monthStart.setMonth(start.getMonth()+i-1);let from=monthStart.toLocaleDateString('en-CA');let principalBefore=pays.filter(p=>p.date>=from&&p.date<end).reduce((s,p)=>s+N(p.principal),0);let outstanding=Math.max(0,bal-principalBefore);let interestDue=Math.round(outstanding*N(l.rate??10)/100*100)/100;let paid=pays.filter(p=>p.date<=end).reduce((s,p)=>s+N(p.interest),0);let previousDue=rows.reduce((s,r)=>s+r.due,0);let paidPrior=pays.filter(p=>p.date<end).reduce((s,p)=>s+N(p.interest),0);let thisPaid=Math.min(interestDue,Math.max(0,paid-paidPrior));rows.push({month:end.slice(0,7),date:end,base:outstanding,due:interestDue,paid:thisPaid,unpaid:Math.max(0,interestDue-thisPaid)});bal=outstanding;}return rows}
function interestTotals(l){let s=schedule(l);return {due:s.reduce((a,r)=>a+r.due,0),paid:loanPays(l.id).reduce((a,p)=>a+N(p.interest),0),unpaid:s.reduce((a,r)=>a+r.unpaid,0)}}
function allNames(){let m=new Map();db.loans.forEach(l=>{let k=l.name.trim().toLocaleLowerCase();if(!m.has(k))m.set(k,{name:l.name,loans:[]});m.get(k).loans.push(l)});return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));render(id);window.scrollTo(0,0)}
function render(id){({dashboard,borrowers,loanform,detail,payments,settings}[id]||dashboard)()}
function dashboard(){let names=allNames(),sum=(c,fn)=>db.loans.filter(l=>l.currency===c).reduce((s,l)=>s+fn(l),0),over=db.loans.reduce((s,l)=>s+interestTotals(l).unpaid,0);$('dashboard').innerHTML=`<div class="card hero"><div class="row"><div><h2>အကြွေးစာရင်း စီမံခန့်ခွဲမှု</h2><div class="hint">အတိုးနှုန်း 10% / လ · ကျန်ရှိအရင်းပေါ်တွက်ချက်သည်</div></div><span style="font-size:32px">📒</span></div></div><div class="stats"><div class="stat"><small>ချေးငွေအရင်း · MMK</small><b>${fmt(sum('MMK',l=>N(l.amount)),'MMK')}</b></div><div class="stat"><small>ချေးငွေအရင်း · THB</small><b>${fmt(sum('THB',l=>N(l.amount)),'THB')}</b></div><div class="stat"><small>ကျန်ရှိအရင်း · MMK</small><b>${fmt(sum('MMK',l=>principalBalance(l)),'MMK')}</b></div><div class="stat"><small>မပေးရသေးအတိုး (အားလုံး)</small><b class="red">${Math.round(over).toLocaleString()}</b></div></div><div class="actions"><button class="btn primary" data-action="new">＋ ချေးငွေ အသစ်ထည့်ရန်</button><button class="btn" data-page="borrowers">အမည်အားလုံးကြည့်ရန်</button></div><div class="card"><div class="row"><h3>အကြွေးယူသူများ</h3><span class="pill">${names.length} ဦး</span></div>${names.map(n=>`<div class="person" data-action="person" data-name="${esc(n.name)}"><div class="row"><strong>${esc(n.name)}</strong><span class="pill">${n.loans.length} ချေးငွေ</span></div><div class="summary">${n.loans.map(l=>esc(l.label||'ချေးငွေ')) .join(' · ')}</div></div>`).join('')||'<div class="empty">စာရင်းမရှိသေးပါ။ ချေးငွေအသစ် ထည့်နိုင်ပါတယ်။</div>'}</div>`}
function borrowers(){let ns=allNames();$('borrowers').innerHTML=`<div class="card"><h2>အကြွေးယူသူ အမည်များ</h2><div class="field"><label>အမည်ရှာရန်</label><input id="nameSearch" placeholder="အမည်ရိုက်ထည့်ပါ"></div><div id="namesList">${ns.map(nameCard).join('')||'<div class="empty">စာရင်းမရှိသေးပါ</div>'}</div></div>`; $('nameSearch').addEventListener('input',e=>{$('namesList').innerHTML=ns.filter(n=>n.name.toLowerCase().includes(e.target.value.toLowerCase())).map(nameCard).join('')||'<div class="empty">မတွေ့ပါ</div>'})}
function nameCard(n){let loans=n.loans;return `<div class="person" data-action="person" data-name="${esc(n.name)}"><div class="row"><strong>${esc(n.name)}</strong><span class="pill">${loans.length} ချေးငွေ</span></div><div class="summary">${loans.map(l=>esc(l.label||'ချေးငွေ')+' · '+fmt(principalBalance(l),l.currency)).join('<br>')}</div></div>`}
function loanform(id=null){editingLoan=id;let l=id?db.loans.find(x=>x.id===id):null;$('loanform').innerHTML=`<div class="card"><div class="row"><h2>${l?'ချေးငွေပြင်ဆင်ရန်':'ချေးငွေအသစ် ထည့်ရန်'}</h2><button class="btn small" data-page="${l?'detail':'dashboard'}">ပြန်</button></div><div class="field"><label>အကြွေးယူသူအမည် *</label><input id="fName" value="${esc(l?.name||selectedName||'')}" placeholder="အမည်အပြည့်အစုံ"></div><div class="field"><label>ချေးငွေအမျိုးအစား / မှတ်ချက်</label><input id="fLabel" value="${esc(l?.label||'')}" placeholder="ဥပမာ - ပထမချေးငွေ၊ ဆိုင်အတွက်"></div><div class="grid"><div class="field"><label>ချေးငွေအရင်း *</label><input id="fAmount" type="number" min="0.01" step="0.01" value="${l?.amount??''}" placeholder="0"></div><div class="field"><label>ငွေကြေး</label><select id="fCurrency"><option value="MMK" ${l?.currency!=='THB'?'selected':''}>မြန်မာကျပ် (MMK)</option><option value="THB" ${l?.currency==='THB'?'selected':''}>ထိုင်းဘတ် (THB)</option></select></div></div><div class="grid"><div class="field"><label>ချေးသည့်ရက်</label><input id="fDate" type="date" value="${l?.date||today()}"></div><div class="field"><label>လစဉ်အတိုးနှုန်း</label><input value="10%" disabled></div></div><p class="hint">အတိုးကို လစဉ်တွက်မည်။ အရင်းဆပ်သည့်နောက်လမှစ၍ ကျန်ရှိအရင်းပေါ် 10% တွက်ချက်မည်။</p><div class="actions"><button class="btn primary" data-action="saveLoan">${l?'ပြင်ဆင်ချက် သိမ်းရန်':'ချေးငွေ သိမ်းရန်'}</button><button class="btn" data-page="${l?'detail':'dashboard'}">မလုပ်တော့ပါ</button></div></div>`}
function saveLoan(){let name=$('fName').value.trim(),amount=N($('fAmount').value);if(!name||amount<=0){toast('အမည်နဲ့ ချေးငွေအရင်း ဖြည့်ပါ');return}let fields={name,label:$('fLabel').value.trim()||'ချေးငွေ',amount,currency:$('fCurrency').value,date:$('fDate').value||today(),rate:10};if(editingLoan){Object.assign(db.loans.find(l=>l.id===editingLoan),fields);selectedLoan=editingLoan;toast('ချေးငွေပြင်ဆင်ပြီးပါပြီ')}else{let l={id:'L'+Date.now(),...fields};db.loans.push(l);selectedLoan=l.id;selectedName=l.name;toast('ချေးငွေ သိမ်းပြီးပါပြီ')}save();show('detail')}
function openPerson(name){selectedName=name;let group=db.loans.filter(l=>l.name.trim().toLocaleLowerCase()===name.trim().toLocaleLowerCase());$('detail').innerHTML=`<div class="card"><div class="row"><h2>👤 ${esc(name)}</h2><button class="btn small" data-page="borrowers">← ပြန်</button></div><button class="btn primary" data-action="addForName">＋ ဒီအမည်နဲ့ ချေးငွေအသစ်</button></div>${group.map(l=>loanCard(l)).join('')}`;show('detail')}
function loanCard(l){let it=interestTotals(l),bal=principalBalance(l),pays=loanPays(l.id);return `<div class="card"><div class="row"><h3>${esc(l.label||'ချေးငွေ')}</h3><span class="pill">${l.currency}</span></div><div class="stats"><div class="stat"><small>မူလအရင်း</small><b>${fmt(l.amount,l.currency)}</b></div><div class="stat"><small>ကျန်အရင်း</small><b>${fmt(bal,l.currency)}</b></div><div class="stat"><small>မပေးရသေးအတိုး</small><b class="red">${fmt(it.unpaid,l.currency)}</b></div><div class="stat"><small>အတိုးပေးပြီး</small><b class="greenText">${fmt(it.paid,l.currency)}</b></div></div><div class="hint">ချေးသည့်ရက်: ${esc(l.date)} · အတိုး 10% / လ</div><div class="actions"><button class="btn green" data-action="pay" data-id="${l.id}">ငွေပေးချေ</button><button class="btn" data-action="editLoan" data-id="${l.id}">ပြင်ရန်</button><button class="btn danger" data-action="deleteLoan" data-id="${l.id}">ဖျက်ရန်</button></div><h3 class="section-title">လစဉ်အတိုးစာရင်း</h3>${schedule(l).length?`<div class="tablewrap"><table class="table"><thead><tr><th>လ</th><th>အတိုးအရင်း</th><th>ပေးရမည့်အတိုး</th><th>ပေးပြီး</th><th>ကျန်</th></tr></thead><tbody>${schedule(l).map(r=>`<tr class="${r.unpaid>.009?'overdue':''}"><td>${r.month}</td><td>${fmt(r.base,l.currency)}</td><td>${fmt(r.due,l.currency)}</td><td>${fmt(r.paid,l.currency)}</td><td>${r.unpaid>.009?'<b class="red">'+fmt(r.unpaid,l.currency)+'</b>':'<span class="duepaid">ပေးပြီး ✓</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">တစ်လပြည့်ပြီးသော အတိုးစာရင်း မရှိသေးပါ</div>'}<h3 class="section-title">ငွေပေးချေမှုမှတ်တမ်း</h3>${pays.slice().reverse().map(p=>`<div class="person"><div class="row"><div><strong>${p.date}</strong><div class="summary">စုစုပေါင်း ${fmt(p.amount,l.currency)} · အတိုး ${fmt(p.interest,l.currency)} · အရင်း ${fmt(p.principal,l.currency)}</div></div><div class="actions"><button class="btn small" data-action="editPayment" data-id="${p.id}">ပြင်</button><button class="btn small danger" data-action="deletePayment" data-id="${p.id}">ဖျက်</button></div></div></div>`).join('')||'<div class="empty">ပေးချေမှု မရှိသေးပါ</div>'}</div>`}
function detail(){if(selectedName){openPerson(selectedName);return}let l=db.loans.find(x=>x.id===selectedLoan);if(l){selectedName=l.name;openPerson(l.name)}else show('borrowers')}
function payForm(id){selectedLoan=id;let l=db.loans.find(x=>x.id===id);if(!l)return;editingPayment=null;$('payments').innerHTML=`<div class="card"><div class="row"><h2>ငွေပေးချေမှု</h2><button class="btn small" data-action="backDetail">ပြန်</button></div><p><b>${esc(l.name)} — ${esc(l.label)}</b></p><div class="hint">ကျန်အရင်း ${fmt(principalBalance(l),l.currency)} · မပေးရသေးအတိုး ${fmt(interestTotals(l).unpaid,l.currency)}</div><div class="field"><label>ပေးချေသည့်ရက်</label><input id="pDate" type="date" value="${today()}"></div><div class="field"><label>အတိုးပေးငွေ</label><input id="pInterest" type="number" min="0" step="0.01" value="${Math.min(interestTotals(l).unpaid,principalBalance(l))}"></div><div class="field"><label>အရင်းဆပ်ငွေ</label><input id="pPrincipal" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>မှတ်ချက်</label><input id="pNote" placeholder="မှတ်ချက် (မဖြစ်မနေမဟုတ်)"></div><p class="hint">အတိုးပေးငွေနှင့် အရင်းဆပ်ငွေကို သီးခြားမှတ်တမ်းတင်ပါ။ အရင်းဆပ်ငွေသည် နောက်လအတိုးတွက်ချက်မှုကို လျှော့ချပေးမည်။</p><button class="btn primary" data-action="savePayment" data-id="${l.id}">ပေးချေမှု သိမ်းရန်</button></div>`;show('payments')}
function savePayment(id){let l=db.loans.find(x=>x.id===id),i=N($('pInterest').value),pr=N($('pPrincipal').value);if(!l||i+pr<=0){toast('အတိုး သို့မဟုတ် အရင်းပေးငွေ ထည့်ပါ');return}if(pr>principalBalance(l)){toast('အရင်းပေးငွေက ကျန်အရင်းထက် မကျော်ရပါ');return}db.payments.push({id:'P'+Date.now(),loanId:id,date:$('pDate').value||today(),interest:i,principal:pr,amount:i+pr,note:$('pNote').value.trim()});save();toast('ပေးချေမှု သိမ်းပြီးပါပြီ');show('detail')}
function editPay(id){let p=db.payments.find(x=>x.id===id);if(!p)return;let l=db.loans.find(x=>x.id===p.loanId);let i=prompt('အတိုးပေးငွေ',p.interest);if(i===null)return;let pr=prompt('အရင်းဆပ်ငွေ',p.principal);if(pr===null)return;let date=prompt('ရက်စွဲ (YYYY-MM-DD)',p.date);if(date===null)return;p.interest=N(i);p.principal=N(pr);p.amount=p.interest+p.principal;p.date=date||p.date;save();toast('မှတ်တမ်းပြင်ပြီးပါပြီ');selectedName=l?.name||selectedName;show('detail')}
function payments(){let arr=db.payments.slice().reverse();$('payments').innerHTML=`<div class="card"><h2>ငွေပေးချေမှုမှတ်တမ်း</h2>${arr.map(p=>{let l=db.loans.find(x=>x.id===p.loanId);return `<div class="person"><div class="row"><div><strong>${esc(l?.name||'ဖျက်ထားသောချေးငွေ')}</strong><div class="summary">${p.date} · အတိုး ${fmt(p.interest,l?.currency||'MMK')} · အရင်း ${fmt(p.principal,l?.currency||'MMK')}</div></div><div class="actions"><button class="btn small" data-action="editPayment" data-id="${p.id}">ပြင်</button><button class="btn small danger" data-action="deletePayment" data-id="${p.id}">ဖျက်</button></div></div></div>`}).join('')||'<div class="empty">ပေးချေမှု မရှိသေးပါ</div>'}</div>`}
function settings(){$('settings').innerHTML=`<div class="card"><h2>ဆက်တင်</h2><div class="field"><label>လစဉ်အတိုးနှုန်း</label><input value="10%" disabled></div><p class="hint">အတိုးတွက်ချက်ပုံ — လတစ်လပြည့်တိုင်း ထိုလအတွင်း အရင်းဆပ်မှုကို ထည့်တွက်ပြီးနောက် ကျန်ရှိအရင်း၏ 10% ကို လစဉ်အတိုးအဖြစ် တွက်ချက်သည်။ လချင်းစီ မပေးရသေးသော အတိုးကို အနီရောင်ဖြင့် ပြသထားသည်။</p><div class="actions"><button class="btn" data-action="export">စာရင်း Backup ထုတ်ရန် (JSON)</button><button class="btn" data-action="import">Backup ပြန်ထည့်ရန်</button></div><p class="hint">သတိပြုရန် — ယခု version သည် ဒီ browser/device ၏ local storage ထဲတွင် သိမ်းထားသည်။ ဖုန်းပြောင်းလျှင် Backup ထုတ်ပြီး ပြန်ထည့်ပါ။ Device အများအပြားအကြား အလိုအလျောက်တူညီစေရန် cloud database ချိတ်ဆက်မှု သီးခြားလိုအပ်သည်။</p></div>`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){show(b.dataset.page);return}let a=b.dataset.action,id=b.dataset.id;switch(a){case'new':selectedName=null;show('loanform');loanform();break;case'saveLoan':saveLoan();break;case'person':openPerson(b.dataset.name);break;case'addForName':show('loanform');loanform();break;case'editLoan':selectedLoan=id;loanform(id);show('loanform');break;case'deleteLoan':if(confirm('ဤချေးငွေ၊ ၎င်း၏ပေးချေမှုမှတ်တမ်းများကို ဖျက်မှာ သေချာပါသလား။')){db.loans=db.loans.filter(l=>l.id!==id);db.payments=db.payments.filter(p=>p.loanId!==id);save();toast('ဖျက်ပြီးပါပြီ');selectedName=selectedName;show('detail')}break;case'pay':payForm(id);break;case'savePayment':savePayment(id);break;case'backDetail':show('detail');break;case'editPayment':editPay(id);break;case'deletePayment':if(confirm('ဤပေးချေမှုမှတ်တမ်းကို ဖျက်မလား။')){let p=db.payments.find(x=>x.id===id);db.payments=db.payments.filter(x=>x.id!==id);save();toast('ပေးချေမှုဖျက်ပြီးပါပြီ');selectedName=db.loans.find(l=>l.id===p?.loanId)?.name||selectedName;show('detail')}break;case'export':{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mk-debt-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Backup ထုတ်ပြီးပါပြီ');break}case'import':{let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.loans)||!Array.isArray(x.payments))throw Error();db=x;db.rate=10;save();toast('Backup ပြန်ထည့်ပြီးပါပြီ');show('dashboard')}catch(_){toast('Backup ဖိုင် မမှန်ပါ')}};r.readAsText(f)};inp.click();break}}});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.page==='loanform'){selectedName=null;show('loanform');loanform()}else show(b.dataset.page)}));
render('dashboard');
</script></body></html>
