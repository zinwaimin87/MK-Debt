<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>MK Debt</title><style>*{box-sizing:border-box}body{margin:0;background:#070b18;color:#eef3ff;font-family:Arial,"Noto Sans Myanmar",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#0b1020}.top{position:sticky;top:0;z-index:5;padding:14px;background:#0b1020ee;border-bottom:1px solid #ffffff14}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#38d6ff,#9a5cff);font-size:23px}.brand h1{margin:0}.brand small,.muted{color:#9da7c5}.content{padding:12px 12px 90px}.page{display:none}.page.active{display:block}.card{background:linear-gradient(145deg,#121a30,#0f1628);border:1px solid #ffffff12;border-radius:18px;padding:14px;margin-bottom:11px}.hero{background:linear-gradient(135deg,#152b45,#24163d)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin:7px 0;padding:10px;border:1px solid #ffffff16;border-radius:12px;background:#0a1020}.field label{display:block;color:#9da7c5;font-size:13px;margin-bottom:4px}.field input,.field select{width:100%;padding:7px 2px;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.btn{width:100%;min-height:44px;margin-top:8px;padding:10px 13px;border:1px solid #ffffff18;border-radius:12px;background:#151d31;color:#fff;font-weight:700}.primary{background:linear-gradient(135deg,#2ab9ff,#8e55ff);border:0}.green{background:linear-gradient(135deg,#19bd82,#087f9f);border:0}.danger{background:#6d2634}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row .btn{width:auto}.person{display:flex;align-items:center;gap:10px;padding:10px;margin:8px 0;background:#0d1425;border:1px solid #ffffff12;border-radius:13px}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#2ab9ff,#8e55ff);font-weight:800}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.right{text-align:right}.big{font-size:23px;font-weight:800}.empty{text-align:center;padding:25px;color:#9da7c5}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:10;background:#080d1df5;padding:6px 3px;border-top:1px solid #ffffff12}.nav{border:0;background:none;color:#9da7c5;font-size:11px;padding:5px}.nav b{display:block;font-size:19px}.nav.active{color:#fff}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #ffffff12;white-space:nowrap;text-align:left}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:30;background:#17203a;border-radius:25px;padding:11px 17px;opacity:0;pointer-events:none}.toast.show{opacity:1}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>Loan Management · 3D Mobile</small></div></div></header><main class="content"><section id="dashboard" class="page active"></section><section id="newloan" class="page"></section><section id="borrowers" class="page"></section><section id="payments" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="detail" class="page"></section></main></div><nav class="bottom"><button class="nav active" data-page="dashboard"><b>⌂</b>Home</button><button class="nav" data-page="borrowers"><b>👥</b>Borrowers</button><button class="nav" data-page="newloan"><b>＋</b>Add Loan</button><button class="nav" data-page="payments"><b>↙</b>Payment</button><button class="nav" data-page="settings"><b>☷</b>More</button></nav><div id="toast" class="toast"></div><script>const KEY='mk-debt-live-v2';let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d||!Array.isArray(d.people))d={rate:10,currency:'MMK',people:[],payments:[]};if(!Array.isArray(d.payments))d.payments=[];let cur=null;const $=id=>document.getElementById(id),num=x=>Number(x)||0,today=()=>new Date().toISOString().slice(0,10),money=(n,c)=>num(n).toLocaleString()+' '+c,esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){localStorage.setItem(KEY,JSON.stringify(d))}function toast(s){let e=$('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function interest(p){if(p.stop)return 0;let a=new Date((p.date||today())+'T00:00:00'),b=new Date(),m=Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth());let paid=d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+num(x.interest),0);return Math.max(0,num(p.amount)*num(p.rate)/100*m-paid)}function principalPaid(p){return d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+num(x.principal),0)}function balance(p){return Math.max(0,num(p.amount)-principalPaid(p)+interest(p))}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));render(id);scrollTo(0,0)}function render(id){({dashboard,newloan,borrowers,payments,reports,settings,detail}[id]||dashboard)()}function person(p){return `<div class="person" data-action="detail" data-id="${p.id}"><div class="avatar">${esc((p.name||'?')[0])}</div><div class="grow"><b>${esc(p.name)}</b><small>${esc(p.phone||'-')} · ${p.currency}</small></div><div class="right"><b>${money(balance(p),p.currency)}</b><small class="muted">ကျန်</small></div></div>`}function dashboard(){$('dashboard').innerHTML=`<div class="card hero"><div class="muted">MK DEBT · OWNER</div><h2>ချေးငွေ စီမံခန့်ခွဲမှု</h2><p class="muted">Loan, Interest, Payment အားလုံးကို ဖုန်းထဲမှာ စီမံပါ။</p><button class="btn primary" data-page="newloan">＋ ချေးငွေထည့်မယ်</button></div><div class="grid"><div class="card"><div class="muted">MMK · ကျန်</div><div class="big">${money(d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+balance(p),0),'MMK')}</div></div><div class="card"><div class="muted">THB · ကျန်</div><div class="big">${money(d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+balance(p),0),'THB')}</div></div></div><div class="card"><h3>👥 Borrowers · ${d.people.length}</h3>${d.people.slice().reverse().map(person).join('')||'<div class="empty">စာရင်းမရှိသေးပါ</div>'}</div>`}function newloan(){$('newloan').innerHTML=`<div class="card"><div class="row"><h2>➕ Add Loan</h2><button class="btn" data-action="close">×</button></div><div class="field"><label>အမည် *</label><input id="ln" type="text" autocomplete="name" placeholder="ချေးငွေယူသူအမည်"></div><div class="field"><label>ဖုန်း</label><input id="lp" type="tel" inputmode="tel" autocomplete="tel" placeholder="ဖုန်းနံပါတ်"></div><div class="grid"><div class="field"><label>ငွေပမာဏ *</label><input id="la" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div><div class="field"><label>Currency</label><select id="lc"><option value="MMK">MMK</option><option value="THB">THB</option></select></div></div><div class="grid"><div class="field"><label>ချေးသည့်ရက်</label><input id="ld" type="date" value="${today()}"></div><div class="field"><label>အတိုး % / လ</label><input id="lr" type="number" inputmode="decimal" min="0" value="${d.rate||10}" step="0.1"></div></div><div class="field"><label>လစဉ်ပေးငွေ</label><input id="lm" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div><div class="card" id="preview">ငွေပမာဏထည့်ပါ</div><button class="btn green" data-action="saveLoan">✓ Save Loan</button><button class="btn" data-action="close">Cancel</button></div>`;updatePreview();$('ln').focus()}function updatePreview(){let a=num($('la')?.value),r=num($('lr')?.value),m=num($('lm')?.value),c=$('lc')?.value||'MMK';if($('preview'))$('preview').textContent=a?`အတိုး ${money(a*r/100,c)} · စုစုပေါင်း ${money(a+a*r/100,c)} · ${m?Math.ceil((a+a*r/100)/m)+' လ':'လစဉ်ပေးငွေ မသတ်မှတ်ရသေး'}`:'ငွေပမာဏထည့်ပါ'}function saveLoan(){let n=$('ln')?.value.trim(),a=num($('la')?.value);if(!n||a<=0){toast('အမည်နဲ့ ငွေပမာဏ ထည့်ပါ');return}let p={id:'p'+Date.now(),name:n,phone:$('lp').value,amount:a,currency:$('lc').value,date:$('ld').value||today(),rate:num($('lr').value)||10,monthly:num($('lm').value),stop:false};d.people.push(p);persist();cur=p.id;toast('ချေးငွေ သိမ်းပြီးပါပြီ ✓');go('detail')}function borrowers(){$('borrowers').innerHTML=`<div class="card"><h2>👥 Borrowers</h2><div class="field"><input id="search" type="search" placeholder="အမည် / ဖုန်း ရှာရန်"></div><div id="borrowerList"></div></div>`;filterBorrowers()}function filterBorrowers(){let q=($('search')?.value||'').toLowerCase();$('borrowerList').innerHTML=d.people.filter(p=>(p.name+' '+(p.phone||'')).toLowerCase().includes(q)).map(person).join('')||'<div class="empty">မတွေ့ပါ</div>'}function payments(){$('payments').innerHTML=`<div class="card"><h2>💳 Payment</h2>${d.people.map(p=>`<div class="person"><div class="avatar">${esc((p.name||'?')[0])}</div><div class="grow"><b>${esc(p.name)}</b><small>${money(balance(p),p.currency)} ကျန်</small></div><button class="btn green" style="width:auto" data-action="pay" data-id="${p.id}">ပေးချေ</button></div>`).join('')||'<div class="empty">Borrower မရှိသေးပါ</div>`}function pay(id){let p=d.people.find(x=>x.id===id);if(!p)return;cur=id;let bi=Math.min(balance(p),interest(p)),ba=Math.min(balance(p),num(p.monthly)||0),bpr=Math.max(0,ba-bi);$('payments').innerHTML=`<div class="card"><div class="row"><h2>💳 ${esc(p.name)}</h2><button class="btn" data-page="payments">←</button></div><div class="card"><div class="muted">လက်ကျန်</div><div class="big">${money(balance(p),p.currency)}</div></div><div class="field"><label>ပေးချေငွေ *</label><input id="pa" type="number" inputmode="decimal" min="0" max="${balance(p)}" value="${ba||''}"></div><div class="field"><label>အတိုး</label><input id="pi" type="number" inputmode="decimal" min="0" max="${balance(p)}" value="${bi}"></div><div class="field"><label>အရင်း <span class="muted">(ပေးချေငွေ − အတိုး)</span></label><input id="pp" type="number" inputmode="decimal" min="0" max="${balance(p)}" value="${bpr}"></div><button type="button" class="btn green" onclick="savePay('${id}')">✓ Save Payment</button><button class="btn" data-page="payments">Cancel</button></div>`;let sync=()=>{let a=Math.min(balance(p),num($('pa')?.value)),i=Math.min(a,Math.max(0,num($('pi')?.value)));if($('pi'))$('pi').value=i;if($('pp'))$('pp').value=Math.max(0,a-i)};$('pa')?.addEventListener('input',sync);$('pi')?.addEventListener('input',sync);sync()}function savePay(id){let p=d.people.find(x=>x.id===id)||d.people.find(x=>x.id===cur);let a=num($('pa')?.value),i=num($('pi')?.value),pr=num($('pp')?.value);if(!p||a<=0){toast('ပေးချေငွေထည့်ပါ');return}if(i+pr>a){toast('အတိုး + အရင်း စုစုပေါင်းကို ပေးချေငွေထက် မကျော်ပါစေနဲ့');return}if(i+pr>balance(p)){toast('ပေးချေငွေသည် လက်ကျန်ထက် မကျော်ရပါ');return}d.payments.push({id:'q'+Date.now(),pid:p.id,amount:a,interest:i,principal:pr,date:today()});persist();cur=p.id;toast('Payment သိမ်းပြီးပါပြီ ✓');go('detail')}function detail(id=cur){let p=d.people.find(x=>x.id===id);if(!p){go('borrowers');return}cur=id;let rows=d.payments.filter(x=>x.pid===p.id).slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${money(x.amount,p.currency)}</td><td>${money(x.interest,p.currency)}</td><td>${money(x.principal,p.currency)}</td></tr>`).join('')||'<tr><td colspan="4">Payment မရှိသေးပါ</td></tr>';$('detail').innerHTML=`<div class="card"><div class="row"><h2>👤 ${esc(p.name)}</h2><button class="btn" data-page="borrowers">←</button></div><div class="grid"><div class="card"><div class="muted">Loan</div><div class="big">${money(p.amount,p.currency)}</div></div><div class="card"><div class="muted">ကျန်</div><div class="big">${money(balance(p),p.currency)}</div></div></div><p class="muted">Phone: ${esc(p.phone||'-')} · ${p.rate}% / လ</p><button type="button" class="btn primary" onclick="pay('${p.id}')">💳 Payment</button><button class="btn" data-action="edit" data-id="${p.id}">✏ Edit</button><button class="btn danger" data-action="delete" data-id="${p.id}">🗑 Delete</button></div><div class="card"><h3>Payment History</h3><div class="table"><table><thead><tr><th>ရက်</th><th>ပေးငွေ</th><th>အတိုး</th><th>အရင်း</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}function edit(id){let p=d.people.find(x=>x.id===id);if(!p)return;cur=id;$('detail').innerHTML=`<div class="card"><div class="row"><h2>✏ Edit</h2><button class="btn" data-action="detail" data-id="${id}">←</button></div><div class="field"><label>အမည်</label><input id="en" value="${esc(p.name)}"></div><div class="field"><label>ဖုန်း</label><input id="ep" value="${esc(p.phone||'')}"></div><div class="field"><label>ငွေပမာဏ</label><input id="ea" type="number" value="${p.amount}"></div><div class="field"><label>အတိုး % / လ</label><input id="er" type="number" value="${p.rate}"></div><div class="field"><label>လစဉ်ပေးငွေ</label><input id="em" type="number" value="${p.monthly||0}"></div><button class="btn green" data-action="saveEdit" data-id="${id}">✓ Save</button></div>`}function saveEdit(id){let p=d.people.find(x=>x.id===id);if(!p)return;p.name=$('en').value.trim()||p.name;p.phone=$('ep').value.trim();p.amount=num($('ea').value);p.rate=num($('er').value);p.monthly=num($('em').value);persist();toast('ပြင်ပြီးပါပြီ ✓');go('detail')}function del(id){if(!confirm('ဒီ borrower ကို ဖျက်မလား?'))return;d.people=d.people.filter(x=>x.id!==id);d.payments=d.payments.filter(x=>x.pid!==id);persist();cur=null;toast('ဖျက်ပြီးပါပြီ');go('borrowers')}function reports(){$('reports').innerHTML=`<div class="card"><h2>📊 Reports</h2><div class="grid"><div class="card"><div class="muted">MMK Loan</div><div class="big">${money(d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+p.amount,0),'MMK')}</div></div><div class="card"><div class="muted">THB Loan</div><div class="big">${money(d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+p.amount,0),'THB')}</div></div></div><p>Borrowers: <b>${d.people.length}</b></p><p>Payments: <b>${d.payments.length}</b></p></div>`}function settings(){$('settings').innerHTML=`<div class="card"><h2>⚙ Settings</h2><div class="field"><label>Default Interest % / လ</label><input id="sr" type="number" value="${d.rate||10}"></div><button class="btn green" data-action="saveSettings">✓ Save Settings</button><button class="btn" data-action="backup">⬇ Backup</button><button class="btn" data-action="restore">⬆ Restore</button><input id="restoreFile" type="file" accept="application/json" style="display:none"></div>`}function saveSettings(){d.rate=num($('sr').value)||10;persist();toast('Settings သိမ်းပြီးပါပြီ ✓')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='mk-debt-backup.json';a.click()}function restore(){$('restoreFile')?.click()}document.addEventListener('click',e=>{let q=e.target.closest('[data-page]');if(q){go(q.dataset.page);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='close')go('dashboard');else if(a==='saveLoan')saveLoan();else if(a==='detail')detail(id);else if(a==='pay')pay(id);else if(a==='savePay')savePay(id);else if(a==='edit')edit(id);else if(a==='saveEdit')saveEdit(id);else if(a==='delete')del(id);else if(a==='saveSettings')saveSettings();else if(a==='backup')backup();else if(a==='restore')restore()});document.addEventListener('input',e=>{if(e.target.id==='search')filterBorrowers();if(['la','lr','lm'].includes(e.target.id))updatePreview()});render('dashboard');</script><script>
(function(){
  const boot='MK_DEBT_BOOT_RECOVERY_V1';
  function renderFallback(){
    const m=document.getElementById('main'); if(!m) return;
    let d={people:[]};
    try{d=JSON.parse(localStorage.getItem('mk-debt-v4')||'null')||d}catch(e){}
    const people=Array.isArray(d.people)?d.people:[];
    const money=n=>Number(n||0).toLocaleString()+' ฿';
    const calc=p=>{
      let principal=0,interest=0;
      (p.records||[]).forEach(r=>{if(r.type==='loan')principal+=Number(r.amount)||0;if(r.type==='payment'){let a=Number(r.amount)||0;interest+=Math.min(a,principal*(Number(p.rate)||0)/100);principal=Math.max(0,principal-a)}});
      return {principal,interest};
    };
    let totalP=0,totalI=0; people.forEach(p=>{let c=calc(p);totalP+=c.principal;totalI+=c.interest});
    m.innerHTML='<div class="card green"><div>စုစုပေါင်း လက်ကျန်အရင်း</div><strong>'+money(totalP)+'</strong><div>အတိုးနှင့် စီမံထားသော အကြွေးစာရင်း</div></div>'+
      '<div class="grid"><div class="stat"><div>လူဦးရေ</div><b>'+people.length+'</b></div><div class="stat interest"><div>အတိုး</div><b>'+money(totalI)+'</b></div></div>'+
      '<div class="card"><div class="row"><b>ရရန်အကြွေး</b><button class="btn primary" onclick="window.showPage&&showPage(\'receivable\')">ကြည့်မည်</button></div>'+
      people.map(p=>{let c=calc(p);return '<div class="person"><div class="avatar">'+String(p.name||'?').slice(0,1)+'</div><div><b>'+String(p.name||'အမည်မရှိ')+'</b><div class="mini">အတိုး '+(Number(p.rate)||0)+'%</div></div><div class="amount">'+money(c.principal)+'</div></div>'}).join('')+'</div>'+
      '<div class="card"><b>MK Debt</b><div class="mini">Dashboard ကို ပြန်လည်ဖော်ပြထားပါသည်။ သင့်ရှိပြီးသား local data ကို မဖျက်ပါ။</div></div>';
  }
  function boot(){setTimeout(function(){const m=document.getElementById('main');if(m&&(!m.innerHTML.trim()||m.innerText.trim().length<10))renderFallback()},120)}
  window.addEventListener('error',boot); if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script>
const MK_PAYMENT_EDIT_DELETE_V1=true;
function paymentHistory(i){const p=data.people[i],rs=(p.records||[]).filter(r=>r.type==='payment').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.id||0)-Number(a.id||0));const l=rebuildLedger(p),c=calc(p);modal(`<h2>${esc(p.name)} — ငွေပေးချေစာရင်း</h2><div class="grid"><div class="stat"><div>မူရင်းချေးငွေ</div><b>${money(c.principalOriginal)}</b></div><div class="stat balance"><div>လက်ကျန်အရင်း</div><b>${money(c.principal)}</b></div><div class="stat interest"><div>မပေးရသေးသောအတိုး</div><b>${money(c.interestDue)}</b></div><div class="stat"><div>စုစုပေါင်း Balance</div><b>${money(c.balance)}</b></div></div><button class="btn wide" onclick="payment(${i})">＋ ငွေပေးချေမှုအသစ်</button><div class="table"><table><thead><tr><th>ရက်</th><th>လ</th><th>ငွေပေး</th><th>အတိုး</th><th>အရင်း</th><th>အမျိုးအစား</th><th>လုပ်ဆောင်ချက်</th></tr></thead><tbody>${rs.map(r=>{let a=l.allocations[String(r.id)]||{};return `<tr><td>${esc(r.date||'')}</td><td>${esc(r.month||'')}</td><td>${money(r.amount)}</td><td>${money(a.interestApplied??r.interestApplied??0)}</td><td>${money(a.principalApplied??r.principalApplied??0)}</td><td>${r.paymentType==='interest'?'အတိုးသာ':r.paymentType==='principal'?'အရင်းသာ':'Auto'}</td><td><button class="btn" onclick="editPayment(${i},${Number(r.id)})">ပြင်</button> <button class="btn danger" onclick="deletePayment(${i},${Number(r.id)})">ဖျက်</button></td></tr>`}).join('')||'<tr><td colspan="7">ငွေပေးချေစာရင်း မရှိသေးပါ</td></tr>'}</tbody></table></div><button class="btn wide" onclick="closeModal()">ပိတ်မည်</button>`)}
function editPayment(i,id){const p=data.people[i],r=(p.records||[]).find(x=>Number(x.id)===Number(id));if(!r)return;const type=r.paymentType||r.type||'both';modal(`<h2>ငွေပေးချေမှု ပြင်ရန်</h2><div class="field"><label>ပေးချေငွေ</label><input id="epAmt" type="number" min="0" value="${Number(r.amount)||0}"></div><div class="field"><label>ပေးချေသည့်ရက်</label><input id="epDate" type="date" value="${esc(r.date||'')}"></div><div class="field"><label>အတိုးတွက်/ပေးမည့်လ</label><input id="epMonth" type="month" value="${esc(r.month||monthKey(r.date||''))}"></div><select class="field" id="epType"><option value="both" ${type==='both'?'selected':''}>အတိုး + အရင်း (Auto)</option><option value="interest" ${type==='interest'?'selected':''}>အတိုးသာ</option><option value="principal" ${type==='principal'?'selected':''}>အရင်းသာ</option></select><div class="field"><label>မှတ်ချက်</label><input id="epNote" value="${esc(r.note||'')}"></div><button class="btn primary wide" onclick="saveEditedPayment(${i},${Number(r.id)})">ပြင်ပြီးသိမ်းမည်</button><button class="btn danger wide" onclick="deletePayment(${i},${Number(r.id)})">ဒီစာရင်းကို ဖျက်မည်</button><button class="btn wide" onclick="paymentHistory(${i})">မလုပ်တော့</button>`)}
function saveEditedPayment(i,id){const p=data.people[i],r=(p.records||[]).find(x=>Number(x.id)===Number(id));if(!r)return;const amount=Number(document.getElementById('epAmt').value);if(amount<=0)return alert('ပေးချေငွေထည့်ပါ');r.amount=amount;r.date=document.getElementById('epDate').value||r.date||new Date().toISOString().slice(0,10);r.month=document.getElementById('epMonth').value||monthKey(r.date);r.paymentType=document.getElementById('epType').value;r.note=document.getElementById('epNote').value;syncInterest(p);const a=rebuildLedger(p).allocations[String(r.id)]||{};r.interestApplied=a.interestApplied||0;r.principalApplied=a.principalApplied||0;r.unapplied=a.unapplied||0;save();log(p.name+' ငွေပေးချေစာရင်း ပြင် '+money(amount));paymentHistory(i)}
function deletePayment(i,id){const p=data.people[i],r=(p.records||[]).find(x=>Number(x.id)===Number(id));if(!r)return;if(!confirm('ဒီငွေပေးချေစာရင်းကို ဖျက်မလား? ဖျက်ပြီးနောက် မူရင်းချေးငွေမှ အလိုအလျောက် ပြန်တွက်ပါမည်။'))return;p.records=p.records.filter(x=>Number(x.id)!==Number(id));syncInterest(p);save();log(p.name+' ငွေပေးချေစာရင်း ဖျက်');paymentHistory(i)}
</script>
</body></html>
