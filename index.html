function mkHandleShareRefreshError(err){const message=String(err&&err.message||err||'').toLowerCase();if(!/revok|not found|share link is invalid|share link မမှန်/.test(message))return; if(mkShareRefreshTimer){clearInterval(mkShareRefreshTimer);mkShareRefreshTimer=null}window.mkCurrentShare=null;window.mkShareOwnerInfo=null;db={rate:10,loans:[],payments:[]};const detail=document.getElementById('detail');if(detail){detail.innerHTML='<div class="card" style="margin:16px;padding:20px;text-align:center"><div style="font-size:38px">🔒</div><h2>Share Link ပိတ်ထားပါသည်</h2><p class="hint">ပိုင်ရှင်က ဒီ Share Link ကို ပိတ်ထားခြင်း သို့မဟုတ် Link သက်တမ်းမရှိတော့ခြင်းကြောင့် စာရင်းကို ဆက်ကြည့်၍မရပါ။ ပိုင်ရှင်ထံမှ Link အသစ်တောင်းပါ။</p></div>'}const nav=document.getElementById('share-nav');if(nav)nav.style.display='none'}let mkShareRefreshTimer=null;function startShareAutoRefresh(){if(mkShareRefreshTimer)clearInterval(mkShareRefreshTimer);mkShareRefreshTimer=setInterval(async()=>{if(!location.hash.startsWith('#cloudshare=')||document.hidden)return;const paymentFormOpen=Array.from(document.querySelectorAll('[id^="borrower-pay-"]')).some(el=>!el.hidden);if(paymentFormOpen)return;let token=location.hash.slice(12);try{let data=await window.mkGetCloudShare(token);if(!data||!Array.isArray(data.loans))return;data.ownerInfo=await window.mkGetOwnerContactPublic(token).catch(()=>({}));db={rate:10,loans:data.loans,payments:data.payments||[]};let priorShare=window.mkCurrentShare||{};let guideWasOpen=!!document.querySelector('#mk-install-guide')?.open;window.mkCurrentShare={token,data,locationConfirmed:!!priorShare.locationConfirmed,consentResolved:!!priorShare.consentResolved,continueToLedger:!!priorShare.continueToLedger};if(window.mkSetShareInstallManifest)window.mkSetShareInstallManifest(token,data.name);let tab=document.querySelector('#share-nav button.active')?.dataset.tab||'database';showShare(data);let newGuide=document.querySelector('#mk-install-guide');if(newGuide&&guideWasOpen)new function underpaidMonths(l){let req=N(l.requiredMonthly);if(!req)return [];let now=new Date(today()+'T12:00:00'),start=new Date((l.date||today())+'T12:00:00'),out=[];for(let d=new Date(start.getFullYear(),start.getMonth(),1);d<=new Date(now.getFullYear(),now.getMonth(),1);d.setMonth(d.getMonth()+1)){let ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(monthlyPaid(l,ym)+0.001<req)out.push({month:ym,paid:monthlyPaid(l,ym),required:req})}return out}

function savePayment(id){let l=db.loans.find(x=>x.id===id),i=N($('pInterest').value),pr=N($('pPrincipal').value),ar=N($('pArrears')?.value);if(!l||i+pr+ar<=0){toast('အတိုး သို့မဟုတ် အရင်းပေးငွေ ထည့်ပါ');return}if(pr>principalBalance(l)){toast('အရင်းပေးငွေက ကျန်အရင်းထက် မကျော်ရပါ');return}if(ar>arrearsRemaining(l)){toast('အတိုးဟောင်း ပြန်ဆပ်ငွေက အတိုးဟောင်းလက်ကျန်ထက် မကျော်ရပါ');return}let p={id:'P'+Date.now(),loanId:id,date:$('pDate').value||today(),interest:i,arrearsPayment:ar,principal:pr,amount:i+ar+pr,method:$('pMethod')?.value||'မသတ်မှတ်ထားပါ',receivedBy:$('pReceivedBy')?.value.trim()||'Owner',createdAt:new Date().toISOString(),note:$('pNote').value.trim()};db.payments.push(p);paymentAudit('created',p);save();toast('ပေးချေမှု သိမ်းပြီးပါပြီ');show('detail')}
function editPay(id){let p=db.payments.find(x=>String(x.id)===String(id));if(!p)return;let l=db.loans.find(x=>x.id===p.loanId),before=JSON.parse(JSON.stringify(p));let date=prompt('ပေးချေသည့်ရက် (YYYY-MM-DD)',p.date||today());if(date===null)return;let interest=prompt('အတိုးပေးငွေ',p.interest||0);if(interest===null)return;let principal=prompt('အရင်းဆပ်ငွေ',p.principal||0);if(principal===null)return;let arrears=prompt('အတိုးဟောင်းဆပ်ငွေ',p.arrearsPayment||0);if(arrears===null)return;let method=prompt('ပေးချေနည်းလမ်း (ငွေသား / Bank QR / အခြား)',paymentMethod(p));if(method===null)return;let receivedBy=prompt('ငွေလက်ခံသူ',p.receivedBy||'Owner');if(receivedBy===null)return;let note=prompt('မှတ်ချက်',p.note||'');if(note===null)return;let i=N(interest),pr=N(principal),ar=N(arrears);if(i+pr+ar<=0){toast('ငွေပမာဏ 0 မဖြစ်ရပါ');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('ရက်စွဲပုံစံ YYYY-MM-DD ဖြစ်ရပါမည်');return}p.date=date;p.interest=i;p.principal=pr;p.arrearsPayment=ar;p.amount=i+pr+ar;p.method=['ငွေသား','Bank QR','အခြား'].includes(method)?method:'အခြား';p.receivedBy=receivedBy.trim()||'Owner';p.note=note;p.updatedAt=new Date().toISOString();paymentAudit('edited',p,before);save();toast('ပြင်ဆင်မှုမှတ်တမ်းနှင့်အတူ သိမ်းပြီးပါပြီ');selectedName=l?.name||selectedName;show('payments')}
function payments(){let arr=db.payments.slice().sort((a,b)=>String(b.createdAt||b.date||'').localeCompare(String(a.createdAt||a.date||'')));$('payments').innerHTML=`<div class="card"><div class="row"><h2>ငွေပေးချေမှုမှတ်တမ်း</h2><span class="pill">${arr.length} မှတ်တမ်း</span></div><p class="hint">ပြင်ဆင်/ဖျက်သည့်လုပ်ဆောင်ချက်များကို Audit မှတ်တမ်းအဖြစ် ထိန်းသိမ်းထားပါသည်။</p>${arr.map(p=>{let l=db.loans.find(x=>x.id===p.loanId),aud=(db.paymentAudit||[]).filter(a=>String(a.paymentId)===String(p.id));return `<div class="person"><div class="row" style="align-items:flex-start"><div style="min-width:0;flex:1"><strong>${esc(l?.name||'ဖျက်ထားသောချေးငွေ')}</strong><div class="summary">ပေးချေသည့်ရက်: ${esc(p.date||'—')}<br>မှတ်တမ်းတင်ချိန်: ${esc(paymentTime(p))}<br>ပေးချေနည်းလမ်း: ${esc(paymentMethod(p))}<br>ငွေလက်ခံသူ: ${esc(p.receivedBy||'မသတ်မှတ်ထားပါ')}<br>အတိုးပေး: ${fmt(p.interest,l?.currency||'MMK')} · အတိုးဟောင်း: ${fmt(p.arrearsPayment||0,l?.currency||'MMK')} · အရင်းဆပ်: ${fmt(p.principal,l?.currency||'MMK')}<br><b>စုစုပေါင်း: ${fmt(p.amount,l?.currency||'MMK')}</b><br>မှတ်ချက်: ${esc(p.note||'မရှိ')}${l?'<br><span class="red">လက်ရှိအတိုးကျန်: '+fmt(interestTotals(l).unpaid,l.currency)+'</span><br><span class="greenText">လက်ရှိအရင်းကျန်: '+fmt(principalBalance(l),l.currency)+'</span>':''}<details style="margin-top:7px"><summary>ပြင်ဆင်မှုမှတ်တမ်း (${aud.length})</summary>${aud.slice().reverse().map(a=>`<div class="hint" style="padding:6px;border-bottom:1px solid #e7dfd2">${esc(a.action==='created'?'ဖန်တီးခဲ့သည်':a.action==='edited'?'ပြင်ဆင်ခဲ့သည်':'ဖျက်ခဲ့သည်')} · ${esc(new Date(a.at).toLocaleString())} · ${esc(a.actor||'Owner')}${a.before?'<br>မပြင်မီ: '+esc(JSON.stringify(a.before)):''}</div>`).join('')||'<div class="hint">ပြင်ဆင်မှုမှတ်တမ်း မရှိသေးပါ</div>'}</details></div></div><div class="actions"><button class="btn small" data-action="editPayment" data-id="${esc(p.id)}">ပြင်</button><button class="btn small danger" data-action="deletePayment" data-id="${esc(p.id)}">ဖျက်</button></div></div>`}).join('')||'<div class="empty">ပေးချေမှု မရှိသေးပါ</div>'}</div><div class="card"><h3>ဖျက်ထားသော/ပြင်ဆင်ထားသော မှတ်တမ်းများ</h3>${(db.paymentAudit||[]).slice().reverse().map(a=>`<div class="summary" style="padding:7px 0;border-bottom:1px solid #e7dfd2">${esc(a.action==='created'?'ဖန်တီး':a.action==='edited'?'ပြင်ဆင်':'ဖျက်')} · ${esc(new Date(a.at).toLocaleString())} · ${esc(a.actor||'Owner')} · ${esc(a.paymentId)}${a.action==='deleted'&&a.before?'<br>ဖျက်ထားသည့်မှတ်တမ်း: '+esc(JSON.stringify(a.before)):''}</div>`).join('')||'<div class="empty">Audit မှတ်တမ်း မရှိသေးပါ</div>'}</div>`}
async function cloudRequests(){

 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='payments'));

 }catch(e){$('payments').innerHTML='<div class="card"><h2>Cloud တောင်းဆိုချက်များ</h2><p class="hint">ဖတ်မရပါ: '+esc(e.message||'')+'</p><button class="btn" data-page="settings">ပြန်</button></div>'}
}
async function recordCloudRequest(id){
 try{
  let actionButton=document.querySelector('[data-action="recordCloudRequest"][data-id="'+CSS.escape(String(id))+'"]');
  if(actionButton){if(actionButton.disabled)return;actionButton.disabled=true;actionButton.textContent='သိမ်းဆည်းနေသည်…'}
  let requests=await window.mkListCloudRequests(),r=requests.find(x=>String(x.id)===String(id));
  if(!r||r.status!=='pending'){toast('ဤတောင်းဆိုချက်ကို ပြန်လည်စစ်ဆေးပါ');cloudRequests();return}
  if(db.payments.some(p=>String(p.note||'').includes('Cloud Share မှ လက်ခံထားသောတောင်းဆိုချက် '+r.id))){await window.mkUpdateCloudRequest(id,'recorded');toast('ဤတောင်းဆိုချက်ကို ယခင်က စာရင်းသွင်းပြီးဖြစ်ပါသည်။');cloudRequests();return}
  let l=db.loans.find(x=>String(x.id)===String(r.loan_id));
  if(!l){toast('ဤချေးငွေကို လက်ရှိဖုန်းစာရင်းထဲ မတွေ့ပါ။ Backup/Cloud Sync ကို စစ်ပါ။');return}
  if(String(l.name||'').trim().toLowerCase()!==String(r.borrower_name||'').trim().toLowerCase()){toast('အမည်မကိုက်ညီပါ။ မှားယွင်းသောအကြွေးစာရင်းထဲ မသွင်းစေရန် ရပ်ထားပါသည်။');return}
  if(!(Number(r.amount)>0)||!Number.isFinite(Number(r.amount))){toast('တောင်းဆိုထားသော ပမာဏ မမှန်ကန်ပါ။');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(r.requested_payment_date||''))||Number.isNaN(Date.parse(r.requested_payment_date))){toast('ပေးချေမည့်ရက်စွဲ မမှန်ကန်ပါ။');return}
  if(String(r.currency||'').toUpperCase()!==String(l.currency||'MMK').toUpperCase()){toast('ငွေကြေးအမျိုးအစား မကိုက်ညီပါ။ မစစ်ဆေးမချင်း စာရင်းမသွင်းပါ။');return}
  if(!confirm(r.borrower_name+' ၏ '+fmt(r.amount,r.currency)+' တောင်းဆိုချက်ကို လက်ခံပြီး ငွေပေးချေမှုမှတ်တမ်းအဖြစ် သိမ်းမလား။'))return;
  let interest=(r.request_type==='principal'?0:N(r.amount)),principal=(r.request_type==='principal'?N(r.amount):0),methodMatch=String(r.message||'').match(/ငွေပေးချေနည်းလမ်း:\s*(ငွေသား|Bank QR)/),methodLabel=methodMatch?methodMatch[1]:'မသတ်မှတ်ထားပါ';
  if(principal>principalBalance(l)){toast('တောင်းဆိုထားသော အရင်းငွေသည် လက်ကျန်အရင်းထက် များနေပါသည်။ ပြင်ဆင်ရန်လိုသည်။');return}
  let cloudPay={id:'P'+Date.now(),loanId:l.id,date:r.requested_payment_date,interest,principal,arrearsPayment:0,amount:interest+principal,method:methodLabel,receivedBy:'Owner',createdAt:new Date().toISOString(),note:'Cloud Share မှ လက်ခံထားသောတောင်းဆိုချက် '+r.id+' · နည်းလမ်း: '+methodLabel+(r.message?' · '+r.message:'')};db.payments.push(cloudPay);paymentAudit('created',cloudPay);
  save();
  try{
   if(r.share_token&&window.mkUpdateCloudShareSnapshot){
    const borrowerLoans=db.loans.filter(x=>x.name.trim().toLowerCase()===String(r.borrower_name||'').trim().toLowerCase());
    const borrowerIds=new Set(borrowerLoans.map(x=>String(x.id)));
    await window.mkUpdateCloudShareSnapshot(r.share_token,{v:1,name:r.borrower_name,createdAt:today(),loans:borrowerLoans,payments:db.payments.filter(p=>borrowerIds.has(String(p.loanId))) });
   }
   await window.mkUpdateCloudRequest(id,'recorded');
  if(r.share_token&&window.mkSendOwnerChat){await window.mkSendOwnerChat(r.share_token,'ပိုင်ရှင်မှ '+fmt(r.amount,r.currency)+' ကို လက်ခံရရှိပါသည်။ ရက်စွဲ: '+r.requested_payment_date,'payment_receipt',{amount:N(r.amount),currency:r.currency,date:r.requested_payment_date,request_id:r.id});}
  }catch(e){db.payments=db.payments.filter(p=>!String(p.note||'').startsWith('Cloud Share မှ လက်ခံထားသောတောင်းဆိုချက် '+r.id));if(typeof cloudPay!=='undefined')db.paymentAudit=db.paymentAudit.filter(a=>String(a.paymentId)!==String(cloudPay.id));save();throw e}
  toast('ပေးချေမှုမှတ်တမ်းသိမ်းပြီးပါပြီ');cloudRequests();

     const payload=JSON.parse(localStorage.getItem('mk-debt-live-v3')||'{"rate":10,"loans":[],"payments":[]}');
     const {error}=await client.from('owner_data').upsert({owner_id:cloudUser.id,payload,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
     if(error)throw error;
     const {data:links,error:linkError}=await client.from('share_links').select('token,borrower_name,snapshot').eq('owner_id',cloudUser.id).is('revoked_at',null);
     if(linkError)throw linkError;
     for(const link of (links||[])){
       const oldSnap=link.snapshot||{};const oldLoans=Array.isArray(oldSnap.loans)?oldSnap.loans:[];const ids=new Set(oldLoans.map(l=>String(l.id)));
       let currentLoans=(payload.loans||[]).filter(l=>ids.has(String(l.id)));
       if(!currentLoans.length)currentLoans=(payload.loans||[]).filter(l=>String(l.name||'').trim().toLocaleLowerCase()===String(link.borrower_name||'').trim().toLocaleLowerCase());
       if(!currentLoans.length)continue;
       const currentIds=new Set(currentLoans.map(l=>String(l.id)));const currentName=currentLoans[0].name||link.borrower_name;
       const snapshot={...oldSnap,v:1,name:currentName,loans:currentLoans,payments:(payload.payments||[]).filter(p=>currentIds.has(String(p.loanId))),ownerInfo:oldSnap.ownerInfo||{}};
       const {error:updateError}=await client.from('share_links').update({borrower_name:currentName,snapshot}).eq('token',link.token).eq('owner_id',cloudUser.id);
       if(updateError)throw updateError;
     }
     status.textContent='Cloud Database နှင့် Share Link များကို သိမ်းဆည်းပြီးပါပြီ။';
   }catch(e){status.textContent='Cloud သိမ်းဆည်းမှု မအောင်မြင်ပါ။ '+(e.message||'Internet ကိုစစ်ပါ။')}
   finally{saving=false;if(queued){queued=false;syncNow()}}
 }
 window.mkCloudSync=function(){if(!cloudUser)return;clearTimeout(saveTimer);saveTimer=setTimeout(syncNow,700)};
 async function enter(user){
   cloudUser=user;
   status.textContent='Cloud စာရင်းများကို ရယူနေပါသည်…';
   const {data,error}=await client.from('owner_data').select('payload').eq('owner_id',user.id).maybeSingle();
   if(error){status.textContent='Database ဖတ်မရပါ။ '+error.message;return}
   const local=(()=>{try{return JSON.parse(localStorage.getItem('mk-debt-live-v3')||'null')}catch(_){return null}})();
   if(data&&data.payload){
     const remote=data.payload;
     if(Array.isArray(remote.loans)&&Array.isArray(remote.payments)){
       if(local&&((local.loans||[]).length||(local.payments||[]).length)&&((remote.loans||[]).length||(remote.payments||[]).length)){
         const useCloud=confirm('Cloud မှာလည်း စာရင်းရှိပြီး ဒီဖုန်းမှာလည်း စာရင်းရှိနေပါတယ်။ Cloud စာရင်းကို အသုံးပြုမလား။ Cancel ကိုနှိပ်လျှင် ဒီဖုန်းစာရင်းကို Cloud သို့ အစားထိုးသိမ်းပါမည်။');
         if(!useCloud){await syncNow()}else{localStorage.setItem('mk-debt-live-v3',JSON.stringify(remote));}
       }else if(local&&((local.loans||[]).length||(local.payments||[]).length)&&!((remote.loans||[]).length||(remote.payments||[]).length)){
         await syncNow();
       }else{
         localStorage.setItem('mk-debt-live-v3',JSON.stringify(remote));
       }
     }
   }else{
     await syncNow();
   }
   try{db=JSON.parse(localStorage.getItem('mk-debt-live-v3')||'{"rate":10,"loans":[],"payments":[]}');if(!Array.isArray(db.loans))db={rate:10,loans:[],payments:[]};if(!Array.isArray(db.payments))db.payments=[];db.rate=10;save();if(typeof show==='function')show('dashboard')}catch(e){}
   gate.style.display='none';
   status.textContent='Cloud ချိတ်ဆက်ပြီးပါပြီ။';
   let btn=document.getElementById('mk-cloud-logout');if(!btn){btn=document.createElement('button');btn.id='mk-cloud-logout';btn.type='button';btn.textContent='☁ ထွက်မည်';btn.className='btn small';btn.style.position='static';btn.style.top='auto';btn.style.right='auto';btn.style.zIndex='auto';btn.style.flexShrink='0';btn.style.whiteSpace='nowrap';btn.style.marginLeft='6px';btn.style.maxWidth='112px';btn.style.fontSize='13px';btn.onclick=async()=>{await client.auth.signOut();location.reload()};document.querySelector('.brand')?.appendChild(btn)}
 }
 form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='ဝင်ရောက်နေပါသည်…';const email=document.getElementById('mk-cloud-email').value.trim(),password=document.getElementById('mk-cloud-password').value;const {data,error}=await client.auth.signInWithPassword({email,password});if(error){status.textContent='ဝင်မရပါ။ Email/Password ကိုစစ်ပါ။ '+error.message;return}await enter(data.user)});
 document.getElementById('mk-cloud-signup').addEventListener('click',async()=>{status.textContent='အကောင့်ဖန်တီးနေပါသည်…';const email=document.getElementById('mk-cloud-email').value.trim(),password=document.getElementById('mk-cloud-password').value;if(!email||password.length<6){status.textContent='Email နှင့် အနည်းဆုံး 6 လုံးရှိသော Password ထည့်ပါ။';return}const {data,error}=await client.auth.signUp({email,password});if(error){status.textContent='အကောင့်ဖွင့်မရပါ။ '+error.message;return}if(data.session&&data.user){await enter(data.user)}else{status.textContent='အတည်ပြု Email ပို့ပြီးပါပြီ။ Email ထဲက အတည်ပြုလင့်ခ်ကိုနှိပ်ပြီးနောက် ဒီစာမျက်နှာကို ပြန်ဖွင့်ကာ Login ဝင်ပါ။'}});
 client.auth.getSession().then(async({data,error})=>{if(error){status.textContent=error.message;return}if(data.session&&!location.hash.startsWith('#cloudshare=')&&!location.hash.startsWith('#share='))await enter(data.session.user)});
 client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;gate.style.display='flex'}});
})();
let mkDeferredInstallPrompt=null;
let mkShareManifestUrl=null;
window.mkSetShareInstallManifest=function(token,name){
 try{
  const link=document.querySelector('link[rel="manifest"]');if(!link)return;
  if(mkShareManifestUrl)URL.revokeObjectURL(mkShareManifestUrl);
  const shareUrl=location.origin+location.pathname+'#cloudshare='+encodeURIComponent(token);
  const cleanName=String(name||'MK Debt').trim().slice(0,50)||'MK Debt';
  const shortName=('MK '+cleanName).slice(0,24);
  const manifest={id:shareUrl,name:'MK Debt — '+cleanName,short_name:shortName,description:cleanName+' ၏ MK Debt Share Link',start_url:shareUrl,scope:location.origin+location.pathname,display:'standalone',orientation:'portrait',background_color:'#eaf8ff',theme_color:'#287de9',icons:[{src:location.origin+'/icon.svg',sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};
  mkShareManifestUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  link.href=mkShareManifestUrl;
  const b=document.getElementById('mk-install-app-now');if(b)b.textContent='📲 '+cleanName+' ရဲ့ App ကို Install လုပ်မည်';
  const st=document.getElementById('mk-install-app-status');if(st)st.textContent=cleanName+' ရဲ့ Share Link ကိုဖွင့်နိုင်မယ့် App အဖြစ် Install လုပ်ပါ။';
 }catch(e){console.warn('Share install manifest:',e)}
};
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();mkDeferredInstallPrompt=event;const b=document.getElementById('mk-install-app-now');const st=document.getElementById('mk-install-app-status');const nm=window.mkCurrentShare&&window.mkCurrentShare.data&&window.mkCurrentShare.data.name;if(b)b.textContent='📲 '+(nm||'MK Debt')+' ကို Install လုပ်မည်';if(st)st.textContent=(nm?nm+' ရဲ့ Share Link':'ဒီ Share Link')+' အတွက် Install လုပ်နိုင်ပါပြီ။ ခလုတ်ကိုနှိပ်ပါ။'});
window.addEventListener('appinstalled',()=>{mkDeferredInstallPrompt=null;const b=document.getElementById('mk-install-app-now');const st=document.getElementById('mk-install-app-status');if(b){b.textContent='✅ MK Debt Install ပြီးပါပြီ';b.disabled=true}if(st)st.textContent='Home Screen မှာ MK Debt Icon ကိုရှာပြီး ဖွင့်နိုင်ပါပြီ။'});
document.addEventListener('click',async event=>{const b=event.target.closest('#mk-install-app-now');if(!b)return;const st=document.getElementById('mk-install-app-status');if(mkDeferredInstallPrompt){b.disabled=true;try{await mkDeferredInstallPrompt.prompt();const choice=await mkDeferredInstallPrompt.userChoice;if(choice&&choice.outcome==='accepted'){if(st)st.textContent='Install လုပ်နေပါသည်။ ပြီးသွားလျှင် Home Screen မှာ Icon ပေါ်လာပါမည်။'}else{if(st)st.textContent='Install ကို မရွေးချယ်ရသေးပါ။ ပြန်နှိပ်ပြီး Install ကိုရွေးနိုင်ပါတယ်.'}}catch(err){if(st)st.textContent='Install မစနိုင်ပါ။ Chrome Menu မှ Install app ကိုရွေးပါ။'}finally{mkDeferredInstallPrompt=null;b.disabled=false}}else{if(st)st.textContent='ဒီ Browser မှာ Install ခလုတ်ကို တိုက်ရိုက်မဖွင့်နိုင်သေးပါ။ အပေါ်ညာဘက် ⋮ Menu ကိုနှိပ်ပြီး Install app သို့မဟုတ် Add to Home screen ကိုရွေးပါ။';}});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('MK Debt app install setup:',err)));}
