<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24313d"><title>MK Debt</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Myanmar",sans-serif;background:#e9e6df;color:#26384a}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f3ea}header{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:46px 1fr auto;gap:7px;align-items:center;padding:9px;background:#fbf8f0;border-bottom:2px solid #b69a58}.menu{width:44px;height:44px;border:2px solid #293b4d;border-radius:9px;background:#fff8e8;font-size:22px}.title{min-width:0}.title small{color:#68717a;font-size:11px}.title h1{font-size:19px;margin:2px 0;overflow-wrap:anywhere}.actions{display:flex;gap:5px}.btn{border:1px solid #c9c0af;border-radius:8px;background:#fffdf7;color:#31465b;padding:9px 10px;min-height:40px}.primary{background:#304b66;color:#fff;border:0}.danger{background:#9b4038;color:#fff;border:0}main{padding:10px 10px 85px}.card{background:#fffdf8;border:1px solid #d3ccbc;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 7px #0001}.green{background:#355f4e;color:#fff}.green strong{font-size:25px;display:block;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#f3efe6;border-radius:8px;padding:10px;border-left:4px solid #47667e;min-width:0}.stat b{font-size:16px;overflow-wrap:anywhere}.interest{border-left-color:#a86d4c}.balance{border-left-color:#a9812c}.search,.field{width:100%;padding:11px;border:1px solid #cfc6b5;border-radius:8px;background:#fff;margin:6px 0}.field label{display:block;font-size:12px;color:#68717a;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;padding:4px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.person{display:grid;grid-template-columns:42px 1fr auto auto;gap:7px;align-items:center;border:1px solid #d8d0c0;border-radius:10px;padding:8px;margin:7px 0;background:#fffdf8}.avatar{width:40px;height:40px;border-radius:9px;background:#efe5c8;display:grid;place-items:center;font-weight:bold}.amount{text-align:right;font-weight:bold;font-size:13px}.mini{font-size:12px;color:#777}.wide{width:100%;margin-top:7px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tabs button{flex:1;min-width:100px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid #d6cebf;padding:7px;text-align:left;white-space:nowrap}.modal{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:flex-end}.modal.show{display:flex}.modalbox{background:#fffdf8;width:100%;max-width:430px;margin:auto;border-radius:16px 16px 0 0;padding:15px;max-height:90vh;overflow:auto}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);background:#25323e;color:#fff;z-index:40;padding:15px;display:none;box-shadow:8px 0 24px #0005}.drawer.show{display:block}.drawer .item{padding:13px;border:1px solid #53616d;border-radius:9px;margin:8px 0;background:#2b3a49}.close{float:right;background:#293e5b;color:#fff;border:1px solid #65748a;border-radius:8px;padding:6px 10px}.chat{position:fixed;right:max(14px,calc((100vw - 430px)/2 + 14px));bottom:14px;background:#20a866;color:#fff;border:3px solid #fff;border-radius:40px;padding:10px 17px;font-weight:bold;z-index:20}@media(max-width:360px){.actions .btn{padding:8px 6px;font-size:12px}.person{grid-template-columns:38px 1fr auto}.person>.quick{grid-column:3;grid-row:1/3}.avatar{width:36px;height:36px}.amount{font-size:12px}.grid{gap:5px}.card{padding:10px}}
</style></head><body><div class="app"><header><button class="menu" onclick="toggleDrawer()">☰</button><div class="title"><small>MK Debt · Owner</small><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn" onclick="shareApp()">⇧</button><button class="btn primary" onclick="newPerson()">＋</button></div></header><main id="main"></main></div>
<div id="drawer" class="drawer"><button class="close" onclick="toggleDrawer()">×</button><h2>MK Debt Menu</h2><div class="item" onclick="showPage('dashboard')">⌂ Dashboard</div><div class="item" onclick="showPage('database')">▤ Database</div><div class="item" onclick="showPage('receivable')">↙ ရရန်အကြွေး</div><div class="item" onclick="showPage('payable')">↗ ပေးရန်အကြွေး</div><div class="item" onclick="showPage('installment')">▦ အရစ်ကျငွေ</div><div class="item" onclick="showPage('salary')">฿ Salary</div><div class="item" onclick="showPage('chat')">☁ Chat</div></div><button class="chat" onclick="showPage('chat')">☁ Chat</button><div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
const KEY='mk-debt-v2';
const seed={people:[{id:1,name:'Phyu Phyu',phone:'09 421 345 678',page:1,rate:10,principal:20000,paid:0,interest:20000,balance:48000},{id:2,name:'Zin Min Thu',phone:'',page:4,rate:10,principal:20000,paid:0,interest:20000,balance:162900},{id:3,name:'Ko Zwe',phone:'',page:1,rate:10,principal:10000,paid:0,interest:1000,balance:10200}],payables:[{id:1,name:'Payable 1',phone:'',amount:848000,paid:0,note:''}],installments:[],salary:[{name:'Zin Wai Min',wage:2500,days:1,expense:0},{name:'Khom',wage:2250,days:1,expense:0},{name:'Zin Min Thu',wage:1350,days:1,expense:0}],logs:[],messages:[]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function money(n,c='฿'){return Number(n||0).toLocaleString()+' '+c}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toggleDrawer(){document.getElementById('drawer').classList.toggle('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}function log(x){data.logs.unshift({time:new Date().toLocaleString(),text:x});data.logs=data.logs.slice(0,100);save()}
function shareApp(){if(navigator.share)navigator.share({title:'MK Debt',text:'MK Debt',url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied'))}
function showPage(p){toggleDrawer();({dashboard,database,receivable,payable,installment,salary,chat}[p]||dashboard)()}
function newPerson(){modal(`<h2>လူသစ်ထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="nName"></div><div class="field"><label>ဖုန်း</label><input id="nPhone" inputmode="tel"></div><div class="field"><label>အတိုး %</label><input id="nRate" type="number" value="10"></div><button class="btn primary wide" onclick="savePerson()">သိမ်းမည်</button><button class="btn wide" onclick="closeModal()">မလုပ်တော့ပါ</button>`)}function savePerson(){let name=document.getElementById('nName').value.trim();if(!name)return alert('အမည်ထည့်ပါ');let id=Date.now();data.people.push({id,name,phone:document.getElementById('nPhone').value, page:data.people.length+1,rate:+document.getElementById('nRate').value||0,principal:0,paid:0,interest:0,balance:0});log(name+' ကို လူသစ်ထည့်');save();closeModal();receivable()}
function dashboard(){document.getElementById('pageTitle').textContent='Dashboard';let r=data.people.reduce((a,p)=>a+p.balance,0),pay=data.payables.reduce((a,p)=>a+(p.amount-p.paid),0);document.getElementById('main').innerHTML=`<section class="card green"><div>စုစုပေါင်း အခြေအနေ</div><strong>${money(r)}</strong><strong>${money(pay)}</strong><div>ရရန် − ပေးရန် = ${money(r-pay)}</div></section><section class="card"><h2>အမြန်လုပ်ဆောင်ရန်</h2><div class="grid"><button class="btn primary" onclick="receivable()">ရရန်အကြွေး</button><button class="btn" onclick="payable()">ပေးရန်အကြွေး</button><button class="btn" onclick="installment()">အရစ်ကျ</button><button class="btn" onclick="salary()">Salary</button></div></section><section class="card"><h2>နောက်ဆုံးလုပ်ဆောင်ချက်</h2>${data.logs.slice(0,8).map(x=>`<div class="person"><div class="avatar">✓</div><div>${esc(x.text)}<div class="mini">${esc(x.time)}</div></div></div>`).join('')||'<p class="mini">မှတ်တမ်းမရှိသေးပါ</p>'}</section>`}
function receivable(){document.getElementById('pageTitle').textContent='ရရန်အကြွေး';let total=data.people.reduce((a,p)=>a+p.balance,0);document.getElementById('main').innerHTML=`<section class="card green"><div>စုစုပေါင်း ရရန်ငွေ</div><strong>${money(total)}</strong><div>${data.people.length} ယောက်</div></section><section class="card"><div class="row"><h2>ရရန်ရှိသူများ</h2><button class="btn primary" onclick="newPerson()">＋ လူသစ်</button></div><input class="search" placeholder="အမည်ရှာရန်..." oninput="filterPeople(this.value)"><div id="people">${data.people.map((p,i)=>personRow(p,i)).join('')}</div></section>`}
function personRow(p,i){return `<div class="person" data-name="${esc(p.name.toLowerCase())}" onclick="detail(${i})"><div class="avatar">${esc(p.name[0])}</div><div><b>${esc(p.name)}</b><div class="mini">Page ${p.page} · ${esc(p.phone||'ဖုန်းမရှိ')}</div></div><div class="amount">${money(p.balance)}</div><button class="btn quick" onclick="event.stopPropagation();addLoan(${i})">＋</button></div>`}function filterPeople(q){document.querySelectorAll('#people .person').forEach(x=>x.style.display=x.dataset.name.includes(q.toLowerCase())?'grid':'none')}
function detail(i){let p=data.people[i];document.getElementById('pageTitle').textContent=p.name;document.getElementById('main').innerHTML=`<div class="tabs"><button class="btn" onclick="receivable()">← ပြန်</button><button class="btn" onclick="editPerson(${i})">✎ ပြင်</button><button class="btn primary" onclick="addLoan(${i})">＋ ချေးငွေ</button></div><section class="card"><div class="row"><div><h2>${esc(p.name)}</h2><div>${esc(p.phone||'ဖုန်းမထည့်ရသေး')}</div></div><b>${p.rate}%</b></div></section><section class="card"><div class="grid"><div class="stat"><div>ချေးငွေအရင်း</div><b>${money(p.principal)}</b></div><div class="stat"><div>အတိုးပေးပြီး</div><b>${money(p.paid)}</b></div><div class="stat interest"><div>အတိုးကျန်</div><b>${money(p.interest)}</b></div><div class="stat balance"><div>Total Balance</div><b>${money(p.balance)}</b></div></div></section><section class="card"><h2>ငွေပေးချေမှု</h2><button class="btn primary wide" onclick="payment(${i})">＋ ငွေပေးချေမှုထည့်</button><button class="btn wide" onclick="stopInterest(${i})">အတိုးရပ်ပြီး စာရင်းပေါင်း</button><button class="btn danger wide" onclick="deletePerson(${i})">လူကိုဖျက်မည်</button></section><section class="card"><h2>မှတ်တမ်း</h2>${(p.records||[]).map(r=>`<div class="person"><div class="avatar">${r.type==='loan'?'＋':'✓'}</div><div>${esc(r.note||r.type)}<div class="mini">${esc(r.date)}</div></div><b>${money(r.amount)}</b></div>`).join('')||'<p class="mini">မှတ်တမ်းမရှိသေးပါ</p>'}</section>`}
function editPerson(i){let p=data.people[i];modal(`<h2>အချက်အလက်ပြင်ရန်</h2><div class="field"><label>အမည်</label><input id="eName" value="${esc(p.name)}"></div><div class="field"><label>ဖုန်း</label><input id="ePhone" value="${esc(p.phone)}"></div><div class="field"><label>အတိုး %</label><input id="eRate" type="number" value="${p.rate}"></div><button class="btn primary wide" onclick="updatePerson(${i})">သိမ်းမည်</button>`)}function updatePerson(i){let p=data.people[i];p.name=document.getElementById('eName').value.trim()||p.name;p.phone=document.getElementById('ePhone').value;p.rate=+document.getElementById('eRate').value||0;log(p.name+' အချက်အလက်ပြင်');save();closeModal();detail(i)}
function addLoan(i){let p=data.people[i],today=new Date().toISOString().slice(0,10);modal(`<h2>ချေးငွေအသစ်</h2><div class="field"><label>ငွေပမာဏ</label><input id="loanAmt" type="number" value="10000"></div><div class="field"><label>ဘယ်နေ့ချေးခဲ့သလဲ</label><input id="loanDate" type="date" value="${today}"></div><div class="field"><label>မှတ်ချက်</label><input id="loanNote"></div><button class="btn primary wide" onclick="saveLoan(${i})">ထည့်မည်</button>`)}function saveLoan(i){let n=+document.getElementById('loanAmt').value;if(n<=0)return;let p=data.people[i],d=document.getElementById('loanDate').value||new Date().toISOString().slice(0,10);p.principal+=n;p.balance+=n;p.records=p.records||[];p.records.unshift({type:'loan',amount:n,note:document.getElementById('loanNote').value,date:d});log(p.name+' ချေးငွေ '+money(n)+' ထည့် ('+d+')');save();closeModal();detail(i)}
function payment(i){let p=data.people[i];modal(`<h2>ငွေပေးချေမှု</h2><div class="field"><label>ပေးချေငွေ</label><input id="payAmt" type="number" value="${p.balance}"></div><select class="field" id="payType"><option value="interest">အတိုး</option><option value="principal">အရင်း</option><option value="both">အတိုး + အရင်း</option></select><div class="field"><label>မှတ်ချက်</label><input id="payNote"></div><button class="btn primary wide" onclick="savePayment(${i})">သိမ်းမည်</button>`)}function savePayment(i){let n=+document.getElementById('payAmt').value;if(n<=0)return;let p=data.people[i],type=document.getElementById('payType').value;if(type==='interest'){let x=Math.min(n,p.interest);p.interest-=x;p.paid+=x;p.balance-=x}else if(type==='principal'){let x=Math.min(n,p.principal);p.principal-=x;p.balance=Math.max(0,p.balance-x)}else{p.balance=Math.max(0,p.balance-n);p.paid+=n}p.records=p.records||[];p.records.unshift({type:'payment',amount:n,note:document.getElementById('payNote').value,date:new Date().toLocaleDateString()});log(p.name+' ငွေပေး '+money(n));save();closeModal();detail(i)}function stopInterest(i){let p=data.people[i];p.interest=0;log(p.name+' အတိုးရပ်');save();detail(i)}function deletePerson(i){if(confirm('ဒီလူကို ဖျက်မလား?')){log(data.people[i].name+' ဖျက်');data.people.splice(i,1);save();receivable()}}
function payable(){document.getElementById('pageTitle').textContent='ပေးရန်အကြွေး';document.getElementById('main').innerHTML=`<section class="card"><div class="row"><h2>ပေးရန်အကြွေး</h2><button class="btn primary" onclick="newPayable()">＋ ထည့်</button></div>${data.payables.map((p,i)=>`<div class="person"><div class="avatar">↗</div><div><b>${esc(p.name)}</b><div class="mini">${esc(p.note||p.phone||'')}</div></div><div class="amount">${money(p.amount-p.paid)}</div><button class="btn" onclick="payablePayment(${i})">ငွေ</button></div>`).join('')}</section>`}function newPayable(){modal(`<h2>ပေးရန်အကြွေးထည့်</h2><div class="field"><label>အမည်</label><input id="pName"></div><div class="field"><label>ပမာဏ</label><input id="pAmt" type="number"></div><div class="field"><label>မှတ်ချက်</label><input id="pNote"></div><button class="btn primary wide" onclick="savePayable()">သိမ်းမည်</button>`)}function savePayable(){let name=document.getElementById('pName').value.trim(),amount=+document.getElementById('pAmt').value;if(!name||amount<=0)return;data.payables.push({id:Date.now(),name,amount,paid:0,note:document.getElementById('pNote').value});log('ပေးရန်အကြွေး '+name+' ထည့်');save();closeModal();payable()}function payablePayment(i){let p=data.payables[i];let n=+prompt('ပေးချေမည့်ငွေ',p.amount-p.paid);if(n>0){p.paid=Math.min(p.amount,p.paid+n);log(p.name+' ကို '+money(n)+' ပေး');save();payable()}}
function installment(){document.getElementById('pageTitle').textContent='အရစ်ကျငွေ';document.getElementById('main').innerHTML=`<section class="card"><div class="row"><h2>အရစ်ကျ စာရင်း</h2><button class="btn primary" onclick="newInstallment()">＋ ထည့်</button></div>${data.installments.map((p,i)=>`<div class="person"><div class="avatar">▦</div><div><b>${esc(p.name)}</b><div class="mini">လစဉ် ${money(p.monthly)}</div></div><div class="amount">${money(p.remaining)}</div><button class="btn" onclick="installPay(${i})">သွင်း</button></div>`).join('')||'<p class="mini">အရစ်ကျစာရင်း မရှိသေးပါ</p>'}</section>`}function newInstallment(){modal(`<h2>အရစ်ကျအသစ်</h2><div class="field"><label>အမည်</label><input id="iName"></div><div class="field"><label>စုစုပေါင်း</label><input id="iTotal" type="number"></div><div class="field"><label>လစဉ်သွင်းငွေ</label><input id="iMonthly" type="number"></div><button class="btn primary wide" onclick="saveInstallment()">သိမ်းမည်</button>`)}function saveInstallment(){let name=document.getElementById('iName').value.trim(),total=+document.getElementById('iTotal').value,monthly=+document.getElementById('iMonthly').value;if(!name||total<=0||monthly<=0)return;data.installments.push({id:Date.now(),name,total,monthly,paid:0,remaining:total});log('အရစ်ကျ '+name+' ထည့်');save();closeModal();installment()}function installPay(i){let p=data.installments[i],n=+prompt('ဒီအကြိမ်သွင်းငွေ',p.monthly);if(n>0){p.paid+=n;p.remaining=Math.max(0,p.total-p.paid);log(p.name+' အရစ်ကျ '+money(n)+' သွင်း');save();installment()}}
function salary(){document.getElementById('pageTitle').textContent='Salary';document.getElementById('main').innerHTML=`<section class="card"><h2>26/08/2026 — 25/09/2026</h2><div class="mini">Daily wage / Attendance / Expense</div></section><section class="card">${data.salary.map((s,i)=>`<div class="person"><div class="avatar">${s.name[0]}</div><div><b>${esc(s.name)}</b><div class="mini">${s.days} ရက် · Expense ${money(s.expense)}</div></div><b>${money(s.wage*s.days-s.expense)}</b><button class="btn" onclick="editSalary(${i})">ပြင်</button></div>`).join('')}<button class="btn primary wide" onclick="addSalary()">＋ ဝန်ထမ်း</button></section>`}function editSalary(i){let s=data.salary[i];modal(`<h2>${esc(s.name)} Salary</h2><div class="field"><label>Daily wage</label><input id="sw" type="number" value="${s.wage}"></div><div class="field"><label>Attend days</label><input id="sd" type="number" value="${s.days}"></div><div class="field"><label>Expense</label><input id="se" type="number" value="${s.expense}"></div><button class="btn primary wide" onclick="saveSalary(${i})">သိမ်းမည်</button>`)}function saveSalary(i){let s=data.salary[i];s.wage=+document.getElementById('sw').value||0;s.days=+document.getElementById('sd').value||0;s.expense=+document.getElementById('se').value||0;save();closeModal();salary()}function addSalary(){let n=prompt('ဝန်ထမ်းအမည်');if(n){data.salary.push({name:n,wage:500,days:0,expense:0});save();salary()}}
function database(){document.getElementById('pageTitle').textContent='Database';let r=data.people.reduce((a,p)=>a+p.balance,0),pay=data.payables.reduce((a,p)=>a+p.amount-p.paid,0);document.getElementById('main').innerHTML=`<section class="card"><h2>Database Summary</h2><div class="grid"><div class="stat"><div>ရရန်</div><b>${money(r)}</b></div><div class="stat interest"><div>ပေးရန်</div><b>${money(pay)}</b></div><div class="stat balance"><div>Net</div><b>${money(r-pay)}</b></div><div class="stat"><div>လူဦးရေ</div><b>${data.people.length}</b></div></div></section><section class="card"><h2>Data Backup</h2><button class="btn primary wide" onclick="backup()">⬇ Backup JSON</button><button class="btn wide" onclick="resetData()">Sample Data ပြန်ထား</button></section><section class="card"><h2>Activity Log</h2>${data.logs.slice(0,30).map(x=>`<p><b>${esc(x.time)}</b><br>${esc(x.text)}</p>`).join('')||'<p class="mini">မရှိသေးပါ</p>'}</section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='mk-debt-backup.json';a.click()}function resetData(){if(confirm('Sample data ပြန်ထားမလား?')){data=structuredClone(seed);save();database()}}
function chat(){document.getElementById('pageTitle').textContent='Chat';document.getElementById('main').innerHTML=`<section class="card"><h2>MK Debt Chat</h2><div id="msgs">${data.messages.map(m=>`<div class="person"><div class="avatar">${esc(m.user[0])}</div><div><b>${esc(m.user)}</b><div>${esc(m.text)}</div><div class="mini">${esc(m.time)}</div></div></div>`).join('')||'<p class="mini">Message မရှိသေးပါ</p>'}</div><div class="field"><textarea id="msg" rows="3" placeholder="Message ရေးပါ..."></textarea></div><button class="btn primary wide" onclick="sendMsg()">ပို့မည်</button></section>`}function sendMsg(){let t=document.getElementById('msg').value.trim();if(!t)return;data.messages.push({user:'Owner',text:t,time:new Date().toLocaleString()});save();chat()}
receivable();
</script></body></html>
