<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24313d"><title>MK Debt</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#e9e6df;color:#26384a;font-family:Arial,"Noto Sans Myanmar",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f3ea}header{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:44px 1fr auto;gap:7px;align-items:center;padding:9px;background:#fbf8f0;border-bottom:2px solid #b69a58}.menu,.btn{border:1px solid #c9c0af;border-radius:8px;background:#fffdf7;color:#31465b;padding:9px 10px;min-height:40px}.menu{width:44px;font-size:21px;border:2px solid #293b4d;background:#fff8e8}.title{min-width:0}.title small{color:#68717a;font-size:11px}.title h1{font-size:19px;margin:2px 0;overflow-wrap:anywhere}.actions{display:flex;gap:5px}.primary{background:#304b66;color:#fff;border:0}.danger{background:#9b4038;color:#fff;border:0}.wide{width:100%;margin-top:7px}main{padding:10px 10px 80px}.card{background:#fffdf8;border:1px solid #d3ccbc;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 7px #0001}.green{background:#355f4e;color:#fff}.green strong{font-size:23px;display:block;margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#f3efe6;border-radius:8px;padding:10px;border-left:4px solid #47667e;min-width:0}.stat b{font-size:16px;overflow-wrap:anywhere}.interest{border-left-color:#a86d4c}.balance{border-left-color:#a9812c}.field{width:100%;padding:10px;border:1px solid #cfc6b5;border-radius:8px;background:#fff;margin:6px 0}.field label{display:block;font-size:12px;color:#68717a;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;padding:4px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.person{display:grid;grid-template-columns:40px 1fr auto auto;gap:7px;align-items:center;border:1px solid #d8d0c0;border-radius:10px;padding:8px;margin:7px 0;background:#fffdf8}.avatar{width:40px;height:40px;border-radius:9px;background:#efe5c8;display:grid;place-items:center;font-weight:bold}.amount{text-align:right;font-weight:bold;font-size:13px}.mini{font-size:12px;color:#777}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:8px}.tabs button{min-width:82px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid #d6cebf;padding:7px;text-align:left;white-space:nowrap}.modal{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:flex-end}.modal.show{display:flex}.modalbox{background:#fffdf8;width:100%;max-width:430px;margin:auto;border-radius:16px 16px 0 0;padding:15px;max-height:92vh;overflow:auto}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);background:#25323e;color:#fff;z-index:40;padding:15px;display:none;box-shadow:8px 0 24px #0005}.drawer.show{display:block}.drawer .item{padding:13px;border:1px solid #53616d;border-radius:9px;margin:8px 0;background:#2b3a49}.close{float:right;background:#293e5b;color:#fff;border:1px solid #65748a;border-radius:8px;padding:6px 10px}.chat{position:fixed;right:max(14px,calc((100vw - 430px)/2 + 14px));bottom:14px;background:#20a866;color:#fff;border:3px solid #fff;border-radius:40px;padding:10px 17px;font-weight:bold;z-index:20}@media(max-width:360px){.person{grid-template-columns:36px 1fr auto}.person>.quick{grid-column:3}.avatar{width:36px;height:36px}.actions .btn{padding:8px 6px;font-size:12px}}</style></head><body><div class="app"><header><button class="menu" onclick="toggleDrawer()">☰</button><div class="title"><small>MK Debt · Owner</small><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn" onclick="shareApp()">⇧</button><button class="btn primary" onclick="newPerson()">＋</button></div></header><main id="main"></main></div><div id="drawer" class="drawer"><button class="close" onclick="toggleDrawer()">×</button><h2>MK Debt Menu</h2><div class="item" onclick="showPage('dashboard')">⌂ Dashboard</div><div class="item" onclick="showPage('database')">▤ Database</div><div class="item" onclick="showPage('receivable')">↙ ရရန်အကြွေး</div><div class="item" onclick="showPage('payable')">↗ ပေးရန်အကြွေး</div><div class="item" onclick="showPage('installment')">▦ အရစ်ကျငွေ</div><div class="item" onclick="showPage('salary')">฿ Salary</div><div class="item" onclick="showPage('chat')">☁ Chat</div></div><button class="chat" onclick="showPage('chat')">☁ Chat</button><div id="modal" class="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
const KEY='mk-debt-v4';const seed={people:[{id:1,name:'Phyu Phyu',phone:'09 421 345 678',page:1,rate:10,records:[{id:101,type:'loan',amount:20000,date:'2026-07-01',note:'မူလချေးငွေ'}]},{id:2,name:'Zin Min Thu',phone:'',page:4,rate:10,records:[{id:102,type:'loan',amount:20000,date:'2026-08-01',note:''}]},{id:3,name:'Ko Zwe',phone:'',page:1,rate:10,records:[{id:103,type:'loan',amount:10000,date:'2026-08-01',note:''}]}],payables:[],installments:[],salary:[{name:'Zin Wai Min',wage:2500,days:1,expense:0},{name:'Khom',wage:2250,days:1,expense:0},{name:'Zin Min Thu',wage:1350,days:1,expense:0}],logs:[],messages:[]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(n,c='฿'){return Number(n||0).toLocaleString()+' '+c}function toggleDrawer(){document.getElementById('drawer').classList.toggle('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}function log(x){data.logs.unshift({time:new Date().toLocaleString(),text:x});data.logs=data.logs.slice(0,100);save()}function shareApp(){if(navigator.share)navigator.share({title:'MK Debt',text:'MK Debt',url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Link copied'))}function showPage(p){toggleDrawer();({dashboard,database,receivable,payable,installment,salary,chat}[p]||dashboard)()}
function monthKey(d){let s=typeof d==='string'?d:'';if(/^\d{4}-\d{2}$/.test(s))s+='-01';let x=new Date((s||new Date().toISOString().slice(0,10))+'T00:00:00');return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function addMonths(k,n){let [y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function fmtMonth(k){let [y,m]=k.split('-');return m+'/'+y}
function loans(p){return(p.records||[]).filter(r=>r.type==='loan'&&Number(r.amount)>0&&r.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||Number(a.id||0)-Number(b.id||0))}
function payments(p){return(p.records||[]).filter(r=>r.type==='payment'&&Number(r.amount)>0).slice().sort((a,b)=>String(a.month||monthKey(a.date||'')).localeCompare(String(b.month||monthKey(b.date||'')))||String(a.date||'').localeCompare(String(b.date||''))||Number(a.id||0)-Number(b.id||0))}
function rebuildLedger(p){
  let ls=loans(p),ps=payments(p);
  if(!ls.length)return {months:[],principal:0,interestPaid:0,interestDue:0,principalPaid:0,allocations:{}};
  let first=monthKey(ls[0].date),last=monthKey(new Date()),cur=first,principal=0,interestPaid=0,principalPaid=0,months=[],queue=[],allocations={};
  while(cur<=last){
    for(const l of ls.filter(x=>monthKey(x.date)===cur))principal+=Number(l.amount)||0;
    let due=p.interestStopped?0:principal*(Number(p.rate)||0)/100;
    let item={month:cur,due,paid:0,remaining:due,principalStart:principal,principalEnd:principal};
    if(due>0)queue.push(item);
    for(const pay of ps.filter(x=>(x.month||monthKey(x.date||''))===cur)){
      let left=Number(pay.amount)||0,ia=0,pa=0,type=pay.type||'both';
      if(type!=='principal'&&!p.interestStopped){
        for(const q of queue){if(left<=0)break;let need=Math.max(0,q.due-q.paid),take=Math.min(left,need);q.paid+=take;q.remaining=Math.max(0,q.due-q.paid);left-=take;ia+=take}
      }
      if(type!=='interest'&&left>0){let take=Math.min(left,principal);principal-=take;principalPaid+=take;pa+=take;left-=take}
      interestPaid+=ia;
      allocations[String(pay.id)]={interestApplied:ia,principalApplied:pa,unapplied:left};
    }
    item.principalEnd=principal;
    months.push(item);
    cur=addMonths(cur,1);
  }
  let interestDue=months.reduce((a,x)=>a+Math.max(0,x.due-x.paid),0);
  return {months,principal,interestPaid,interestDue,principalPaid,allocations};
}
function syncInterest(p){let l=rebuildLedger(p);p.interestMonths=l.months.map(x=>({id:String(p.id||p.name)+'@'+x.month,month:x.month,due:x.due,paid:x.paid,remaining:x.remaining}));return l}
function calc(p){let l=syncInterest(p),original=loans(p).reduce((a,r)=>a+Number(r.amount),0);return{principalOriginal:original,principal:l.principal,interestPaid:l.interestPaid,interestDue:p.interestStopped?0:l.interestDue,balance:l.principal+(p.interestStopped?0:l.interestDue)}}
function applyInterestPayment(p,amount,until){let l=rebuildLedger(p),left=Number(amount)||0,applied=0;for(const x of l.months.filter(x=>x.month<=until)){let take=Math.min(left,Math.max(0,x.due-x.paid));left-=take;applied+=take;if(left<=0)break}return{applied,left}}
function payment(i){let p=data.people[i],today=new Date().toISOString().slice(0,10),month=monthKey(today),c=calc(p);modal(`<h2>ငွေပေးချေမှု</h2><div class="field"><label>ပေးချေငွေ</label><input id="payAmt" type="number" min="0" value="${c.balance}"></div><div class="field"><label>ပေးချေသည့်ရက်</label><input id="payDate" type="date" value="${today}"></div><div class="field"><label>အတိုးတွက်/ပေးမည့်လ</label><input id="payMonth" type="month" value="${month}"></div><select class="field" id="payType"><option value="both">အတိုး + အရင်း (Auto)</option><option value="interest">အတိုးသာ</option><option value="principal">အရင်းသာ</option></select><div id="interestPreview" class="mini"></div><div class="field"><label>မှတ်ချက်</label><input id="payNote"></div><button class="btn primary wide" onclick="savePayment(${i})">သိမ်းမည်</button>`);updateInterestPreview(i)}
function updateInterestPreview(i){let p=data.people[i],m=document.getElementById('payMonth')?.value;if(!m)return;let l=syncInterest(p),due=l.months.filter(x=>x.month<=m).reduce((a,x)=>a+Math.max(0,x.due-x.paid),0),el=document.getElementById('interestPreview');if(el)el.textContent='မပေးရသေးသော အတိုး: '+money(due)+' · '+l.months.filter(x=>x.month<=m&&x.due>x.paid).length+' လ'}
function savePayment(i){let amount=Number(document.getElementById('payAmt').value),p=data.people[i];if(amount<=0)return alert('ပေးချေငွေထည့်ပါ');let type=document.getElementById('payType').value,date=document.getElementById('payDate').value||new Date().toISOString().slice(0,10),month=document.getElementById('payMonth').value||monthKey(date),before=calc(p),left=amount,interestApplied=0,principalApplied=0;
  if(type!=='principal'){let z=applyInterestPayment(p,left,month);interestApplied=z.applied;left=z.left}
  if(type!=='interest'&&left>0)principalApplied=Math.min(left,before.principal);
  p.records=p.records||[];p.records.unshift({id:Date.now(),type:'payment',amount,date,month,note:document.getElementById('payNote').value,interestApplied,principalApplied,paymentType:type});
  save();syncInterest(p);log(p.name+' ငွေပေး '+money(amount)+' · အတိုး Auto '+money(interestApplied)+' · အရင်း '+money(principalApplied));save();closeModal();detail(i)}
function newPerson(){modal(`<h2>လူသစ်ထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="nName"></div><div class="field"><label>ဖုန်း</label><input id="nPhone" inputmode="tel"></div><div class="field"><label>အတိုး % / လ</label><input id="nRate" type="number" min="0" step="0.01" value="10"></div><button class="btn primary wide" onclick="savePerson()">သိမ်းမည်</button>`)}function savePerson(){let name=document.getElementById('nName').value.trim();if(!name)return alert('အမည်ထည့်ပါ');data.people.push({id:Date.now(),name,phone:document.getElementById('nPhone').value.trim(),page:data.people.length+1,rate:Number(document.getElementById('nRate').value)||0,records:[]});log(name+' ကို လူသစ်ထည့်');save();closeModal();receivable()}
function dashboard(){document.getElementById('pageTitle').textContent='Dashboard';let r=data.people.reduce((a,p)=>a+calc(p).balance,0),pay=data.payables.reduce((a,p)=>a+Math.max(0,Number(p.amount)-Number(p.paid||0)),0);document.getElementById('main').innerHTML=`<section class="card green"><div>စုစုပေါင်း ရရန်</div><strong>${money(r)}</strong><div>ပေးရန် ${money(pay)}</div><div>ရရန် − ပေးရန် = ${money(r-pay)}</div></section><section class="card"><h2>အမြန်လုပ်ဆောင်ရန်</h2><div class="grid"><button class="btn primary" onclick="receivable()">ရရန်အကြွေး</button><button class="btn" onclick="payable()">ပေးရန်အကြွေး</button><button class="btn" onclick="installment()">အရစ်ကျ</button><button class="btn" onclick="salary()">Salary</button></div></section><section class="card"><h2>နောက်ဆုံးလုပ်ဆောင်ချက်</h2>${data.logs.slice(0,8).map(x=>`<div class="person"><div class="avatar">✓</div><div>${esc(x.text)}<div class="mini">${esc(x.time)}</div></div></div>`).join('')||'<p class="mini">မှတ်တမ်းမရှိသေးပါ</p>'}</section>`}
function receivable(){document.getElementById('pageTitle').textContent='ရရန်အကြွေး';let total=data.people.reduce((a,p)=>a+calc(p).balance,0);document.getElementById('main').innerHTML=`<section class="card green"><div>စုစုပေါင်း ရရန်ငွေ</div><strong>${money(total)}</strong><div>${data.people.length} ယောက်</div></section><section class="card"><div class="row"><h2>ရရန်ရှိသူများ</h2><button class="btn primary" onclick="newPerson()">＋ လူသစ်</button></div><input class="field" placeholder="အမည်ရှာရန်..." oninput="filterPeople(this.value)"><div id="people">${data.people.map((p,i)=>personRow(p,i)).join('')}</div></section>`}function personRow(p,i){let c=calc(p);return `<div class="person" data-name="${esc(p.name.toLowerCase())}" onclick="detail(${i})"><div class="avatar">${esc(p.name[0]||'?')}</div><div><b>${esc(p.name)}</b><div class="mini">Page ${p.page} · ${esc(p.phone||'ဖုန်းမရှိ')} · ${p.rate}%</div></div><div class="amount">${money(c.balance)}<div class="mini">အတိုး ${money(c.interestDue)}</div></div><button class="btn quick" onclick="event.stopPropagation();addLoan(${i})">＋</button></div>`}function filterPeople(q){document.querySelectorAll('#people .person').forEach(x=>x.style.display=x.dataset.name.includes(q.toLowerCase())?'grid':'none')}
function detail(i){let p=data.people[i],c=calc(p);document.getElementById('pageTitle').textContent=p.name;let rows=(p.interestMonths||[]).filter(x=>Number(x.due)>0);document.getElementById('main').innerHTML=`<div class="tabs"><button class="btn" onclick="receivable()">← ပြန်</button><button class="btn" onclick="editPerson(${i})">✎ ပြင်</button><button class="btn primary" onclick="addLoan(${i})">＋ ချေးငွေ</button></div><section class="card"><div class="row"><div><h2>${esc(p.name)}</h2><div>${esc(p.phone||'ဖုန်းမထည့်ရသေး')}</div></div><b>${p.rate}% / လ</b></div>${p.interestStopped?'<div class="mini">အတိုးရပ်ထားသည်</div>':''}</section><section class="card"><div class="grid"><div class="stat"><div>မူလချေးငွေ</div><b>${money(c.principalOriginal)}</b></div><div class="stat"><div>အရင်းကျန်</div><b>${money(c.principal)}</b></div><div class="stat interest"><div>အတိုးပေးပြီး</div><b>${money(c.interestPaid)}</b></div><div class="stat interest"><div>အတိုးကျန်</div><b>${money(c.interestDue)}</b></div></div><div class="stat balance" style="margin-top:7px"><div>Total Balance</div><b>${money(c.balance)}</b></div></section><section class="card"><h2>ငွေပေးချေမှု</h2><button class="btn primary wide" onclick="payment(${i})">＋ ငွေပေးချေမှုထည့်</button>${p.interestStopped?'':'<button class="btn wide" onclick="stopInterest('+i+')">အတိုးရပ်ပြီး အကြွေးပေါင်း</button>'}</section><section class="card"><h2>လစဉ်အတိုးစာရင်း</h2><div class="table"><table><tr><th>လ</th><th>အတိုး</th><th>ပေးပြီး</th><th>ကျန်</th></tr>${rows.map(x=>`<tr><td>${fmtMonth(x.month)}</td><td>${money(x.due)}</td><td>${money(x.paid)}</td><td>${money(Math.max(0,x.due-x.paid))}</td></tr>`).join('')}</table></div></section><section class="card"><h2>ငွေစာရင်းမှတ်တမ်း</h2>${(p.records||[]).slice().reverse().map(r=>`<div class="person"><div class="avatar">${r.type==='loan'?'＋':'✓'}</div><div><b>${r.type==='loan'?'ချေးငွေ':'ငွေပေး'}</b><div class="mini">${esc(r.date||'')} · ${esc(r.note||'')}</div></div><div class="amount">${money(r.amount)}<div class="mini">အတိုး ${money(r.interestApplied||0)} / အရင်း ${money(r.principalApplied||0)}</div></div></div>`).join('')||'<p class="mini">မှတ်တမ်းမရှိသေးပါ</p>'}</section>`}
function addLoan(i){let p=data.people[i],today=new Date().toISOString().slice(0,10);modal(`<h2>${esc(p.name)} — ချေးငွေထည့်ရန်</h2><div class="field"><label>ချေးငွေအရင်း</label><input id="loanAmt" type="number" min="0" step="0.01"></div><div class="field"><label>ချေးသည့်ရက်</label><input id="loanDate" type="date" value="${today}"></div><div class="field"><label>အတိုး % / လ</label><input id="loanRate" type="number" min="0" step="0.01" value="${p.rate}"></div><div class="field"><label>မှတ်ချက်</label><input id="loanNote"></div><button class="btn primary wide" onclick="saveLoan(${i})">ချေးငွေသိမ်းမည်</button>`)}function saveLoan(i){let p=data.people[i],a=Number(document.getElementById('loanAmt').value);if(a<=0)return alert('ချေးငွေပမာဏထည့်ပါ');p.rate=Number(document.getElementById('loanRate').value)||0;p.records=p.records||[];p.records.push({id:Date.now(),type:'loan',amount:a,date:document.getElementById('loanDate').value||new Date().toISOString().slice(0,10),note:document.getElementById('loanNote').value});p.interestStopped=false;syncInterest(p);log(p.name+' ကို '+money(a)+' ချေးငွေထည့်');save();closeModal();detail(i)}
function monthKey(d){let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function monthLabel(k){let [y,m]=k.split('-');return m+'/'+y}
function addMonths(k,n){let [y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function syncInterestMonths(p){
  p.interestMonths=p.interestMonths||[];
  let loans=(p.records||[]).filter(r=>r.type==='loan'&&r.amount>0&&r.date);
  for(let r of loans){
    let start=monthKey(r.date), end=monthKey(new Date()), cur=start;
    let monthly=Number(r.amount||0)*Number(p.rate||0)/100;
    while(cur<=end){
      let id=(r.id||r.date+'-'+r.amount)+'@'+cur;
      if(!p.interestMonths.some(x=>x.id===id))p.interestMonths.push({id,month:cur,due:monthly,paid:0,loanDate:r.date});
      cur=addMonths(cur,1);
    }
  }
  p.interestMonths.sort((a,b)=>a.month.localeCompare(b.month));
}
function unpaidInterest(p,until){syncInterestMonths(p);return p.interestMonths.filter(x=>x.month<=until&&Number(x.due)>Number(x.paid||0))}
function applyInterestPayment(p,n,until){
  syncInterestMonths(p);
  let left=n,applied=0;
  for(let x of unpaidInterest(p,until)){
    if(left<=0)break;
    let take=Math.min(left,Math.max(0,Number(x.due)-Number(x.paid||0)));
    x.paid=Number(x.paid||0)+take;left-=take;applied+=take;
  }
  if(applied>0){p.interest=Math.max(0,Number(p.interest||0)-applied);p.balance=Math.max(0,Number(p.balance||0)-applied)}
  return {applied,left};
}
function payment(i){let p=data.people[i],today=new Date().toISOString().slice(0,10),month=monthKey(today);syncInterestMonths(p);modal(`<h2>ငွေပေးချေမှု</h2><div class="field"><label>ပေးချေငွေ</label><input id="payAmt" type="number" value="${p.balance}"></div><div class="field"><label>ပေးချေသည့်ရက်</label><input id="payDate" type="date" value="${today}"></div><div class="field"><label>အတိုးတွက်/ပေးမည့်လ</label><input id="payMonth" type="month" value="${month}"></div><select class="field" id="payType"><option value="interest">အတိုး</option><option value="principal">အရင်း</option><option value="both">အတိုး + အရင်း</option></select><div class="mini">အတိုးပေးလျှင် အရင်ဆုံး မပေးရသေးသော အဟောင်းဆုံးလကို Auto နှုတ်ပေးမည်။</div><div id="interestPreview" class="mini"></div><div class="field"><label>မှတ်ချက်</label><input id="payNote"></div><button class="btn primary wide" onclick="savePayment(${i})">သိမ်းမည်</button>`);updateInterestPreview(i)}
function updateInterestPreview(i){let p=data.people[i],m=document.getElementById('payMonth')?.value;if(!m)return;let due=unpaidInterest(p,m).reduce((a,x)=>a+Math.max(0,Number(x.due)-Number(x.paid||0)),0);let el=document.getElementById('interestPreview');if(el)el.textContent='မပေးရသေးသော အတိုး: '+money(due)+' · '+unpaidInterest(p,m).length+' လ';document.getElementById('payMonth')?.addEventListener('change',()=>updateInterestPreview(i),{once:true})}
function savePayment(i){let n=+document.getElementById('payAmt').value;if(n<=0)return;let p=data.people[i],type=document.getElementById('payType').value,d=document.getElementById('payDate').value||new Date().toISOString().slice(0,10),m=document.getElementById('payMonth').value||monthKey(d),interestApplied=0;
  if(type==='interest'){let z=applyInterestPayment(p,n,m);interestApplied=z.applied;n=z.applied}
  else if(type==='principal'){let x=Math.min(n,p.principal);p.principal-=x;p.balance=Math.max(0,p.balance-x)}
  else{let z=applyInterestPayment(p,n,m);interestApplied=z.applied;let rem=n-z.applied;if(rem>0){let x=Math.min(rem,p.principal);p.principal-=x;p.balance=Math.max(0,p.balance-x)}}
  p.records=p.records||[];p.records.unshift({id:Date.now(),type:'payment',amount:+document.getElementById('payAmt').value,note:document.getElementById('payNote').value,date:d,month:m,interestApplied});log(p.name+' ငွေပေး '+money(+document.getElementById('payAmt').value)+' · အတိုး Auto '+money(interestApplied));save();closeModal();detail(i)}function stopInterest(i){let p=data.people[i],c=calc(p);modal(`<h2>အတိုးရပ်ပြီး စာရင်းပေါင်းရန်</h2><p>အရင်းကျန် <b>${money(c.principal)}</b></p><p>အတိုးကျန် <b>${money(c.interestDue)}</b></p><p>Total <b>${money(c.balance)}</b></p><div class="mini">အတိုးရပ်ပြီးနောက် လက်ရှိအတိုးကို အရင်းထဲပေါင်းပြီး နောက်ထပ်လစဉ်အတိုးမတွက်ပါ။</div><button class="btn danger wide" onclick="confirmStopInterest(${i})">အတိုးရပ်ပြီး ပေါင်းမည်</button>`)}function confirmStopInterest(i){let p=data.people[i],c=calc(p);p.interestStopped=true;if(c.interestDue>0){p.records.push({id:Date.now(),type:'loan',amount:c.interestDue,date:new Date().toISOString().slice(0,10),note:'အတိုးရပ်ပြီး အရင်းထဲပေါင်းထားသည်'});p.interestMonths=(p.interestMonths||[]).map(x=>({...x,paid:x.due}))}log(p.name+' အတိုးရပ်ပြီး '+money(c.interestDue)+' ပေါင်း');save();closeModal();detail(i)}
function editPerson(i){let p=data.people[i],loans=(p.records||[]).filter(r=>r.type==='loan').slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))),first=loans.length?loans[0].date:'',last=loans.length?loans[loans.length-1].date:'';modal(`<h2>အချက်အလက်ပြင်ရန်</h2><div class="field"><label>အမည်</label><input id="eName" value="${esc(p.name)}"></div><div class="field"><label>ဖုန်း</label><input id="ePhone" value="${esc(p.phone)}"></div><div class="field"><label>အတိုး %</label><input id="eRate" type="number" value="${p.rate}"></div><div class="field"><label>📅 ပထမဆုံးချေးခဲ့သည့်နေ့</label><input id="eLoanStart" type="date" value="${first}"></div><div class="field"><label>📅 နောက်ဆုံးချေးငွေထည့်သည့်နေ့</label><input id="eLoanLast" type="date" value="${last}"></div><button class="btn primary wide" onclick="updatePerson(${i})">သိမ်းမည်</button>`)}function updatePerson(i){let p=data.people[i];p.name=document.getElementById('eName').value.trim()||p.name;p.phone=document.getElementById('ePhone').value;p.rate=+document.getElementById('eRate').value||0;let loans=(p.records||[]).filter(r=>r.type==='loan').slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))),start=document.getElementById('eLoanStart')?.value,last=document.getElementById('eLoanLast')?.value;if(loans.length&&start)loans[0].date=start;if(loans.length&&last)loans[loans.length-1].date=last;log(p.name+' အချက်အလက်နှင့် ချေးငွေရက်စွဲပြင်');save();closeModal();detail(i)}
function database(){document.getElementById('pageTitle').textContent='Database';let r=data.people.reduce((a,p)=>a+calc(p).balance,0),pay=data.payables.reduce((a,p)=>a+Math.max(0,p.amount-p.paid),0);document.getElementById('main').innerHTML=`<section class="card"><h2>Database Summary</h2><div class="grid"><div class="stat"><div>ရရန်</div><b>${money(r)}</b></div><div class="stat"><div>ပေးရန်</div><b>${money(pay)}</b></div><div class="stat balance"><div>Net</div><b>${money(r-pay)}</b></div><div class="stat"><div>လူဦးရေ</div><b>${data.people.length}</b></div></div></section><section class="card"><h2>လူစာရင်း</h2>${data.people.map((p,i)=>{let c=calc(p);return `<div class="person" onclick="detail(${i})"><div class="avatar">${esc(p.name[0]||'?')}</div><div><b>${esc(p.name)}</b><div class="mini">အရင်းကျန် ${money(c.principal)} · အတိုးကျန် ${money(c.interestDue)}</div></div><div class="amount">${money(c.balance)}</div></div>`}).join('')}</section>`}
function payable(){document.getElementById('pageTitle').textContent='ပေးရန်အကြွေး';let total=data.payables.reduce((a,p)=>a+Math.max(0,p.amount-p.paid),0);document.getElementById('main').innerHTML=`<section class="card green"><div>စုစုပေါင်း ပေးရန်</div><strong>${money(total)}</strong></section><section class="card"><div class="row"><h2>ပေးရန်ရှိသူများ</h2><button class="btn primary" onclick="newPayable()">＋</button></div>${data.payables.map((p,i)=>`<div class="person"><div class="avatar">↗</div><div><b>${esc(p.name)}</b></div><div class="amount">${money(Math.max(0,p.amount-p.paid))}</div><button class="btn quick" onclick="payPayable(${i})">ပေး</button></div>`).join('')||'<p class="mini">စာရင်းမရှိသေးပါ</p>'}</section>`}function newPayable(){modal(`<h2>ပေးရန်အကြွေးထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="pn"></div><div class="field"><label>ပမာဏ</label><input id="pa" type="number"></div><button class="btn primary wide" onclick="savePayable()">သိမ်းမည်</button>`)}function savePayable(){let n=document.getElementById('pn').value.trim(),a=Number(document.getElementById('pa').value);if(!n||a<=0)return;data.payables.push({id:Date.now(),name:n,amount:a,paid:0});log(n+' ပေးရန် '+money(a)+' ထည့်');save();closeModal();payable()}function payPayable(i){let p=data.payables[i],n=Number(prompt('ပေးချေငွေ',Math.max(0,p.amount-p.paid)));if(n>0){p.paid=Math.min(p.amount,p.paid+n);log(p.name+' ကို '+money(n)+' ပေး');save();payable()}}
function installment(){document.getElementById('pageTitle').textContent='အရစ်ကျ';document.getElementById('main').innerHTML=`<section class="card"><h2>အရစ်ကျ</h2><button class="btn primary wide" onclick="newInstallment()">＋ အရစ်ကျစာချုပ်ထည့်ရန်</button></section><section class="card">${data.installments.map(x=>`<div class="person"><div class="avatar">▦</div><div><b>${esc(x.name)}</b><div class="mini">${x.paidCount||0}/${x.count} ကြိမ်</div></div><div class="amount">${money(x.total-x.paid)}</div></div>`).join('')||'<p class="mini">မှတ်တမ်းမရှိသေးပါ</p>'}</section>`}function newInstallment(){modal(`<h2>အရစ်ကျထည့်ရန်</h2><div class="field"><label>အမည်</label><input id="in"></div><div class="field"><label>စုစုပေါင်း</label><input id="it" type="number"></div><div class="field"><label>အကြိမ်ရေ</label><input id="ic" type="number" value="10"></div><button class="btn primary wide" onclick="saveInstallment()">သိမ်းမည်</button>`)}function saveInstallment(){let n=document.getElementById('in').value.trim(),t=Number(document.getElementById('it').value),c=Number(document.getElementById('ic').value);if(!n||t<=0||c<=0)return;data.installments.push({id:Date.now(),name:n,total:t,count:c,paid:0,paidCount:0});log(n+' အရစ်ကျစာချုပ်ထည့်');save();closeModal();installment()}
function salary(){document.getElementById('pageTitle').textContent='Salary';document.getElementById('main').innerHTML=`<section class="card"><h2>26/08/2026 — 25/09/2026</h2><p class="mini">လစာစာရင်း</p></section><section class="card">${data.salary.map(s=>`<div class="person"><div class="avatar">฿</div><div><b>${esc(s.name)}</b><div class="mini">${s.days||0} days · Expense ${money(s.expense||0)}</div></div><div class="amount">${money(s.wage)}</div></div>`).join('')}</section>`}function chat(){document.getElementById('pageTitle').textContent='Chat';document.getElementById('main').innerHTML=`<section class="card"><h2>Chat</h2>${data.messages.map(m=>`<div class="person"><div class="avatar">💬</div><div><b>${esc(m.name)}</b><div>${esc(m.text)}</div><div class="mini">${esc(m.time)}</div></div></div>`).join('')||'<p class="mini">Message မရှိသေးပါ</p>'}<div class="field"><input id="msg" placeholder="Message ရေးပါ..." onkeydown="if(event.key==='Enter')sendMsg()"></div><button class="btn primary wide" onclick="sendMsg()">ပို့မည်</button></section>`}function sendMsg(){let x=document.getElementById('msg').value.trim();if(!x)return;data.messages.push({name:'Owner',text:x,time:new Date().toLocaleString()});save();chat()}
data.people.forEach(syncInterest);save();dashboard();
</script></body></html>
