<!doctype html><html lang="my"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>MK Debt</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070b18;color:#eef3ff;font-family:Arial,"Noto Sans Myanmar",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;background:#0b1020}.top{padding:15px;position:sticky;top:0;z-index:8;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff14}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#38d6ff,#9a5cff);font-size:23px;box-shadow:0 8px 25px #0005}.brand h1{margin:0;font-size:21px}.brand small{color:#9da7c5}.content{padding:12px 12px 90px}.page{display:none}.page.active{display:block}.card,.hero{background:linear-gradient(145deg,#121a30,#0f1628);border:1px solid #ffffff12;border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 10px 30px #0003}.hero{background:linear-gradient(135deg,#152b45,#24163d)}.hero h2{margin:7px 0}.label,.muted,small{color:#9da7c5}.big{font-size:24px;font-weight:800;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{width:100%;margin:6px 0;padding:10px;border:1px solid #ffffff16;border-radius:11px;background:#0a1020;color:#eef3ff}.field label{display:block;font-size:12px;color:#9da7c5;margin-bottom:3px}.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;color:#eef3ff;padding:4px}.btn{border:1px solid #ffffff18;border-radius:11px;background:#151d31;color:#eef3ff;padding:10px 13px;min-height:42px}.primary{background:linear-gradient(135deg,#2ab9ff,#8e55ff);border:0}.green{background:linear-gradient(135deg,#19bd82,#087f9f);border:0}.full{width:100%;margin-top:7px}.person{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #ffffff12;border-radius:13px;background:#0d1425;margin:8px 0}.avatar{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#2ab9ff,#8e55ff);font-weight:bold}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grow small{color:#9da7c5}.right{text-align:right}.loanShade{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}.loanShade .loanCard{width:100%;max-width:430px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0}.loanShade .loanBackdrop{position:absolute;inset:0}.loanShade .loanCard{position:relative;z-index:1}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:8px;border-bottom:1px solid #ffffff12;white-space:nowrap;text-align:left}.empty{text-align:center;padding:25px;color:#9da7c5}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:9;background:#080d1df5;padding:7px 4px;border-top:1px solid #ffffff12}.nav{background:none;border:0;color:#9da7c5;font-size:11px;padding:5px}.nav b{display:block;font-size:19px}.nav.active{color:#fff}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#17203a;padding:12px 17px;border-radius:25px;opacity:0;z-index:70;transition:.2s}.toast.show{opacity:1}</style><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>Loan Management · 3D Mobile</small></div></div></header><main class="content"><section id="dashboard" class="page active"></section><section id="newloan" class="page"></section><section id="borrowers" class="page"></section><section id="payments" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="detail" class="page"></section></main></div><nav class="bottom"><button class="nav active" data-page="dashboard"><b>⌂</b>Dashboard</button><button class="nav" data-page="borrowers"><b>👥</b>Borrowers</button><button class="nav" data-page="newloan"><b>＋</b>Add Loan</button><button class="nav" data-page="payments"><b>↙</b>Payment</button><button class="nav" data-page="settings"><b>☷</b>More</button></nav><div id="toast" class="toast"></div><script>
const K='mk-debt-live-v2';let d=JSON.parse(localStorage.getItem(K)||'null')||{rate:10,currency:'MMK',people:[],payments:[]},cur=null,$=x=>document.getElementById(x),N=x=>Number(x)||0,T=()=>new Date().toISOString().slice(0,10),M=(x,c)=>N(x).toLocaleString()+' '+c,E=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));function save(){localStorage.setItem(K,JSON.stringify(d))}function toast(x){let e=$('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function ip(p){if(p.stop)return 0;let a=new Date((p.date||T())+'T00:00:00'),b=new Date(),m=Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()),paid=d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+N(x.i),0);return Math.max(0,N(p.amount)*N(p.rate)/100*m-paid)}function pp(p){return d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+N(x.p),0)}function bal(p){return Math.max(0,N(p.amount)-pp(p)+ip(p))}function page(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));$(x).classList.add('active');document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.page===x));render(x);scrollTo(0,0)}function render(x){({dashboard,newloan,borrowers,payments,reports,settings,detail}[x]||dashboard)()}function person(p){return `<div class=person data-a=detail data-id=${p.id}><div class=avatar>${E((p.name||'?')[0])}</div><div class=grow><b>${E(p.name)}</b><small>${E(p.phone||'')} · ${p.currency}</small></div><div class=right><b>${M(bal(p),p.currency)}</b><small class=muted>ကျန်</small></div></div>`}function dashboard(){$('dashboard').innerHTML=`<div class=hero><div class=label>MK DEBT · OWNER DASHBOARD</div><h2>ငွေကြေးကို တစ်နေရာတည်းမှာ စီမံပါ</h2><p class=muted>ချေးငွေ၊ အတိုး၊ Payment အားလုံးကို ဖုန်းထဲက စီမံပါ။</p><button class="btn primary" data-page=newloan>＋ ချေးငွေထည့်မယ်</button></div><div class=grid><div class=card><span class=label>MMK · ကျန်</span><div class=big>${M(d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+bal(p),0),'MMK')}</div></div><div class=card><span class=label>THB · ကျန်</span><div class=big>${M(d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+bal(p),0),'THB')}</div></div></div><div class=card><h3>👥 Borrowers · ${d.people.length}</h3>${d.people.slice().reverse().map(person).join('')||'<div class=empty>စာရင်းမရှိသေးပါ</div>'}</div>`}function newloan(){$('newloan').innerHTML=`<div class=loanShade data-a=closeLoan><div class=loanBackdrop></div><div class="card loanCard"><div class=row><h2>➕ Add Loan</h2><button class=btn data-a=closeLoan>×</button></div><div class=field><label>အမည် *</label><input id=nn placeholder="ချေးငွေယူသူအမည်"></div><div class=field><label>ဖုန်း</label><input id=np inputmode=tel></div><div class=grid><div class=field><label>ငွေပမာဏ *</label><input id=na type=number min=0></div><div class=field><label>Currency</label><select id=nc><option>MMK</option><option>THB</option></select></div></div><div class=grid><div class=field><label>ချေးသည့်ရက်</label><input id=nd type=date value=${T()}></div><div class=field><label>အတိုး % / လ</label><input id=nr type=number value=${d.rate||10} step=.1></div></div><div class=field><label>လစဉ်ပေးငွေ</label><input id=nm type=number min=0></div><div class=card id=prev>ငွေပမာဏထည့်ပါ</div><button class="btn green full" data-a=saveLoan>✓ Save Loan</button><button class="btn full" data-a=closeLoan>Cancel</button></div></div>`;preview()}function preview(){let a=N($('na')?.value),r=N($('nr')?.value),m=N($('nm')?.value),c=$('nc')?.value||'MMK';if($('prev'))$('prev').textContent=a?`အတိုး ${M(a*r/100,c)} · စုစုပေါင်း ${M(a+a*r/100,c)} · ${m?Math.ceil((a+a*r/100)/m)+' လ':'လစဉ်ငွေ မသတ်မှတ်ရသေး'}`:'ငွေပမာဏထည့်ပါ'}function saveLoan(){let n=$('nn').value.trim(),a=N($('na').value);if(!n||a<=0)return toast('အမည်နဲ့ ငွေပမာဏ ထည့်ပါ');let p={id:'p'+Date.now(),name:n,phone:$('np').value,amount:a,currency:$('nc').value,date:$('nd').value||T(),rate:N($('nr').value)||10,monthly:N($('nm').value),stop:false};d.people.push(p);save();cur=p.id;toast('ချေးငွေ သိမ်းပြီးပါပြီ ✓');page('detail')}function borrowers(){$('borrowers').innerHTML=`<div class=card><h2>👥 Borrowers</h2><input id=qs class=field placeholder="အမည် / ဖုန်း ရှာရန်"><div id=bl></div></div>`;bl()}function bl(){let q=($('qs')?.value||'').toLowerCase();$('bl').innerHTML=d.people.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(q)).map(person).join('')||'<div class=empty>စာရင်းမရှိပါ</div>'}function payments(){$('payments').innerHTML=`<div class=card><h2>💳 Payments</h2>${d.people.map(p=>`<div class=person><div class=avatar>${E((p.name||'?')[0])}</div><div class=grow><b>${E(p.name)}</b><small>${M(bal(p),p.currency)} ကျန်</small></div><button class="btn primary" data-a=pay data-id=${p.id}>ပေးမယ်</button></div>`).join('')||'<div class=empty>စာရင်းမရှိပါ</div>'}</div>`}function pay(id){let p=d.people.find(x=>x.id===id);if(!p)return;let c=bal(p);$('payments').innerHTML=`<div class=card><h2>💳 ${E(p.name)}</h2><div class=grid><div class=card>ကျန်<div class=big>${M(c,p.currency)}</div></div><div class=card>အတိုး<div class=big>${M(ip(p),p.currency)}</div></div></div><div class=field><label>ပေးချေငွေ</label><input id=pa type=number value=${c}></div><div class=grid><div class=field><label>အတိုး</label><input id=pi type=number value=${Math.min(c,ip(p))}></div><div class=field><label>အရင်း</label><input id=pp type=number value=${Math.max(0,c-Math.min(c,ip(p))) }></div></div><button class="btn green full" data-a=savePay data-id=${id}>✓ Save Payment</button><button class="btn full" data-page=payments>Cancel</button></div>`}function savePay(){let p=d.people.find(x=>x.id===cur)||d.people.find(x=>x.id===document.querySelector('[data-a=savePay]')?.dataset.id);let a=N($('pa')?.value),i=N($('pi')?.value),pr=N($('pp')?.value);if(!p||a<=0)return toast('ပေးချေငွေထည့်ပါ');d.payments.push({id:'q'+Date.now(),pid:p.id,amount:a,date:T(),i,p:pr});save();toast('Payment သိမ်းပြီးပါပြီ ✓');page('detail')}function detail(id=cur){let p=d.people.find(x=>x.id===id);if(!p)return page('borrowers');let c=bal(p),h=d.payments.filter(x=>x.pid===p.id).map(x=>`<tr><td>${x.date}</td><td>${M(x.amount,p.currency)}</td><td>${M(x.i,p.currency)}</td><td>${M(x.p,p.currency)}</td></tr>`).join('')||'<tr><td colspan=4>Payment မရှိသေးပါ</td></tr>';$('detail').innerHTML=`<div class=card><div class=row><h2>👤 ${E(p.name)}</h2><button class=btn data-page=borrowers>←</button></div><div class=grid><div class=card>ချေးငွေ<div class=big>${M(p.amount,p.currency)}</div></div><div class=card>ကျန်<div class=big>${M(c,p.currency)}</div></div></div><div class=card>အတိုးကျန် <b>${M(ip(p),p.currency)}</b></div><button class="btn primary full" data-a=pay data-id=${p.id}>💳 Payment</button><div class=table><table><thead><tr><th>ရက်</th><th>ပေးငွေ</th><th>အတိုး</th><th>အရင်း</th></tr></thead><tbody>${h}</tbody></table></div></div>`}function reports(){$('reports').innerHTML=`<div class=card><h2>📊 Reports</h2><div class=grid><div class=card>MMK<div class=big>${M(d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+bal(p),0),'MMK')}</div></div><div class=card>THB<div class=big>${M(d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+bal(p),0),'THB')}</div></div></div></div>`}function settings(){$('settings').innerHTML=`<div class=card><h2>⚙ Settings</h2><div class=field><label>Default Interest % / လ</label><input id=sr type=number value=${d.rate||10}></div><div class=field><label>Default Currency</label><select id=sc><option ${d.currency==='MMK'?'selected':''}>MMK</option><option ${d.currency==='THB'?'selected':''}>THB</option></select></div><button class="btn green full" data-a=saveSettings>✓ Save Settings</button><button class="btn full" data-a=backup>⬇ Backup</button><label class="btn full" style="display:block;text-align:center">⬆ Restore<input id=rf type=file accept=application/json hidden></label></div>`}function saveSettings(){d.rate=N($('sr').value)||10;d.currency=$('sc').value;save();toast('Settings saved ✓');page('dashboard')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='MK-Debt-Backup.json';a.click();toast('Backup ထုတ်ပြီးပါပြီ')}function del(id){if(!confirm('ဒီစာရင်းကို ဖျက်မလား?'))return;d.people=d.people.filter(p=>p.id!==id);d.payments=d.payments.filter(x=>x.pid!==id);save();page('borrowers')}document.addEventListener('click',e=>{let q=e.target.closest('[data-page]');if(q){page(q.dataset.page);return}let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,id=b.dataset.id;if(a==='closeLoan'){page('dashboard');return}else if(a==='saveLoan')saveLoan();else if(a==='detail'){cur=id;page('detail')}else if(a==='pay'){cur=id;pay(id)}else if(a==='savePay')savePay();else if(a==='edit')edit(id);else if(a==='saveEdit')saveEdit();else if(a==='del')del(id);else if(a==='saveSettings')saveSettings();else if(a==='backup')backup()});document.addEventListener('input',e=>{if(['na','nr','nm'].includes(e.target.id))preview();if(e.target.id==='qs')bl()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('newloan')?.classList.contains('active'))page('dashboard')});document.addEventListener('change',e=>{if(e.target.id==='rf'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.people)throw 0;d=x;save();toast('Restore အောင်မြင်ပါပြီ ✓');page('dashboard')}catch(z){toast('Backup မမှန်ပါ')}};r.readAsText(e.target.files[0])}});page('dashboard');
</script></body></html>
