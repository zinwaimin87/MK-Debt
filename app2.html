<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9fe8ff"><title>MK Debt</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Myanmar",sans-serif;color:#fff}body{background:radial-gradient(circle at 10% 5%,#ffd66b 0,transparent 28%),radial-gradient(circle at 90% 10%,#70d7ff 0,transparent 30%),radial-gradient(circle at 50% 55%,#c98cff 0,transparent 34%),linear-gradient(135deg,#9fe8ff,#e9c8ff 38%,#c7f7d2 68%,#fff1b8);background-attachment:fixed}.app{max-width:430px;margin:auto;min-height:100vh;background:#ffffff18;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid #ffffff70;border-right:1px solid #ffffff55}.top{position:sticky;top:0;z-index:5;padding:15px 14px;background:#ffffff25;backdrop-filter:blur(24px);border-bottom:1px solid #fff8}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#ffffffaa,#67d9ff88,#a66affaa);border:1px solid #fff;box-shadow:inset 0 1px #fff,0 9px 24px #6b62c955}.brand h1{margin:0;font-size:30px}.brand small{color:#f4f6ffcc}.content{padding:14px 12px 105px}.card{padding:14px;margin-bottom:11px;border-radius:24px;background:linear-gradient(145deg,#ffffff62,#ffffff20);border:1px solid #ffffff75;box-shadow:inset 0 1px #fff,0 10px 28px #42639b25;backdrop-filter:blur(20px)}.hero{background:linear-gradient(135deg,#ffffff65,#77d8ff40,#a66aff42)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:112px;padding:12px;border-radius:22px;background:#ffffff45;border:1px solid #fff9;box-shadow:inset 0 1px #fff,0 8px 22px #42639b22}.stat span{font-size:25px}.stat small{display:block;color:#fffD}.stat b{display:block;margin-top:6px;font-size:16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.q{min-height:88px;border:1px solid #fff9;border-radius:20px;background:#ffffff40;color:#fff;font-weight:700}.q span{display:block;font-size:27px;margin-bottom:5px}.field{margin:8px 0;padding:10px;border-radius:15px;background:#ffffff2c;border:1px solid #fff9}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.person{display:flex;align-items:center;gap:10px;padding:11px;margin:8px 0;border-radius:20px;background:#ffffff35;border:1px solid #fff9}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#fff9,#66d8ff99,#a66affaa);border:1px solid #fff}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.right{text-align:right}.big{font-size:23px;font-weight:800}.muted{color:#fffC}.btn{width:100%;min-height:45px;margin-top:8px;border:1px solid #fff9;border-radius:15px;background:#ffffff35;color:#fff;font-weight:700}.primary{background:linear-gradient(135deg,#55d8ffdd,#9a63ffdd);border:0}.green{background:linear-gradient(135deg,#4ce6b1dd,#36a9dadb);border:0}.danger{background:#9c304dcc}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row .btn{width:auto}.page{display:none}.page.active{display:block}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:8px 5px 7px;background:#ffffff30;border:1px solid #fff9;border-bottom:0;border-radius:28px 28px 0 0;backdrop-filter:blur(25px)}.nav{border:0;background:transparent;color:#fffC;border-radius:18px;padding:6px 2px;font-size:11px}.nav b{display:block;font-size:21px}.nav.active{background:linear-gradient(145deg,#ffffff55,#a970ff75);box-shadow:inset 0 1px #fff}@media(max-width:360px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.quick{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>Loan Management · 3D Mobile</small></div></div></header><main class="content"><section id="dashboard" class="page active"><div class="card hero"><div class="row"><div><div class="muted">MK DEBT · OWNER</div><h2>ချေးငွေ စီမံခန့်ခွဲမှု</h2><div class="muted">Loan · Interest · Payment</div></div><div class="logo">💎</div></div></div><div class="stats"><div class="stat"><span>💰</span><small>Total Loan</small><b>0 MMK</b><small>0 THB</small></div><div class="stat"><span>📊</span><small>Total Paid</small><b>0 MMK</b><small>0 THB</small></div><div class="stat"><span>◔</span><small>Remaining</small><b>0 MMK</b><small>0 THB</small></div></div><div class="quick"><button class="q" data-page="newloan"><span>➕</span>Add Loan</button><button class="q" data-page="borrowers"><span>👥</span>Borrowers</button><button class="q" data-page="payments"><span>💳</span>Payment</button><button class="q" data-page="reports"><span>📈</span>Reports</button></div><div class="card"><div class="field"><input id="search" placeholder="🔍 Search borrower..."></div></div><div class="card"><h3>👥 Borrowers</h3><div id="list"><div class="muted">စာရင်းမရှိသေးပါ</div></div></div></section><section id="newloan" class="page"><div class="card"><h2>➕ Add Loan</h2><div class="field"><label>အမည်</label><input id="name"></div><div class="field"><label>ဖုန်း</label><input id="phone" type="tel"></div><div class="field"><label>ငွေပမာဏ</label><input id="amount" type="number"></div><div class="field"><label>Currency</label><select id="currency"><option>MMK</option><option>THB</option></select></div><div class="field"><label>အတိုး % / လ</label><input id="rate" type="number" value="10"></div><div class="field"><label>ချေးသည့်ရက်</label><input id="date" type="date"></div><div class="field"><label>လစဉ်ပေးငွေ</label><input id="monthly" type="number"></div><button class="btn green" id="saveLoan">✓ Save Loan</button></div></section><section id="borrowers" class="page"><div class="card"><h2>👥 Borrowers</h2><div id="borrowList"></div></div></section><section id="payments" class="page"><div class="card"><h2>💳 Payments</h2><div id="payList"></div></div></section><section id="reports" class="page"><div class="card"><h2>📈 Reports</h2><div id="report"></div></div></section><section id="settings" class="page"><div class="card"><h2>⚙ Settings</h2><div class="field"><label>Default Interest %</label><input id="defaultRate" type="number" value="10"></div><button class="btn green" id="saveSettings">✓ Save</button></div></section><section id="detail" class="page"><div class="card" id="detailBox"></div></section></main></div><nav class="bottom"><button class="nav active" data-page="dashboard"><b>⌂</b>Home</button><button class="nav" data-page="borrowers"><b>👥</b>Borrowers</button><button class="nav" data-page="newloan"><b>＋</b>Add Loan</button><button class="nav" data-page="payments"><b>↙</b>Payment</button><button class="nav" data-page="settings"><b>☷</b>More</button></nav><script>var KEY='mk-debt-live-v2',d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d||!Array.isArray(d.people))d={rate:10,people:[],payments:[]};if(!Array.isArray(d.payments))d.payments=[];function $(x){return document.getElementById(x)}function n(x){return Number(x)||0}function money(x,c){return n(x).toLocaleString()+' '+c}function save(){localStorage.setItem(KEY,JSON.stringify(d))}function months(p){var a=new Date((p.date||new Date().toISOString().slice(0,10))+'T00:00:00'),b=new Date();return Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())}function interest(p){var paid=d.payments.filter(function(x){return x.pid===p.id}).reduce(function(s,x){return s+n(x.interest)},0);return Math.max(0,n(p.amount)*n(p.rate||10)/100*months(p)-paid)}function principal(p){return d.payments.filter(function(x){return x.pid===p.id}).reduce(function(s,x){return s+n(x.principal)},0)}function balance(p){return Math.max(0,n(p.amount)-principal(p)+interest(p))}function show(id){document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});$(id).classList.add('active');document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-page')===id)});if(id==='dashboard')dash();if(id==='borrowers')borrow();if(id==='payments')paymentList();if(id==='reports')report();window.scrollTo(0,0)}function person(p){return '<div class="person" data-id="'+p.id+'"><div class="avatar">'+String(p.name||'?').charAt(0)+'</div><div class="grow"><b>'+p.name+'</b><small>'+ (p.phone||'-')+' · '+p.currency+'</small></div><div class="right"><b>'+money(balance(p),p.currency)+'</b><small class="muted">ကျန်</small></div></div>'}function dash(){var mm=d.people.filter(function(p){return p.currency==='MMK'}).reduce(function(s,p){return s+balance(p)},0),tt=d.people.filter(function(p){return p.currency==='THB'}).reduce(function(s,p){return s+balance(p)},0),lm=d.people.filter(function(p){return p.currency==='MMK'}).reduce(function(s,p){return s+n(p.amount)},0),lt=d.people.filter(function(p){return p.currency==='THB'}).reduce(function(s,p){return s+n(p.amount)},0);$('dashboard').querySelector('.stats').innerHTML='<div class="stat"><span>💰</span><small>Total Loan</small><b>'+money(lm,'MMK')+'</b><small>'+money(lt,'THB')+'</small></div><div class="stat"><span>📊</span><small>Total Paid</small><b>'+money(d.payments.filter(function(x){var p=d.people.find(function(p){return p.id===x.pid});return p&&p.currency==='MMK'}).reduce(function(s,x){return s+n(x.principal)},0),'MMK')+'</b><small>'+money(d.payments.filter(function(x){var p=d.people.find(function(p){return p.id===x.pid});return p&&p.currency==='THB'}).reduce(function(s,x){return s+n(x.principal)},0),'THB')+'</small></div><div class="stat"><span>◔</span><small>Remaining</small><b>'+money(mm,'MMK')+'</b><small>'+money(tt,'THB')+'</small></div>';$('list').innerHTML=d.people.length?d.people.slice().reverse().map(person).join(''):'<div class="muted">စာရင်းမရှိသေးပါ</div>'}function borrow(){$('borrowList').innerHTML=d.people.length?d.people.map(person).join(''):'<div class="muted">Borrower မရှိသေးပါ</div>'}function paymentList(){$('payList').innerHTML=d.people.length?d.people.map(function(p){return '<div class="person"><div class="grow"><b>'+p.name+'</b><small>'+money(balance(p),p.currency)+' ကျန်</small></div><button class="btn green" style="width:auto" data-pay="'+p.id+'">ပေးချေ</button></div>'}).join(''):'<div class="muted">Borrower မရှိသေးပါ</div>'}function report(){$('report').innerHTML='<p>Borrowers: <b>'+d.people.length+'</b></p><p>Payments: <b>'+d.payments.length+'</b></p><p>MMK Loan: <b>'+money(d.people.filter(function(p){return p.currency==='MMK'}).reduce(function(s,p){return s+n(p.amount)},0),'MMK')+'</b></p><p>THB Loan: <b>'+money(d.people.filter(function(p){return p.currency==='THB'}).reduce(function(s,p){return s+n(p.amount)},0),'THB')+'</b></p>'}function detail(id){var p=d.people.find(function(x){return x.id===id});if(!p)return;show('detail');$('detailBox').innerHTML='<div class="row"><h2>👤 '+p.name+'</h2><button class="btn" data-page="borrowers">←</button></div><p class="muted">Loan: '+money(p.amount,p.currency)+'</p><p class="big">Remaining: '+money(balance(p),p.currency)+'</p><p class="muted">Interest: '+(p.rate||10)+'% / month</p><button class="btn primary" data-pay="'+p.id+'">💳 Payment</button>'}function pay(id){var p=d.people.find(function(x){return x.id===id});if(!p)return;show('detail');var b=balance(p),i=Math.min(b,interest(p)),a=Math.min(b,n(p.monthly)||b);$('detailBox').innerHTML='<h2>💳 Payment · '+p.name+'</h2><p class="muted">Remaining '+money(b,p.currency)+'</p><div class="field"><label>ပေးချေငွေ</label><input id="pa" type="number" value="'+a+'"></div><div class="field"><label>အတိုး</label><input id="pi" type="number" value="'+i+'"></div><div class="field"><label>အရင်း</label><input id="pp" type="number" value="'+Math.max(0,a-i)+'"></div><button class="btn green" id="savePay">✓ Save Payment</button><button class="btn" data-page="payments">Cancel</button>';$('pa').oninput=sync;$('pi').oninput=sync;function sync(){$('pp').value=Math.max(0,n($('pa').value)-n($('pi').value))}$('savePay').onclick=function(){var a=n($('pa').value),i=n($('pi').value),pr=n($('pp').value);if(a<=0)return alert('ပေးချေငွေထည့်ပါ');if(i+pr>a)return alert('အတိုး + အရင်း မကျော်ပါစေနဲ့');d.payments.push({id:'pay'+Date.now(),pid:p.id,amount:a,interest:i,principal:pr,date:new Date().toISOString().slice(0,10)});save();detail(p.id)}}document.addEventListener('click',function(e){var pg=e.target.closest('[data-page]');if(pg){show(pg.getAttribute('data-page'));return}var pe=e.target.closest('[data-pay]');if(pe){pay(pe.getAttribute('data-pay'));return}var row=e.target.closest('.person[data-id]');if(row){detail(row.getAttribute('data-id'));return}});document.addEventListener('DOMContentLoaded',function(){dash();$('saveLoan').onclick=function(){var name=$('name').value.trim(),amt=n($('amount').value);if(!name||amt<=0)return alert('အမည်နဲ့ ငွေပမာဏ ထည့်ပါ');d.people.push({id:'p'+Date.now(),name:name,phone:$('phone').value,amount:amt,currency:$('currency').value,rate:n($('rate').value)||10,date:$('date').value||new Date().toISOString().slice(0,10),monthly:n($('monthly').value),stop:false});save();$('name').value='';$('phone').value='';$('amount').value='';show('dashboard')};$('saveSettings').onclick=function(){d.rate=n($('defaultRate').value)||10;save();alert('Settings saved')}})</script></body></html>
