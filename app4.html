<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a8e8ff"><title>MK Debt</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Myanmar",sans-serif;color:#fff}body{background:radial-gradient(circle at 10% 5%,#ffd66b,transparent 28%),radial-gradient(circle at 90% 10%,#70d7ff,transparent 30%),radial-gradient(circle at 50% 55%,#c98cff,transparent 34%),linear-gradient(135deg,#9fe8ff,#e9c8ff 38%,#c7f7d2 68%,#fff1b8);background-attachment:fixed}.app{max-width:430px;margin:auto;min-height:100vh;background:#ffffff18;backdrop-filter:blur(18px)}.top{position:sticky;top:0;z-index:5;padding:14px;background:#ffffff35;backdrop-filter:blur(24px);border-bottom:1px solid #fff8}.brand{display:flex;align-items:center;gap:12px}.logo{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#ffffffaa,#67d9ff88,#a66affaa);border:1px solid #fff;box-shadow:inset 0 1px #fff,0 9px 24px #6b62c955}.brand h1{margin:0;font-size:29px}.brand small{color:#f4f6ffdd}.content{padding:13px 12px 105px}.page{display:none}.page.active{display:block}.card{padding:14px;margin-bottom:11px;border-radius:24px;background:linear-gradient(145deg,#ffffff62,#ffffff20);border:1px solid #ffffff75;box-shadow:inset 0 1px #fff,0 10px 28px #42639b25;backdrop-filter:blur(20px)}.hero{background:linear-gradient(135deg,#ffffff65,#77d8ff40,#a66aff42)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:105px;padding:11px;border-radius:21px;background:#ffffff45;border:1px solid #fff9;box-shadow:inset 0 1px #fff,0 8px 22px #42639b22}.stat span{font-size:24px}.stat small{display:block;color:#ffffffdd}.stat b{display:block;margin-top:5px;font-size:14px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.q{min-height:80px;border:1px solid #fff9;border-radius:20px;background:#ffffff40;color:#fff;font-weight:700}.q span{display:block;font-size:25px;margin-bottom:5px}.field{margin:8px 0;padding:10px;border-radius:15px;background:#ffffff2c;border:1px solid #fff9}.field label{display:block;font-size:12px;color:#fff;margin-bottom:4px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.field option{color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{width:100%;min-height:45px;margin-top:8px;border:1px solid #fff9;border-radius:15px;background:#ffffff35;color:#fff;font-weight:700}.primary{background:linear-gradient(135deg,#55d8ffdd,#9a63ffdd);border:0}.green{background:linear-gradient(135deg,#4ce6b1dd,#36a9dadb);border:0}.danger{background:#a33a54cc}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row .btn{width:auto}.person{display:flex;align-items:center;gap:10px;padding:11px;margin:8px 0;border-radius:20px;background:#ffffff35;border:1px solid #fff9}.avatar{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#fff9,#66d8ff99,#a66affaa);border:1px solid #fff}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.right{text-align:right}.big{font-size:23px;font-weight:800}.muted{color:#ffffffcc}.empty{text-align:center;padding:24px;color:#ffffffcc}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:7px 5px;background:#ffffff30;border:1px solid #fff9;border-bottom:0;border-radius:27px 27px 0 0;backdrop-filter:blur(25px)}.nav{border:0;background:transparent;color:#fff;padding:6px 2px;border-radius:18px;font-size:11px}.nav b{display:block;font-size:21px}.nav.active{background:linear-gradient(145deg,#ffffff55,#a970ff75);box-shadow:inset 0 1px #fff}@media(max-width:360px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.quick{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>Loan Management · 3D Mobile</small></div></div></header><main class="content"><section id="dashboard" class="page active"></section><section id="newloan" class="page"></section><section id="borrowers" class="page"></section><section id="payments" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="detail" class="page"></section></main></div><nav class="bottom"><button class="nav active" data-page="dashboard"><b>⌂</b>Home</button><button class="nav" data-page="borrowers"><b>👥</b>Borrowers</button><button class="nav" data-page="newloan"><b>＋</b>Add Loan</button><button class="nav" data-page="payments"><b>↙</b>Payment</button><button class="nav" data-page="settings"><b>☷</b>More</button></nav><script>(function(){'use strict';var KEY='mk-debt-live-v4',data={rate:10,people:[],payments:[]},currentId=null;try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.people))data=x}catch(e){}if(!Array.isArray(data.payments))data.payments=[];function el(id){return document.getElementById(id)}function n(v){var x=Number(v);return isFinite(x)?x:0}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function date(){return new Date().toISOString().slice(0,10)}function money(v,c){return n(v).toLocaleString()+' '+c}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function pays(id){return data.payments.filter(function(x){return x.pid===id})}function pp(p){return pays(p.id).reduce(function(s,x){return s+n(x.principal)},0)}function ip(p){return pays(p.id).reduce(function(s,x){return s+n(x.interest)},0)}function months(p){var a=new Date((p.date||date())+'T00:00:00'),b=new Date();return Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())}function interest(p){if(p.interestStopped)return 0;return Math.max(0,n(p.amount)*n(p.rate||data.rate||10)/100*months(p)-ip(p))}function bal(p){return Math.max(0,n(p.amount)-pp(p)+interest(p))}function go(id){document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});el(id).classList.add('active');document.querySelectorAll('.nav').forEach(function(x){x.classList.toggle('active',x.dataset.page===id)});render(id);window.scrollTo(0,0)}function cardPerson(p){return '<div class="person" data-action="detail" data-id="'+esc(p.id)+'"><div class="avatar">'+esc((p.name||'?').charAt(0))+'</div><div class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.phone||'-')+' · '+esc(p.currency)+'</small></div><div class="right"><b>'+money(bal(p),p.currency)+'</b><small class="muted">ကျန်</small></div></div>'}function dashboard(){var lm=0,lt=0,mm=0,mt=0,pm=0,pt=0;data.people.forEach(function(p){if(p.currency==='MMK'){lm+=n(p.amount);mm+=bal(p);pm+=pp(p)}else{lt+=n(p.amount);mt+=bal(p);pt+=pp(p)}});el('dashboard').innerHTML='<div class="card hero"><div class="row"><div><div class="muted">MK DEBT · OWNER</div><h2>ချေးငွေ စီမံခန့်ခွဲမှု</h2><div class="muted">Loan · Interest · Payment</div></div><div class="logo">💎</div></div></div><div class="stats"><div class="stat"><span>💰</span><small>Total Loan</small><b>'+money(lm,'MMK')+'</b><small>'+money(lt,'THB')+'</small></div><div class="stat"><span>📊</span><small>Total Paid</small><b>'+money(pm,'MMK')+'</b><small>'+money(pt,'THB')+'</small></div><div class="stat"><span>◔</span><small>Remaining</small><b>'+money(mm,'MMK')+'</b><small>'+money(mt,'THB')+'</small></div></div><div class="quick"><button class="q" data-page="newloan"><span>➕</span>Add Loan</button><button class="q" data-page="borrowers"><span>👥</span>Borrowers</button><button class="q" data-page="payments"><span>💳</span>Payment</button><button class="q" data-page="reports"><span>📈</span>Reports</button></div><div class="card"><div class="field"><input id="search" placeholder="🔍 Search borrower..."></div></div><div class="card"><h3>👥 Borrowers · '+data.people.length+'</h3><div id="peopleList">'+(data.people.slice().reverse().map(cardPerson).join('')||'<div class="empty">စာရင်းမရှိသေးပါ</div>')+'</div></div>';el('search').oninput=function(){var q=this.value.toLowerCase();el('peopleList').innerHTML=data.people.filter(function(p){return (String(p.name)+' '+String(p.phone||'')).toLowerCase().includes(q)}).map(cardPerson).join('')||'<div class="empty">မတွေ့ပါ</div>'}}function newLoan(){el('newloan').innerHTML='<div class="card"><div class="row"><h2>➕ Add Loan</h2><button class="btn" data-page="dashboard">×</button></div><div class="field"><label>အမည် *</label><input id="ln"></div><div class="field"><label>ဖုန်း</label><input id="lp" type="tel"></div><div class="grid"><div class="field"><label>ငွေပမာဏ *</label><input id="la" type="number" inputmode="decimal"></div><div class="field"><label>Currency</label><select id="lc"><option>MMK</option><option>THB</option></select></div></div><div class="grid"><div class="field"><label>ချေးသည့်ရက်</label><input id="ld" type="date" value="'+date()+'"></div><div class="field"><label>အတိုး % / လ</label><input id="lr" type="number" value="'+n(data.rate||10)+'" step="0.1"></div></div><div class="field"><label>လစဉ်ပေးငွေ</label><input id="lm" type="number"></div><button class="btn green" data-action="saveLoan">✓ Save Loan</button></div>'}function borrowers(){el('borrowers').innerHTML='<div class="card"><h2>👥 Borrowers</h2><div class="field"><input id="bs" placeholder="အမည် / ဖုန်း ရှာရန်"></div><div id="bl">'+(data.people.map(cardPerson).join('')||'<div class="empty">Borrower မရှိသေးပါ</div>')+'</div></div>';el('bs').oninput=function(){var q=this.value.toLowerCase();el('bl').innerHTML=data.people.filter(function(p){return (String(p.name)+' '+String(p.phone||'')).toLowerCase().includes(q)}).map(cardPerson).join('')||'<div class="empty">မတွေ့ပါ</div>'}}function payments(){el('payments').innerHTML='<div class="card"><h2>💳 Payment</h2>'+(data.people.map(function(p){return '<div class="person"><div class="avatar">'+esc((p.name||'?').charAt(0))+'</div><div class="grow"><b>'+esc(p.name)+'</b><small>'+money(bal(p),p.currency)+' ကျန်</small></div><button class="btn green" style="width:auto" data-action="pay" data-id="'+esc(p.id)+'">ပေးချေ</button></div>'}).join('')||'<div class="empty">Borrower မရှိသေးပါ</div>')+'</div>'}function payForm(id){var p=data.people.find(function(x){return x.id===id});if(!p)return;currentId=id;var b=bal(p),i=Math.min(b,interest(p)),a=Math.min(b,n(p.monthly)||b),pr=Math.max(0,a-i);el('payments').innerHTML='<div class="card"><div class="row"><h2>💳 '+esc(p.name)+'</h2><button class="btn" data-page="payments">←</button></div><div class="card"><div class="muted">လက်ကျန်</div><div class="big">'+money(b,p.currency)+'</div></div><div class="field"><label>ပေးချေငွေ *</label><input id="pa" type="number" value="'+a+'"></div><div class="field"><label>အတိုး</label><input id="pi" type="number" value="'+i+'"></div><div class="field"><label>အရင်း</label><input id="pr" type="number" value="'+pr+'"></div><button class="btn green" data-action="savePay">✓ Save Payment</button></div>'}function detail(id){var p=data.people.find(function(x){return x.id===id});if(!p)return;currentId=id;el('detail').innerHTML='<div class="card"><div class="row"><h2>👤 '+esc(p.name)+'</h2><button class="btn" data-page="borrowers">←</button></div><p>Phone: '+esc(p.phone||'-')+'</p><p>Loan: <b>'+money(p.amount,p.currency)+'</b></p><p>Interest: <b>'+n(p.rate||data.rate||10)+'% / month</b></p><p>Interest Due: <b>'+money(interest(p),p.currency)+'</b></p><p>Principal Paid: <b>'+money(pp(p),p.currency)+'</b></p><p class="big">Remaining: '+money(bal(p),p.currency)+'</p><button class="btn primary" data-action="pay" data-id="'+esc(p.id)+'">💳 Payment</button><button class="btn" data-action="toggle" data-id="'+esc(p.id)+'">'+(p.interestStopped?'▶ Start Interest':'⏸ Stop Interest')+'</button><button class="btn danger" data-action="delete" data-id="'+esc(p.id)+'">🗑 Delete Borrower</button></div><div class="card"><h3>Payment History</h3>'+(pays(p.id).slice().reverse().map(function(x){return '<div class="person"><div class="grow"><b>'+esc(x.date)+'</b><small>Interest '+money(x.interest,p.currency)+' · Principal '+money(x.principal,p.currency)+'</small></div><b>'+money(n(x.interest)+n(x.principal),p.currency)+'</b></div>'}).join('')||'<div class="empty">Payment မရှိသေးပါ</div>')+'</div>'}function reports(){var mm=0,mt=0,im=0,it=0;data.people.forEach(function(p){if(p.currency==='MMK'){mm+=bal(p);im+=ip(p)}else{mt+=bal(p);it+=ip(p)}});el('reports').innerHTML='<div class="card"><h2>📈 Reports</h2><div class="stats"><div class="stat"><small>MMK Remaining</small><b>'+money(mm,'MMK')+'</b></div><div class="stat"><small>THB Remaining</small><b>'+money(mt,'THB')+'</b></div><div class="stat"><small>Borrowers</small><b>'+data.people.length+'</b></div></div><p>Interest Received — MMK: <b>'+money(im,'MMK')+'</b></p><p>Interest Received — THB: <b>'+money(it,'THB')+'</b></p><p>Payments: <b>'+data.payments.length+'</b></p></div>'}function settings(){el('settings').innerHTML='<div class="card"><h2>⚙ Settings</h2><div class="field"><label>Default Interest % / လ</label><input id="dr" type="number" value="'+n(data.rate||10)+'" step="0.1"></div><button class="btn green" data-action="settings">✓ Save Settings</button><button class="btn" data-action="backup">⬇ Backup Data</button><button class="btn danger" data-action="reset">Reset All Data</button></div>'}function render(id){if(id==='dashboard')dashboard();else if(id==='newloan')newLoan();else if(id==='borrowers')borrowers();else if(id==='payments')payments();else if(id==='reports')reports();else if(id==='settings')settings();else if(id==='detail')detail(currentId)}function saveLoan(){var name=el('ln').value.trim(),amount=n(el('la').value);if(!name||amount<=0){alert('အမည်နှင့် ငွေပမာဏ ထည့်ပါ');return}data.people.push({id:String(Date.now())+Math.random().toString(16).slice(2),name:name,phone:el('lp').value.trim(),amount:amount,currency:el('lc').value,date:el('ld').value||date(),rate:n(el('lr').value)||n(data.rate)||10,monthly:n(el('lm').value),interestStopped:false});save();go('dashboard')}function savePay(){var p=data.people.find(function(x){return x.id===currentId});if(!p)return;var total=n(el('pa').value),ii=n(el('pi').value),pr=n(el('pr').value);if(total<=0||ii<0||pr<0||Math.abs(total-ii-pr)>0.01){alert('ပေးချေငွေ = အတိုး + အရင်း ဖြစ်ရပါမယ်');return}if(total>bal(p)+0.01){alert('လက်ကျန်ထက် မပိုရပါ');return}data.payments.push({id:String(Date.now()),pid:p.id,date:date(),interest:ii,principal:pr});save();go('detail')}function backup(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='mk-debt-backup.json';a.click()}document.addEventListener('click',function(e){var t=e.target.closest('[data-page],[data-action]');if(!t)return;if(t.dataset.page){go(t.dataset.page);return}var a=t.dataset.action,id=t.dataset.id;if(a==='detail'){currentId=id;go('detail')}else if(a==='pay')payForm(id);else if(a==='saveLoan')saveLoan();else if(a==='savePay')savePay();else if(a==='toggle'){var p=data.people.find(function(x){return x.id===id});if(p){p.interestStopped=!p.interestStopped;save();detail(id)}}else if(a==='delete'&&confirm('ဒီ borrower ကို ဖျက်မလား?')){data.people=data.people.filter(function(x){return x.id!==id});data.payments=data.payments.filter(function(x){return x.pid!==id});save();go('borrowers')}else if(a==='settings'){data.rate=n(el('dr').value)||10;save();go('settings')}else if(a==='backup')backup();else if(a==='reset'&&confirm('Data အားလုံးဖျက်မလား?')){data={rate:10,people:[],payments:[]};save();go('dashboard')}});render('dashboard')})();</script></body></html>
