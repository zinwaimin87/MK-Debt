<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MK Debt</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Myanmar",sans-serif;color:#fff}body{background:radial-gradient(circle at 10% 5%,#ffd66b 0,transparent 28%),radial-gradient(circle at 90% 10%,#70d7ff 0,transparent 30%),radial-gradient(circle at 50% 55%,#c98cff 0,transparent 34%),linear-gradient(135deg,#9fe8ff,#e9c8ff 38%,#c7f7d2 68%,#fff1b8);background-attachment:fixed}.app{max-width:430px;margin:auto;min-height:100vh;background:#ffffff12;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid #ffffff70;border-right:1px solid #ffffff55;box-shadow:0 0 60px #5275b233}.top{position:sticky;top:0;z-index:5;padding:15px 14px;background:#ffffff25;backdrop-filter:blur(24px);border-bottom:1px solid #fff8}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#ffffffaa,#67d9ff88,#a66affaa);border:1px solid #fff;box-shadow:inset 0 1px #fff,0 9px 24px #6b62c955}.brand h1{margin:0;font-size:30px}.brand small{color:#f4f6ffcc}.content{padding:14px 12px 105px}.page{display:none}.page.active{display:block}.card{padding:14px;margin-bottom:11px;border-radius:24px;background:linear-gradient(145deg,#ffffff62,#ffffff20);border:1px solid #ffffff75;box-shadow:inset 0 1px #fff,0 10px 28px #42639b25;backdrop-filter:blur(20px)}.hero{background:linear-gradient(135deg,#ffffff65,#77d8ff40,#a66aff42)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:112px;padding:12px;border-radius:22px;background:#ffffff45;border:1px solid #fff9;box-shadow:inset 0 1px #fff,0 8px 22px #42639b22}.stat span{font-size:25px}.stat small{display:block;color:#fffD}.stat b{display:block;margin-top:6px;font-size:16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.q{min-height:88px;border:1px solid #fff9;border-radius:20px;background:#ffffff40;color:#fff;font-weight:700;box-shadow:inset 0 1px #fff,0 8px 18px #4766a522}.q span{display:block;font-size:27px;margin-bottom:5px}.field{margin:8px 0;padding:10px;border-radius:15px;background:#ffffff2c;border:1px solid #fff9;box-shadow:inset 0 1px #fff6}.field label{display:block;font-size:13px;color:#fffD;margin-bottom:4px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:16px}.field option{color:#111}.btn{width:100%;min-height:45px;margin-top:8px;border:1px solid #fff9;border-radius:15px;background:#ffffff35;color:#fff;font-weight:700;box-shadow:inset 0 1px #fff8,0 6px 16px #4766a522}.primary{background:linear-gradient(135deg,#55d8ffdd,#9a63ffdd);border:0}.green{background:linear-gradient(135deg,#4ce6b1dd,#36a9dadb);border:0}.danger{background:#9c304dcc}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row .btn{width:auto}.person{display:flex;align-items:center;gap:10px;padding:11px;margin:8px 0;border-radius:20px;background:#ffffff35;border:1px solid #fff9;box-shadow:inset 0 1px #fff8,0 7px 18px #4766a522}.avatar{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#fff9,#66d8ff99,#a66affaa);border:1px solid #fff}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.right{text-align:right}.big{font-size:23px;font-weight:800}.muted{color:#fffC}.empty{text-align:center;padding:25px;color:#fffB}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding:8px 5px 7px;background:#ffffff30;border:1px solid #fff9;border-bottom:0;border-radius:28px 28px 0 0;backdrop-filter:blur(25px);box-shadow:0 -8px 28px #46649b35}.nav{border:0;background:transparent;color:#fffC;border-radius:18px;padding:6px 2px;font-size:11px}.nav b{display:block;font-size:21px}.nav.active{background:linear-gradient(145deg,#ffffff55,#a970ff75);box-shadow:inset 0 1px #fff}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #fff4;white-space:nowrap;text-align:left}@media(max-width:360px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.quick{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">💎</div><div><h1>MK Debt</h1><small>Loan Management · 3D Mobile</small></div></div></header><main class="content"><section id="dashboard" class="page active"></section><section id="newloan" class="page"></section><section id="borrowers" class="page"></section><section id="payments" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="detail" class="page"></section></main></div><nav class="bottom"><button class="nav active" data-page="dashboard"><b>⌂</b>Home</button><button class="nav" data-page="borrowers"><b>👥</b>Borrowers</button><button class="nav" data-page="newloan"><b>＋</b>Add Loan</button><button class="nav" data-page="payments"><b>↙</b>Payment</button><button class="nav" data-page="settings"><b>☷</b>More</button></nav><script>const K='mk-debt-live-v2',$=i=>document.getElementById(i),N=x=>Number(x)||0,T=()=>new Date().toISOString().slice(0,10),M=(n,c)=>N(n).toLocaleString()+' '+c,E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let d;try{d=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!d||!Array.isArray(d.people))d={rate:10,currency:'MMK',people:[],payments:[]};if(!Array.isArray(d.payments))d.payments=[];let cur=null;const save=()=>localStorage.setItem(K,JSON.stringify(d));function inte(p){if(p.stop)return 0;let a=new Date((p.date||T())+'T00:00:00'),b=new Date(),m=Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth());let paid=d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+N(x.interest),0);return Math.max(0,N(p.amount)*N(p.rate)/100*m-paid)}function prin(p){return d.payments.filter(x=>x.pid===p.id).reduce((s,x)=>s+N(x.principal),0)}function bal(p){return Math.max(0,N(p.amount)-prin(p)+inte(p))}function nav(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));render(id);scrollTo(0,0)}function person(p){return `<div class="person" data-a="detail" data-id="${p.id}"><div class="avatar">${E((p.name||'?')[0])}</div><div class="grow"><b>${E(p.name)}</b><small>${E(p.phone||'-')} · ${p.currency}</small></div><div class="right"><b>${M(bal(p),p.currency)}</b><small class="muted">ကျန်</small></div></div>`}function dashboard(){let mm=d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+bal(p),0),tt=d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+bal(p),0),lm=d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+N(p.amount),0),lt=d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+N(p.amount),0),pm=d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+prin(p),0),pt=d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+prin(p),0);$('dashboard').innerHTML=`<div class="card hero"><div class="row"><div><div class="muted">MK DEBT · OWNER</div><h2>ချေးငွေ စီမံခန့်ခွဲမှု</h2><div class="muted">Loan · Interest · Payment</div></div><div class="logo">💎</div></div></div><div class="stats"><div class="stat"><span>💰</span><small>Total Loan</small><b>${M(lm,'MMK')}</b><small>${M(lt,'THB')}</small></div><div class="stat"><span>📊</span><small>Total Paid</small><b>${M(pm,'MMK')}</b><small>${M(pt,'THB')}</small></div><div class="stat"><span>◔</span><small>Remaining</small><b>${M(mm,'MMK')}</b><small>${M(tt,'THB')}</small></div></div><div class="quick"><button class="q" data-page="newloan"><span>➕</span>Add Loan</button><button class="q" data-page="borrowers"><span>👥</span>Borrowers</button><button class="q" data-page="payments"><span>💳</span>Payment</button><button class="q" data-page="reports"><span>📈</span>Reports</button></div><div class="card"><div class="field"><input id="hs" placeholder="🔍 Search borrower..."></div></div><div class="card"><h3>👥 Borrowers · ${d.people.length}</h3><div id="plist">${d.people.slice().reverse().map(person).join('')||'<div class="empty">စာရင်းမရှိသေးပါ</div>'}</div></div>`;$('hs').oninput=()=>{let q=$('hs').value.toLowerCase();$('plist').innerHTML=d.people.filter(p=>(p.name+' '+(p.phone||'')).toLowerCase().includes(q)).map(person).join('')||'<div class="empty">မတွေ့ပါ</div>'}}function newloan(){$('newloan').innerHTML=`<div class="card"><div class="row"><h2>➕ Add Loan</h2><button class="btn" data-page="dashboard">×</button></div><div class="field"><label>အမည် *</label><input id="n"></div><div class="field"><label>ဖုန်း</label><input id="ph" type="tel"></div><div class="grid"><div class="field"><label>ငွေပမာဏ *</label><input id="amt" type="number" inputmode="decimal"></div><div class="field"><label>Currency</label><select id="curc"><option>MMK</option><option>THB</option></select></div></div><div class="grid"><div class="field"><label>ချေးသည့်ရက်</label><input id="dt" type="date" value="${T()}"></div><div class="field"><label>အတိုး % / လ</label><input id="rate" type="number" value="${d.rate||10}" step="0.1"></div></div><div class="field"><label>လစဉ်ပေးငွေ</label><input id="mon" type="number"></div><button class="btn green" data-a="loan">✓ Save Loan</button><button class="btn" data-page="dashboard">Cancel</button></div>`}function borrowers(){$('borrowers').innerHTML=`<div class="card"><h2>👥 Borrowers</h2><div class="field"><input id="bs" placeholder="အမည် / ဖုန်း ရှာရန်"></div><div id="bl">${d.people.map(person).join('')||'<div class="empty">Borrower မရှိသေးပါ</div>'}</div></div>`;$('bs').oninput=()=>{let q=$('bs').value.toLowerCase();$('bl').innerHTML=d.people.filter(p=>(p.name+' '+(p.phone||'')).toLowerCase().includes(q)).map(person).join('')||'<div class="empty">မတွေ့ပါ</div>'}}function payments(){$('payments').innerHTML=`<div class="card"><h2>💳 Payment</h2>${d.people.map(p=>`<div class="person"><div class="avatar">${E((p.name||'?')[0])}</div><div class="grow"><b>${E(p.name)}</b><small>${M(bal(p),p.currency)} ကျန်</small></div><button class="btn green" style="width:auto" data-a="pay" data-id="${p.id}">ပေးချေ</button></div>`).join('')||'<div class="empty">Borrower မရှိသေးပါ</div>'}</div>`}function pay(id){let p=d.people.find(x=>x.id===id);if(!p)return;cur=id;let b=bal(p),i=Math.min(b,inte(p)),a=Math.min(b,N(p.monthly)||b),pr=Math.max(0,a-i);$('payments').innerHTML=`<div class="card"><div class="row"><h2>💳 ${E(p.name)}</h2><button class="btn" data-page="payments">←</button></div><div class="card"><div class="muted">လက်ကျန်</div><div class="big">${M(b,p.currency)}</div></div><div class="field"><label>ပေးချေငွေ *</label><input id="pa" type="number" value="${a||''}" max="${b}"></div><div class="field"><label>အတိုး</label><input id="pi" type="number" value="${i}"></div><div class="field"><label>အရင်း</label><input id="pp" type="number" value="${pr}"></div><button class="btn green" data-a="savepay" data-id="${id}">✓ Save Payment</button></div>`;let sync=()=>{$('pp').value=Math.max(0,Math.min(b,N($('pa').value))-Math.min(Math.min(b,N($('pa').value)),Math.max(0,N($('pi').value))));};$('pa').oninput=sync;$('pi').oninput=sync;sync()}function detail(id){let p=d.people.find(x=>x.id===id);if(!p)return;cur=id;let rows=d.payments.filter(x=>x.pid===id).slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${M(x.amount,p.currency)}</td><td>${M(x.interest,p.currency)}</td><td>${M(x.principal,p.currency)}</td></tr>`).join('')||'<tr><td colspan="4">Payment မရှိသေးပါ</td></tr>';$('detail').innerHTML=`<div class="card"><div class="row"><h2>👤 ${E(p.name)}</h2><button class="btn" data-page="borrowers">←</button></div><div class="grid"><div class="card"><div class="muted">Loan</div><div class="big">${M(p.amount,p.currency)}</div></div><div class="card"><div class="muted">ကျန်</div><div class="big">${M(bal(p),p.currency)}</div></div></div><p class="muted">Phone: ${E(p.phone||'-')} · ${p.rate}% / လ</p><button class="btn primary" data-a="pay" data-id="${id}">💳 Payment</button><button class="btn danger" data-a="delete" data-id="${id}">🗑 Delete</button></div><div class="card"><h3>Payment History</h3><div class="table"><table><thead><tr><th>ရက်</th><th>ပေးငွေ</th><th>အတိုး</th><th>အရင်း</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}function reports(){$('reports').innerHTML=`<div class="card"><h2>📈 Reports</h2><div class="grid"><div class="card"><div class="muted">MMK Loan</div><div class="big">${M(d.people.filter(p=>p.currency==='MMK').reduce((s,p)=>s+N(p.amount),0),'MMK')}</div></div><div class="card"><div class="muted">THB Loan</div><div class="big">${M(d.people.filter(p=>p.currency==='THB').reduce((s,p)=>s+N(p.amount),0),'THB')}</div></div></div><p>Borrowers: <b>${d.people.length}</b></p><p>Payments: <b>${d.payments.length}</b></p></div>`}function settings(){$('settings').innerHTML=`<div class="card"><h2>⚙ Settings</h2><div class="field"><label>Default Interest % / လ</label><input id="sr" type="number" value="${d.rate||10}"></div><button class="btn green" data-a="settingsave">✓ Save Settings</button></div>`}function render(id){({dashboard,newloan,borrowers,payments,reports,settings,detail}[id]||dashboard)()}document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){nav(p.dataset.page);return}let a=e.target.closest('[data-a]');if(!a)return;let id=a.dataset.id;if(a.dataset.a==='detail'){nav('detail');detail(id)}else if(a.dataset.a==='pay'){nav('payments');pay(id)}else if(a.dataset.a==='loan'){let n=$('n').value.trim(),amt=N($('amt').value);if(!n||amt<=0)return alert('အမည်နဲ့ ငွေပမာဏ ထည့်ပါ');let p={id:'p'+Date.now(),name:n,phone:$('ph').value,amount:amt,currency:$('curc').value,date:$('dt').value||T(),rate:N($('rate').value)||10,monthly:N($('mon').value),stop:false};d.people.push(p);save();nav('detail');detail(p.id)}else if(a.dataset.a==='savepay'){let p=d.people.find(x=>x.id===id),amt=N($('pa').value),ii=N($('pi').value),pr=N($('pp').value);if(!p||amt<=0)return alert('ပေးချေငွေထည့်ပါ');if(ii+pr>amt)return alert('အတိုး + အရင်း မကျော်ပါစေနဲ့');d.payments.push({id:'q'+Date.now(),pid:p.id,amount:amt,interest:ii,principal:pr,date:T()});save();nav('detail');detail(p.id)}else if(a.dataset.a==='delete'){if(confirm('ဒီ Borrower ကို ဖျက်မလား?')){d.people=d.people.filter(p=>p.id!==id);d.payments=d.payments.filter(x=>x.pid!==id);save();nav('borrowers')}}else if(a.dataset.a==='settingsave'){d.rate=N($('sr').value)||10;save();nav('dashboard')}});render('dashboard');</script></body></html>
